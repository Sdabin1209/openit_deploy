# 배치 정의(ADR 0061): 서버 이름·주소·지역·그 서버에 둘 서비스. 서버·지역이 바뀌면 이 파일만 고친다(스크립트·compose·이미지는 그대로).
# 서비스 이름은 compose.yaml 의 서비스 이름과 같다. 한 서비스는 한 서버에만 둔다. 기반(postgres, step-ca, keycloak, gateway)은 어디엔가 놓아야 한다.
# DB 접속 비밀(db-*-dsn)을 쓰는 서비스는 자기 영역 DB(<서비스>-db)와 다른 서버에 둘 수 있다(게시 포트 필요)(DSN 의 호스트가 영역 DB 서비스 이름 <서비스>-db 다).
# 확인: .venv/bin/python scripts/placement.py validate ansible/inventory.example.yml    실행: ansible-playbook -i <인벤토리> ansible/site.yml
all:
  vars:
    placement_scheme: https        # 서버 사이 호출 스킴
    # 서버가 둘 이상이면 다른 서버에서 불리는 서비스마다 게시 포트를 명시한다(ansible/inventory.multi.example.yml)
  hosts:
    core-1:
      ansible_host: core-1.example.internal
      placement_region: region-a
      placement_services: [survey-db, question-authoring-db, ops-feedback-db, release-gate-db, keycloak-db, step-ca, keycloak, oauth2-proxy, gateway, kiosk-frontend, admin-console, survey-service, question-authoring, ops-feedback-ingest, release-gate, model-serving, model-registry, dataset-store]
