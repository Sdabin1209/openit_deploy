# 서버 둘 이상의 배치 예(ADR 0061). 다른 서버에서 불리는 서비스는 placement_ports 에 게시 포트를 명시해야 한다(빠지면 validate 가 거부한다).
# placement_bind_address: 그 서버가 다른 서버에 열어 주는 포트의 바인드 주소(서버 사이 망의 사설 주소). 게이트웨이가 아니면 사람·기기 입구가 아니다: 서비스 토큰 인증 + TLS.
all:
  vars:
    placement_scheme: https
    placement_ports: {step-ca: 19000, backup-store: 18443, survey-db: 15432, identity: 18080, ops-feedback: 18081, release-gate: 18082}
  hosts:
    data-1:
      ansible_host: 10.0.0.11
      placement_bind_address: 10.0.0.11
      placement_region: region-a
      placement_services: [survey-db, question-authoring-db, ops-feedback-db, release-gate-db, identity-db, backup-store, step-ca, identity, question-authoring, ops-feedback, release-gate, model-registry, dataset-store]
    app-1:
      ansible_host: 10.0.0.12
      placement_bind_address: 10.0.0.12
      placement_region: region-b
      placement_services: [identity-proxy, gateway, kiosk-frontend, admin-console, survey-service, model-serving]
