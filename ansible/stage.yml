---
# 한 단계: 이 서버의 서비스 중 stage_i 단계에 든 것을 올리고(이미 떠 있으면 바뀌지 않는다), 다른 서버가 부를 서비스(게시 포트)는 지휘 기계에서 /readyz 로 기다린다.
# 다른 서버의 step-ca 가 발급하는 일회용 토큰(OTT, 수명 5분)을 이 서버에 놓는다: step-ca 서버에서 pki-tokens 를 다시 돌려(프로비저너 비밀은 그 서버 밖으로 나가지 않는다) 토큰과 루트 인증서(공개)만 지휘 기계를 거쳐 이 서버의 볼륨으로 쓴다.
# 이 서버에 인증서가 아직 없는 서비스만 받는다(다시 실행하면 건너뛴다). 이 단계의 <서비스>-cert 기동 직전에 한다.
- name: "단계 {{ stage_i }}: 인증서가 아직 없는 서비스 찾기"
  ansible.builtin.shell: |
    UTIL=$(sed -n 's/^UTIL_IMAGE=//p' "{{ p_dir }}/locks/images.lock")
    for n in {{ plan.stage_tokens[stage_i] | join(' ') }}; do
      if [ "$n" = postgres ]; then v={{ p_project }}_pg-tls; f=server.crt; else v={{ p_project }}_certs-$n; f=tls.crt; fi
      if docker volume inspect "$v" >/dev/null 2>&1 && docker run --rm --network none -v "$v:/c:ro" "$UTIL" test -s "/c/$f"; then continue; fi
      echo "$n"
    done
  args: {executable: /bin/bash}
  register: missing
  changed_when: false
  when: plan.stage_tokens[stage_i] | length > 0
- name: "단계 {{ stage_i }}: step-ca 서버에서 토큰 다시 발급하고 읽기 (출력 안 함)"
  ansible.builtin.shell: |
    set -e
    cd "{{ ca_dir }}"
    export DEPLOY_NO_DOCKER=0 SECRETS_DIR="{{ ca_dir }}/secrets" SECRETS_GID="{{ hostvars[plan.step_ca_host].gid }}" COMPOSE_EXTRA="{{ ca_dir }}/compose.placement.yaml" CONFIG_DIR="{{ ca_dir }}/config"
    source scripts/lib.sh
    dc "{{ ca_project }}" run --rm pki-tokens >/dev/null 2>&1
    UTIL=$(sed -n 's/^UTIL_IMAGE=//p' "{{ ca_dir }}/locks/images.lock")
    docker run --rm --network none -v "{{ ca_project }}_pki-tokens:/t:ro" -v "{{ ca_project }}_pki-root:/r:ro" "$UTIL" python -c 'import json,sys;print(json.dumps({"root":open("/r/root_ca.crt").read(),"tokens":{n:open("/t/%s.ott"%n).read().strip() for n in sys.argv[1:]}}))' {{ missing.stdout_lines | join(' ') }}
  args: {executable: /bin/bash}
  vars:
    ca_dir: "{{ hostvars[plan.step_ca_host].placement_remote_dir | default('/opt/openit-deploy') }}"
    ca_project: "{{ hostvars[plan.step_ca_host].placement_project | default('deploy') }}"
  delegate_to: "{{ plan.step_ca_host | default(inventory_hostname, true) }}"
  register: tokens
  no_log: true
  changed_when: false
  when: plan.stage_tokens[stage_i] | length > 0 and (missing.stdout_lines | length) > 0
- name: "단계 {{ stage_i }}: 이 서버의 토큰 볼륨에 쓰기 (640)"
  ansible.builtin.shell: |
    set -e
    UTIL=$(sed -n 's/^UTIL_IMAGE=//p' "{{ p_dir }}/locks/images.lock")
    for v in pki-tokens pki-root; do
      docker volume inspect "{{ p_project }}_$v" >/dev/null 2>&1 || docker volume create --label "com.docker.compose.project={{ p_project }}" --label "com.docker.compose.volume=$v" "{{ p_project }}_$v" >/dev/null
    done
    docker run -i --rm --network none --user 0 -v "{{ p_project }}_pki-tokens:/t" -v "{{ p_project }}_pki-root:/r" -v "{{ p_dir }}/scripts/put-tokens.py:/p.py:ro" "$UTIL" python /p.py
  args:
    executable: /bin/bash
    stdin: "{{ tokens.stdout }}"
  no_log: true
  changed_when: true
  when: plan.stage_tokens[stage_i] | length > 0 and (missing.stdout_lines | length) > 0
- name: "단계 {{ stage_i }}: 기동 {{ plan.stages[stage_i] | join(' ') }}"
  ansible.builtin.shell: |
    set -e
    cd "{{ p_dir }}"
    export DEPLOY_NO_DOCKER=0 SECRETS_DIR="{{ p_dir }}/secrets" SECRETS_GID="{{ gid }}" COMPOSE_EXTRA="{{ p_dir }}/compose.placement.yaml" CONFIG_DIR="{{ p_dir }}/config"
    source scripts/lib.sh
    dc "{{ p_project }}" up -d --wait {{ plan.stages[stage_i] | join(' ') }}
  args: {executable: /bin/bash}
  register: up
  # compose 는 진행 상황을 표준 오류에 낸다. 새로 만들거나 시작했을 때만 바뀐 것으로 센다
  changed_when: "(up.stderr | default('')) is search('(Created|Started|Recreated|Starting) *$', multiline=True)"
  when: plan.stages[stage_i] | length > 0
- name: "단계 {{ stage_i }}: 게시된 서비스의 https /readyz (지휘 기계에서, 인증서 이름 = 서비스 이름이라 --resolve 로 이름을 서버 주소에 맞춘다)"
  ansible.builtin.command:
    argv: "{{ ['curl', '-fsS', '--max-time', '5', '-o', '/dev/null', '--resolve', item.key ~ ':' ~ item.value ~ ':' ~ (placement_probe_address | default(ansible_host))] + (['--cacert', placement_ca_path] if placement_ca_path is defined else []) + ['https://' ~ item.key ~ ':' ~ (item.value | string) ~ '/readyz'] }}"
  register: ready_tls
  until: ready_tls.rc == 0
  retries: 30
  delay: 2
  changed_when: false
  delegate_to: localhost
  when: p_scheme == 'https'
  loop: "{{ plan.published | dict2items | selectattr('key', 'in', plan.stages[stage_i]) | rejectattr('key', 'equalto', 'postgres') | list }}"
  loop_control: {label: "{{ item.key }}"}
- name: "단계 {{ stage_i }}: 게시된 HTTP 서비스의 /readyz (지휘 기계에서)"
  when: p_scheme != 'https'
  ansible.builtin.uri:
    url: "{{ p_scheme }}://{{ placement_probe_address | default(ansible_host) }}:{{ item.value }}/readyz"
    status_code: 200
    validate_certs: "{{ placement_validate_certs | default(true) | bool }}"
    ca_path: "{{ placement_ca_path | default(omit) }}"
    timeout: 5
  register: ready
  until: ready.status == 200
  retries: 30
  delay: 2
  changed_when: false
  delegate_to: localhost
  loop: "{{ plan.published | dict2items | selectattr('key', 'in', plan.stages[stage_i]) | rejectattr('key', 'equalto', 'postgres') | list }}"
  loop_control: {label: "{{ item.key }}"}
- name: "단계 {{ stage_i }}: postgres 게시 포트(TCP)"
  ansible.builtin.wait_for:
    host: "{{ placement_probe_address | default(ansible_host) }}"
    port: "{{ plan.published.postgres }}"
    timeout: 60
  delegate_to: localhost
  when: "'postgres' in plan.published and 'postgres' in plan.stages[stage_i]"
