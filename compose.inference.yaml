# 단독 추론 서버(D72): model-serving 컨테이너 하나를 이 파일만으로 다른 호스트에서 띄운다.
# deploy 의 compose.yaml·네트워크·서비스 이름·잠금 파일에 의존하지 않는다. 문진 스키마는 이미지에 내장되어 있다(/opt/survey-schema).
#
# 필수 변수 (이 셋만 있으면 `docker compose -f compose.inference.yaml config` 가 데몬 없이 병합된다):
#   변수                 뜻
#   INFERENCE_IMAGE      이미지 전체 참조, digest 로 고정(예: <레지스트리>/openit/model-serving@sha256:...). GPU 변형 이미지도 여기에 둔다
#   RELEASE_URL          release-gate 주소(서버가 번들을 직접 읽는다). 이 호스트에서 닿아야 한다
#   INFERENCE_TOKENS_FILE         파일 경로(값이 아니다). 내용: <호출자>=<토큰>[,...] 한 줄 (MODEL_RUNTIME_TOKENS, D84)
#   INFERENCE_RELEASE_TOKEN_FILE  파일 경로(값이 아니다). 내용: 게이트 읽기 토큰 하나 (MODEL_RUNTIME_RELEASE_TOKEN)
#                        두 파일은 컨테이너(uid 10001)가 읽을 수 있어야 한다(모드 644, 비밀을 둔 폴더는 700). 토큰은 환경 변수로 넣지 않는다.
# 선택 변수:
#   INFERENCE_CONFIG_ENV_FILE  (비밀 아닌) 모델 설정 env 파일 경로(프로파일 등). 토큰을 넣지 않는다. 기본 /dev/null
#   INFERENCE_BACKEND    기본 fake. GPU 변형 이미지는 model-runtime 이 정한 값(vllm 등)
#   INFERENCE_BIND       호스트 바인드 주소. 기본 127.0.0.1 (다른 호스트의 survey-service 가 부르는 외부 추론 서버로 쓸 때만 0.0.0.0 또는 그 호스트 주소로 바꾼다. 토큰이 있어도 HTTP 평문이다)
#   INFERENCE_PORT       호스트 포트. 기본 8080. 빈 값(INFERENCE_PORT=)이면 Docker 가 배정한다(`docker port` 로 읽는다)
# 사용 (추론 서버를 둘 호스트에서):
#   INFERENCE_IMAGE=... RELEASE_URL=... INFERENCE_TOKENS_FILE=... INFERENCE_RELEASE_TOKEN_FILE=... docker compose -p deploy-inference -f compose.inference.yaml up -d --wait
name: deploy-inference

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true
  tmpfs: ["/tmp"]
  logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}

secrets:
  model-runtime-tokens: {file: "${INFERENCE_TOKENS_FILE:?INFERENCE_TOKENS_FILE(MODEL_RUNTIME_TOKENS 값이 든 파일 경로)이 필요하다}"}
  model-runtime-release-token: {file: "${INFERENCE_RELEASE_TOKEN_FILE:?INFERENCE_RELEASE_TOKEN_FILE(게이트 읽기 토큰이 든 파일 경로)이 필요하다}"}

volumes:
  serving-data:     # 번들 캐시(게이트에서 다시 받을 수 있다)
  # hf-cache:       # GPU 변형: Hugging Face 모델 캐시. 아래 model-serving 의 주석을 같이 푼다 (마운트 경로는 이미지가 준비한 /var/lib/model-runtime/hf)

services:
  model-serving:
    <<: *hardening
    image: ${INFERENCE_IMAGE:?INFERENCE_IMAGE(model-serving 이미지, digest 참조)가 필요하다}
    env_file:
      - ${INFERENCE_CONFIG_ENV_FILE:-/dev/null}   # 비밀 아님
    secrets: [model-runtime-tokens, model-runtime-release-token]
    environment:
      MODEL_RUNTIME_TOKENS_FILE: /run/secrets/model-runtime-tokens
      MODEL_RUNTIME_RELEASE_TOKEN_FILE: /run/secrets/model-runtime-release-token
      MODEL_RUNTIME_BACKEND: ${INFERENCE_BACKEND:-fake}
      MODEL_RUNTIME_ALLOW_FAKE: "${INFERENCE_ALLOW_FAKE:-}"   # v0.7.3: fake 백엔드는 INFERENCE_ALLOW_FAKE=1 일 때만 시작한다(시험·개발 전용). vllm 에는 필요 없다
      MODEL_RUNTIME_RELEASE_URL: ${RELEASE_URL:?RELEASE_URL(release-gate 주소)이 필요하다}
    # 읽기 전용 루트의 캐시·홈 위치와 원격 측정 차단은 model-runtime v0.5.3 부터 이미지 ENV 기본값이다(여기서 다시 정하지 않는다).
    volumes:
      - serving-data:/var/lib/model-runtime
      # - hf-cache:/var/lib/model-runtime/hf   # GPU 변형(예시, 주석): 이미지가 uid 10001 소유로 준비한 HF_HOME 기본 경로. HF_HOME 을 덮어쓰지 않는다
    extra_hosts: ["host.docker.internal:host-gateway"]   # 게이트가 같은 호스트의 다른 컴포즈 프로젝트에 있을 때(시험·단일 서버)
    ports:
      - "${INFERENCE_BIND:-127.0.0.1}:${INFERENCE_PORT-8080}:8080"
    # GPU 예약(예시, 주석): NVIDIA Container Toolkit 이 있는 호스트에서
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - {driver: nvidia, count: all, capabilities: [gpu]}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
