# 단독 추론 서버(D72): model-serving 컨테이너 하나를 이 파일만으로 다른 호스트에서 띄운다.
# deploy 의 compose.yaml·네트워크·서비스 이름·잠금 파일에 의존하지 않는다. 문진 스키마는 이미지에 내장되어 있다(/opt/survey-schema).
#
# 필수 변수 (이 다섯이면 `docker compose -f compose.inference.yaml config` 가 데몬 없이 병합된다):
#   변수                 뜻
#   INFERENCE_IMAGE      이미지 전체 참조, digest 로 고정(예: <레지스트리>/openit/model-serving@sha256:...). GPU 변형 이미지도 여기에 둔다
#   release-gate 이름 풀이: 다른 서버면 compose.inference.remote.yaml(INFERENCE_RELEASE_ADDR = OUT-FILE hosts 표의 `<주소> release-gate`), 같은 호스트면 compose.inference.samehost.yaml(INFERENCE_RELEASE_NETWORK = 주 서버 프로젝트의 inference-in 망, Docker DNS). 둘 중 하나를 -f 로 더한다
#   INFERENCE_TOKENS_FILE         파일 경로(값이 아니다). 내용: <호출자>=<토큰>[,...] 한 줄 (MODEL_RUNTIME_TOKENS, D84)
#   INFERENCE_RELEASE_TOKEN_FILE  파일 경로(값이 아니다). 내용: release-gate 읽기 토큰 하나(deploy 의 secrets/tokens/gate-read-model-serving). 받는 영역(release-gate)이 직접 대조한다(공개 입구의 기계 토큰 경로는 내보내지 않는다, 계약 3.4.7)
#   INFERENCE_PKI_ROOT_FILE  파일 경로. deploy step-ca 의 루트 인증서(공개, 비밀 아님; deploy 호스트의 pki-root 볼륨 root_ca.crt). 사이드카가 ACME 서버를 검증하는 데 쓴다(ADR 0060)
#   INFERENCE_STEP_CA_URL        deploy step-ca 주소(https://<step-ca 주소>:9000). 이 서버 -> step-ca 경로만 있으면 된다(도전 없음)
#   INFERENCE_TLS_TOKEN_FILE     파일 경로. 지휘 쪽이 `step ca token <INFERENCE_TLS_NAME>` 으로 발급한 일회용 토큰(5분). 인증서의 SAN 은 토큰이 정한다(step 은 --token 과 --san 을 함께 받지 않는다): 같은 호스트에서 localhost 로도 부르려면 토큰을 `--san <이름> --san localhost` 로 발급한다
#   INFERENCE_PAUSE_IMAGE  네트워크 공간만 잡는 컨테이너 이미지(pause, digest 참조; deploy 잠금의 PAUSE_IMAGE)
#   INFERENCE_STEP_IMAGE         platform step-ca 이미지(digest 참조, 잠금의 STEP_CA_DIGEST; cert 부명령으로 발급·갱신한다)
#   INFERENCE_TLS_NAME   이 서버의 이름(호출자가 https://<이름> 으로 부르는 DNS 이름 = 인증서 이름)
#   INFERENCE_GATEWAY_IMAGE  platform 영역 게이트웨이 이미지(area-gateway, digest 참조; 잠금의 AREA_GATEWAY_DIGEST): 들어오는 쪽 TLS 종단 + 나가는 쪽 loopback CONNECT 출구
#   INFERENCE_EXPOSURE_FILE  파일 경로. 추론 서버 이미지의 라벨 io.openit.exposure 를 꺼낸 파일(deploy 의 scripts/gen-gateways.py 가 만든 state/gateways/model-serving/exposure.json)
#   SECRETS_GID          토큰 파일들의 그룹 gid(제품 compose 와 같은 변수, scripts/lib.sh 의 기본값은 id -g). 파일은 640 이고 이 그룹이다
#   INFERENCE_CA_FILE    파일 경로. 주 서버가 내보낸 OUT-FILE 의 root_ca.crt(step-ca 루트, 공개 인증서). SHA256SUMS 로 대조한 뒤 쓴다(R1.5). configs 로 /etc/openit/gateway-ca.crt 에 넣고 SSL_CERT_FILE 이 가리킨다(계약 클라이언트에 CA 인자가 없고 Python 기본 SSL 컨텍스트가 이 변수를 읽는다)
#                        토큰 파일 두 개와 TLS 토큰 파일은 모드 640 + 그룹 SECRETS_GID 다(제품 compose 와 같은 규칙, 컨테이너는 group_add 로 읽는다; 비밀을 둔 폴더는 700). 토큰은 환경 변수로 넣지 않는다.
# 선택 변수:
#   INFERENCE_CONFIG_ENV_FILE  (비밀 아닌) 모델 설정 env 파일 경로(프로파일 등). 토큰을 넣지 않는다. 기본 /dev/null
#   INFERENCE_BACKEND    기본 fake. GPU 변형 이미지는 model-runtime 이 정한 값(vllm 등)
#   INFERENCE_BIND       호스트 바인드 주소. 기본 127.0.0.1 (감사 B8: 인증은 Bearer 토큰뿐이고 TLS 가 없어 기본으로 밖에 열지 않는다).
#                        다른 호스트의 호출자가 닿아야 하면 서버의 사설 인터페이스 주소(권장) 또는 0.0.0.0 을 **명시**하고 방화벽으로 호출자만 허용한다. docs/RUN.md 7-1
#   INFERENCE_NETWORK_MODE  기본 bridge. 게이트웨이에 ssh 터널처럼 **호스트 루프백**으로만 닿을 때 host 로 준다(컨테이너가 호스트 네트워크를 쓰므로 127.0.0.1 이 호스트다).
#                        host 모드에서는 ports 게시가 무시되고 서버가 INFERENCE_LISTEN_HOST(기본 0.0.0.0):8080 에 직접 열린다 -- 밖에 열지 않으려면 INFERENCE_LISTEN_HOST=127.0.0.1 을 같이 준다
#   INFERENCE_PORT       호스트 포트. 기본 8080. 빈 값(INFERENCE_PORT=)이면 Docker 가 배정한다(`docker port` 로 읽는다)
# 사용 (추론 서버를 둘 호스트에서):
#   INFERENCE_IMAGE=... INFERENCE_TOKENS_FILE=... INFERENCE_RELEASE_TOKEN_FILE=... INFERENCE_CA_FILE=... docker compose -p deploy-inference -f compose.inference.yaml up -d --wait
name: deploy-inference

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true
  tmpfs: ["/tmp"]
  logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
  group_add: ["${SECRETS_GID:?SECRETS_GID(토큰 파일의 그룹 gid)가 필요하다}"]   # L02(ADR 0054): 비밀 파일은 640 + 이 그룹이다. 누구나 읽게(644) 하지 않는다

secrets:
  tls-token: {file: "${INFERENCE_TLS_TOKEN_FILE:?INFERENCE_TLS_TOKEN_FILE(일회용 토큰 OTT 가 든 파일 경로)이 필요하다}"}
  model-runtime-tokens: {file: "${INFERENCE_TOKENS_FILE:?INFERENCE_TOKENS_FILE(MODEL_RUNTIME_TOKENS 값이 든 파일 경로)이 필요하다}"}
  model-runtime-release-token: {file: "${INFERENCE_RELEASE_TOKEN_FILE:?INFERENCE_RELEASE_TOKEN_FILE(게이트 읽기 토큰이 든 파일 경로)이 필요하다}"}

configs:
  exposure: {file: "${INFERENCE_EXPOSURE_FILE:?INFERENCE_EXPOSURE_FILE(영역 Exposure 선언 파일 경로)이 필요하다}"}
  pki-root: {file: "${INFERENCE_PKI_ROOT_FILE:?INFERENCE_PKI_ROOT_FILE(step-ca 루트 인증서 파일 경로)이 필요하다}"}
  gateway-ca: {file: "${INFERENCE_CA_FILE:?INFERENCE_CA_FILE(OUT-FILE 의 root_ca.crt 경로, scripts/export-out-files.sh)가 필요하다}"}

volumes:
  certs:            # model-serving-cert 가 쓰고 사이드카가 읽는 서버 인증서·키
  serving-data:     # 번들 캐시(게이트에서 다시 받을 수 있다)
  # hf-cache:       # GPU 변형: Hugging Face 모델 캐시. 아래 model-serving 의 주석을 같이 푼다 (마운트 경로는 이미지가 준비한 /var/lib/model-runtime/hf)

x-common-env: &commonenv   # CommonEnv(계약): compose.yaml 의 같은 이름 앵커와 같은 값. 이 파일은 compose.yaml 에 의존하지 않아(D72) 앵커를 다시 적는다. 자기 영역 게이트웨이(model-serving-gw)의 loopback CONNECT 출구다(R1.8): AREA_GATEWAY_EGRESS_PORT 와 같은 3128
  OPENIT_EGRESS_PROXY: "http://127.0.0.1:3128"

services:
  model-serving-net:   # model-serving 의 네트워크 공간만 갖는 작은 컨테이너(pause, RUNTIME.md R3.2): 게시 포트·extra_hosts·sysctls·network_mode 는 여기에만 둔다. 앱·사이드카가 network_mode: service:model-serving-net 으로 붙어 앱이 멈춰도 공간이 남는다(ADR 0060)
    image: ${INFERENCE_PAUSE_IMAGE:?INFERENCE_PAUSE_IMAGE(pause 이미지, digest 참조; deploy 잠금의 PAUSE_IMAGE)가 필요하다}
    restart: unless-stopped
    user: "65535:65535"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 32m   # 측정 안 함(시작값)
    cpus: 0.1
    pids_limit: 16
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
    sysctls: {net.ipv4.ip_unprivileged_port_start: 0}   # 사이드카가 추가 capability 없이 443 을 연다(ADR 0060)
    network_mode: ${INFERENCE_NETWORK_MODE:-bridge}
    extra_hosts: ["host.docker.internal:host-gateway"]   # step-ca 를 이 이름으로 부르는 배치(같은 호스트의 다른 컴포즈 프로젝트·시험)
    ports:
      - "${INFERENCE_BIND:-127.0.0.1}:${INFERENCE_PORT-443}:443"   # 밖에 열리는 것은 TLS 사이드카(443)뿐이다. 앱의 8080 은 게시하지 않는다(ADR 0060)
  model-serving:
    network_mode: "service:model-serving-net"
    <<: *hardening
    image: ${INFERENCE_IMAGE:?INFERENCE_IMAGE(model-serving 이미지, digest 참조)가 필요하다}
    env_file:
      - ${INFERENCE_CONFIG_ENV_FILE:-/dev/null}   # 비밀 아님
    secrets: [model-runtime-tokens, model-runtime-release-token]
    configs:
      - {source: gateway-ca, target: /etc/openit/gateway-ca.crt}   # 공개 인증서라 secrets 가 아니라 configs 다
    environment:
      <<: *commonenv   # release-gate 호출은 자기 영역 게이트웨이(model-serving-gw)의 출구를 거친다. 같은 서버·다른 서버 배치 모두 이 파일의 model-serving-gw 가 출구다
      SSL_CERT_FILE: /etc/openit/gateway-ca.crt   # 왜: 번들 읽기 클라이언트(boundary_contracts)와 probe() 의 urllib 이 이 CA 만으로 게이트웨이 TLS 를 검증한다. 시스템 신뢰 저장소를 고치지 않는다
      MODEL_RUNTIME_HOST: ${INFERENCE_LISTEN_HOST:-127.0.0.1}   # 앱은 TLS 사이드카(같은 네임스페이스)에게만 닿는다(ADR 0060). 게시되는 것은 사이드카 443 뿐이다
      MODEL_RUNTIME_TOKENS_FILE: /run/secrets/model-runtime-tokens
      MODEL_RUNTIME_RELEASE_TOKEN_FILE: /run/secrets/model-runtime-release-token
      MODEL_RUNTIME_BACKEND: ${INFERENCE_BACKEND:-fake}
      MODEL_RUNTIME_ALLOW_FAKE: "${INFERENCE_ALLOW_FAKE:-}"   # fake 백엔드는 INFERENCE_ALLOW_FAKE=1 일 때만 시작한다(시험·개발 전용). vllm 에는 필요 없다
      MODEL_RUNTIME_RELEASE_URL: https://release-gate   # 계약 R1.5·R1.8: 컴포넌트는 자기 영역 게이트웨이(model-serving-gw)의 출구(OPENIT_EGRESS_PROXY, CONNECT)를 거쳐 release-gate:443 으로 간다(compose 밖 영역 컴포넌트도 마찬가지). 이름은 extra_hosts(OUT-FILE hosts 표)로 풀리고, 출구의 허용 목록(Exposure.egress)이 release-gate:443 이다
      MODEL_RUNTIME_EXTRACT_DEADLINE_S: "20.0"   # 요청 상한: 계약 CONVENTIONS 시간표(D125) extract 20.0초·respond 25.0초. 서버 기본 respond 2.0초에 잘리지 않게 명시한다(config/model-serving.env 와 같은 값, scripts/test_time_chain.py 가 대조)
      MODEL_RUNTIME_RESPOND_DEADLINE_S: "25.0"
    # 읽기 전용 루트의 캐시·홈 위치와 원격 측정 차단은 model-runtime v0.5.3 부터 이미지 ENV 기본값이다(여기서 다시 정하지 않는다).
    volumes:
      - serving-data:/var/lib/model-runtime
      # - hf-cache:/var/lib/model-runtime/hf   # GPU 변형(예시, 주석): 이미지가 uid 10001 소유로 준비한 HF_HOME 기본 경로. HF_HOME 을 덮어쓰지 않는다
    # GPU 예약(예시, 주석): NVIDIA Container Toolkit 이 있는 호스트에서
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - {driver: nvidia, count: all, capabilities: [gpu]}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
  certs-perms:   # 일회용: 인증서 볼륨의 소유자를 영역 게이트웨이 이미지 사용자(101)로 맞춘다(새 이름 있는 볼륨은 root 소유; 인증서 컨테이너도 101 로 돌아 키 파일 0600 을 같은 사용자가 쓰고 읽는다)
    image: ${INFERENCE_STEP_IMAGE:?INFERENCE_STEP_IMAGE가 필요하다}
    user: "0:0"
    restart: "no"
    entrypoint: ["sh", "-c", "chown -R 101:101 /certs"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    network_mode: none
    volumes: ["certs:/certs"]
  model-serving-cert:   # model-serving 의 인증서(ADR 0060): 지휘 쪽이 발급해 준 일회용 토큰(OTT, INFERENCE_TLS_TOKEN_FILE)으로 deploy step-ca 에서 한 번 받고, renew 데몬이 기존 인증서로 갱신한다. 필요한 경로는 이 컨테이너 -> step-ca 하나뿐이다
    group_add: ["${SECRETS_GID:?SECRETS_GID(토큰 파일의 그룹 gid)가 필요하다}"]   # L02(ADR 0054): 비밀 파일은 640 + 이 그룹이다. 누구나 읽게(644) 하지 않는다
    image: ${INFERENCE_STEP_IMAGE:?INFERENCE_STEP_IMAGE(step-ca 이미지, digest 참조)가 필요하다}
    user: "101:101"   # 영역 게이트웨이 이미지 사용자와 같다(키 파일 0600 을 둘이 같은 사용자로 쓰고 읽는다)
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp"]
    environment: {STEP_CA_URL: "${INFERENCE_STEP_CA_URL:?INFERENCE_STEP_CA_URL이 필요하다}", STEP_RENEW_EXPIRES_IN: 12h}
    command: ["cert", "${INFERENCE_TLS_NAME}"]   # platform step-ca 이미지의 cert 부명령(발급 + 갱신 데몬 + HEALTHCHECK). 인증서 이름은 일회용 토큰이 정한다
    secrets:
      - {source: tls-token, target: "/tokens/${INFERENCE_TLS_NAME}.ott"}   # platform cert 가 /tokens/<이름>.ott 를 읽는다
    extra_hosts: ["host.docker.internal:host-gateway"]   # step-ca 를 이 이름으로 부르는 배치(같은 호스트의 다른 컴포즈 프로젝트·시험). 다른 서버면 배치 값이 step-ca 주소를 준다
    configs:
      - {source: pki-root, target: /etc/openit/pki/root_ca.crt}
    volumes: ["certs:/certs"]
    depends_on:
      certs-perms: {condition: service_completed_successfully}
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
  model-serving-gw:   # model-serving 의 영역 게이트웨이(platform area-gateway 이미지): 들어오는 쪽 TLS 종단(서비스 이름 인증서) + 나가는 쪽 loopback CONNECT 출구(허용 목록은 영역 Exposure.egress)
    group_add: ["${SECRETS_GID:?SECRETS_GID(토큰 파일의 그룹 gid)가 필요하다}"]   # L02(ADR 0054)
    image: ${INFERENCE_GATEWAY_IMAGE:?INFERENCE_GATEWAY_IMAGE(platform area-gateway 이미지, digest 참조)가 필요하다}
    user: "101:101"
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp"]
    network_mode: "service:model-serving-net"
    environment: {AREA_GATEWAY_UPSTREAM: "127.0.0.1:8080", AREA_GATEWAY_INGRESS_PORT: "443", AREA_GATEWAY_EGRESS_PORT: "3128"}
    configs:
      - {source: exposure, target: /etc/openit/exposure.json}
    volumes: ["certs:/certs:ro"]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
    depends_on:
      model-serving: {condition: service_healthy}
      model-serving-cert: {condition: service_healthy}
