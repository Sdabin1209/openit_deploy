# 실제 LLM(GPU) 모드 override (D72/D73): model-serving 을 GPU 변형 이미지(model-serving-gpu)로 바꾸고 vLLM 백엔드로 띄운다.
# compose.yaml 위에 겹쳐 쓴다(기본 구성의 동작은 바꾸지 않는다).
# 조합 규칙:
#  - compose.external-inference.yaml 과 함께 쓰지 않는다: 그쪽은 이 구성의 model-serving 을 끄므로 GPU 설정이 의미가 없다.
#    다른 GPU 서버에 두려면 그 서버에서 compose.inference.yaml 에 INFERENCE_IMAGE=<GPU 이미지>, INFERENCE_BACKEND=vllm 을 준다(docs/RUN.md 7-1).
#  - compose.test.yaml(가짜 백엔드 고정, 위험 문구 스위치)과 함께 쓰면 -f 순서로 이 파일이 뒤에 와야 BACKEND=vllm 이 이긴다.
#    (시험용 위험 문구 스위치는 vllm 백엔드에서 의미가 없다)
# 필요한 것:
#  - 이미지: scripts/build-images.sh --gpu 로 만들고 publish-images.sh 로 게시해 잠금에 MODEL_SERVING_GPU_DIGEST 가 있어야 한다.
#  - GPU 컨테이너 접근: bash scripts/doctor.sh --llm
#  - 첫 기동은 huggingface.co 에서 모델(약 3GB)을 hf-cache 볼륨으로 받는다(인터넷 필요). 오프라인이면 볼륨을 미리 채우고 HF_HUB_OFFLINE=1.
# 변수: DEMO_LLM_PROFILE(프로파일 경로, 이미지 안 /app/profiles/ 아래. 기본 gpu-12g.json), HF_HUB_OFFLINE(기본 0)
volumes:
  hf-cache:        # Hugging Face 모델 캐시(HF_HOME). 다시 받을 수 있어 백업 대상이 아니다. 지우면 다음 기동에서 다시 받는다
services:
  model-serving:
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/model-serving-gpu@${MODEL_SERVING_GPU_DIGEST:?locks/images.lock (build-images.sh --gpu 후 publish-images.sh)}
    environment:
      MODEL_RUNTIME_BACKEND: vllm
      MODEL_RUNTIME_PROFILE: ${DEMO_LLM_PROFILE:-/app/profiles/gpu-12g.json}
      HF_HOME: /var/lib/hf-cache
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      XDG_CACHE_HOME: /var/lib/hf-cache/xdg   # read_only 루트에서 라이브러리 캐시가 쓸 곳(필요한지는 GPU 서버에서 확인 전)
    volumes:
      - hf-cache:/var/lib/hf-cache
    deploy:
      resources:
        reservations:
          devices:
            - {driver: nvidia, count: 1, capabilities: [gpu]}
    healthcheck:
      start_period: 900s   # 잠정: 첫 기동의 모델 내려받기(약 3GB)와 적재 시간은 측정 전이라 넉넉히 잡았다. 측정 후 줄인다
      interval: 15s
      timeout: 3s
      retries: 10
