# 실제 LLM(GPU) 모드 override (D72/D73): model-serving 을 GPU 변형 이미지(model-serving-gpu)로 바꾸고 vLLM 백엔드로 띄운다.
# compose.yaml 위에 겹쳐 쓴다(기본 구성의 동작은 바꾸지 않는다).
# 조합 규칙:
#  - compose.external-inference.yaml 과 함께 쓰지 않는다: 그쪽은 이 구성의 model-serving 을 끄므로 GPU 설정이 의미가 없다.
#    다른 GPU 서버에 두려면 그 서버에서 compose.inference.yaml 에 INFERENCE_IMAGE=<GPU 이미지>, INFERENCE_BACKEND=vllm 을 준다(docs/RUN.md 7-1).
#  - compose.test.yaml(가짜 백엔드 고정, 위험 문구 스위치)과 함께 쓰면 -f 순서로 이 파일이 뒤에 와야 BACKEND=vllm 이 이긴다.
#    (시험용 위험 문구 스위치는 vllm 백엔드에서 의미가 없다)
# 필요한 것:
#  - 이미지(둘 중 하나. 변수로 고른다):
#      운영/CI : build-images.sh --gpu 로 만들고 publish-images.sh model-serving-gpu 로 게시해 잠금에 MODEL_SERVING_GPU_DIGEST 가 있다(digest 고정). 기본.
#      데모    : MODEL_SERVING_GPU_IMAGE=deploy-build/model-serving-gpu:<커밋> 로 방금 빌드한 로컬 이미지를 태그로 직접 참조하고
#                MODEL_SERVING_GPU_PULL=never 로 레지스트리에서 받지 않는다(13GB 이미지를 레지스트리에 두 벌로 두지 않으려는 것; demo.sh up --llm 이 이렇게 한다).
#                digest 고정은 이 경로에서 하지 않는다.
#  - GPU 컨테이너 접근: bash scripts/doctor.sh --llm
#  - 첫 기동은 huggingface.co 에서 모델(약 3GB)을 hf-cache 볼륨으로 받는다(인터넷 필요). 오프라인이면 볼륨을 미리 채우고 HF_HUB_OFFLINE=1.
# 변수: MODEL_SERVING_GPU_IMAGE / MODEL_SERVING_GPU_PULL(위), HF_CACHE_VOLUME(기본 deploy-llm-hf-cache), DEMO_LLM_PROFILE(프로파일 경로, 이미지 안 /app/profiles/ 아래. 기본 gpu-12g.json), HF_HUB_OFFLINE(기본 0)
volumes:
  hf-cache:        # Hugging Face 모델 캐시(HF_HOME). 다시 받을 수 있어 백업 대상이 아니다.
    external: true   # 프로젝트 밖 이름 있는 볼륨: down -v / --purge 가 지우지 않는다(다음 기동에서 약 3GB를 다시 받지 않게). 없으면 만들어 둔다:
    name: ${HF_CACHE_VOLUME:-deploy-llm-hf-cache}   #   docker volume create deploy-llm-hf-cache   (demo.sh up --llm 이 만든다). 지우기: down.sh --purge-hf-cache
services:
  model-serving:
    image: ${MODEL_SERVING_GPU_IMAGE:-${DEPLOY_REGISTRY:?state/registry.env}/openit/model-serving-gpu@${MODEL_SERVING_GPU_DIGEST:?locks/images.lock (build-images.sh --gpu 후 publish-images.sh model-serving-gpu)}}
    pull_policy: ${MODEL_SERVING_GPU_PULL:-missing}
    environment:
      MODEL_RUNTIME_BACKEND: vllm
      MODEL_RUNTIME_PROFILE: ${DEMO_LLM_PROFILE:-/app/profiles/gpu-12g.json}
      HF_HOME: /var/lib/hf-cache
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      XDG_CACHE_HOME: /var/lib/hf-cache/xdg   # read_only 루트에서 라이브러리 캐시가 쓸 곳(필요한지는 GPU 서버에서 확인 전)
    volumes:
      - hf-cache:/var/lib/hf-cache
    deploy:
      resources:
        reservations:
          devices:
            - {driver: nvidia, count: 1, capabilities: [gpu]}
    healthcheck:
      start_period: 900s   # 잠정: 첫 기동의 모델 내려받기(약 3GB)와 적재 시간은 측정 전이라 넉넉히 잡았다. 측정 후 줄인다
      interval: 15s
      timeout: 3s
      retries: 10
