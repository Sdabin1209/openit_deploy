# 실제 LLM(GPU) 모드 override (D72/D73): model-serving 을 GPU 변형 이미지(model-serving-gpu)로 바꾸고 vLLM 백엔드로 띄운다.
# compose.yaml 위에 겹쳐 쓴다(기본 구성의 동작은 바꾸지 않는다).
# 조합 규칙:
#  - compose.external-inference.yaml 과 함께 쓰지 않는다: 그쪽은 이 구성의 model-serving 을 끄므로 GPU 설정이 의미가 없다.
#    다른 GPU 서버에 두려면 그 서버에서 compose.inference.yaml 에 INFERENCE_IMAGE=<GPU 이미지>, INFERENCE_BACKEND=vllm 을 준다(docs/RUN.md 7-1).
#  - compose.test.yaml(가짜 백엔드 고정, 위험 문구 스위치)과 함께 쓰면 -f 순서로 이 파일이 뒤에 와야 BACKEND=vllm 이 이긴다.
#    (시험용 위험 문구 스위치는 vllm 백엔드에서 의미가 없다)
# 필요한 것:
#  - 이미지는 이 파일에 없다. 중첩 기본값(`${A:-${B:?}}`)은 compose 가 안쪽 필수 변수를 미리 평가해 로컬 태그를 줘도 실패하는 것으로 보인다
#    (추정: 서버 시험의 오류 메시지에서. demo.sh config --llm 으로 확인한다). 그래서 선택을 파일로 나눴다. 아래 둘 중 하나를 -f 로 더한다:
#      compose.llm.digest.yaml  운영/CI: build-images.sh --gpu 후 publish-images.sh model-serving-gpu 로 게시한 digest(잠금의 MODEL_SERVING_GPU_DIGEST)
#      compose.llm.local.yaml   데모: MODEL_SERVING_GPU_IMAGE=deploy-build/model-serving-gpu:<커밋> 로컬 이미지를 태그로 직접 참조, pull_policy: never
#                               (13GB 이미지를 레지스트리에 두 벌로 두지 않으려는 것; demo.sh up --llm 이 이렇게 한다). 이 경로는 digest 고정을 하지 않는다.
#  - GPU 컨테이너 접근: bash scripts/doctor.sh --llm
#  - 첫 기동은 huggingface.co 에서 모델(약 8GB(Qwen3-4B 추정))을 hf-cache 볼륨(/var/lib/model-runtime/hf)으로 받는다(인터넷 필요). 오프라인이면 볼륨을 미리 채우고 HF_HUB_OFFLINE=1.
# 변수: HF_CACHE_VOLUME(기본 deploy-llm-hf-cache), DEMO_LLM_PROFILE(프로파일 경로, 이미지 안 /app/profiles/ 아래. 기본 gpu-12g.json), HF_HUB_OFFLINE(기본 0)
volumes:
  hf-cache:        # Hugging Face 모델 캐시(HF_HOME). 다시 받을 수 있어 백업 대상이 아니다.
    external: true   # 프로젝트 밖 이름 있는 볼륨: down -v / --purge 가 지우지 않는다(다음 기동에서 약 8GB(Qwen3-4B 추정)를 다시 받지 않게). 없으면 만들어 둔다:
    name: ${HF_CACHE_VOLUME:-deploy-llm-hf-cache}   #   docker volume create deploy-llm-hf-cache   (demo.sh up --llm 이 만든다). 지우기: down.sh --purge-hf-cache
services:
  model-serving:
    environment:
      MODEL_RUNTIME_BACKEND: vllm
      MODEL_RUNTIME_PROFILE: ${DEMO_LLM_PROFILE:-/app/profiles/gpu-12g.json}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      # 읽기 전용 루트의 캐시·홈 위치(HOME, XDG_CACHE_HOME, VLLM_CACHE_ROOT, TORCHINDUCTOR_CACHE_DIR, TRITON_CACHE_DIR, TORCH_HOME)와 원격 측정 차단
      # (VLLM_NO_USAGE_STATS, DO_NOT_TRACK, HF_HUB_DISABLE_TELEMETRY)은 model-runtime v0.5.3 부터 이미지의 ENV 기본값이다. 설정이 두 곳에서 어긋나지
      # 않도록 여기서 다시 정하지 않는다. 여기에는 배포마다 달라지는 값(백엔드, 프로파일, 오프라인)만 둔다.
      # TMPDIR 는 돌리지 않는다: /tmp 는 tmpfs(noexec)다. 컴파일 산출물(.so)은 위 캐시 경로(볼륨, noexec 아님)에 쓰이므로 /tmp 는 임시 파일만 받는다.
      # TMPDIR 를 볼륨 안으로 돌리면 디렉터리를 compose 가 만들지 못하고(앱이 만들 수 있다는 보장 없음), 대안인 tmpfs exec 허용은 보안 설정을 약화하므로 택하지 않았다.
      # /tmp 의 noexec 때문에 실패하는 흔적(Permission denied 로 .so 실행)이 GPU 서버에서 나오면 그때 다시 판단한다(미확인).
    volumes:
      # 이미지가 준비한 경로(HF_HOME 기본값 /var/lib/model-runtime/hf, 이미지가 uid 10001 소유로 만든다)에 마운트한다. HF_HOME 을 덮어쓰지 않는다:
      # 이미지에 없는 경로에 마운트하면 root 소유가 되어 uid 10001 서버가 쓰지 못한다(readyz 503 OSError). 빈 새 볼륨은 처음 마운트될 때 이 경로의 소유자로 초기화된다
      - hf-cache:/var/lib/model-runtime/hf
    deploy:
      resources:
        reservations:
          devices:
            - {driver: nvidia, count: 1, capabilities: [gpu]}
    healthcheck:
      start_period: 900s   # 잠정: 첫 기동의 모델 내려받기(약 8GB(Qwen3-4B 추정))와 적재 시간은 측정 전이라 넉넉히 잡았다. 측정 후 줄인다
      interval: 15s
      timeout: 3s
      retries: 10
