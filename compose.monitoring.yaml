# 상태 감시 스택(platform 감시 이미지, ADR 0037 → platform ADR 0010): 한 이미지에 역할 인자 하나(prometheus|alertmanager|blackbox|json|node). 설정·규칙은 이미지 안에 있고 배치는 대상 파일(file_sd)과 루트 인증서만 준다.
# 사용: COMPOSE_EXTRA=compose.monitoring.yaml scripts/up.sh deploy   (E2E 는 이 파일을 함께 올린다)
# 호스트 포트는 127.0.0.1 에만 열고 Docker 가 배정한다(고정 포트 금지). 강화: 비root(65534), 읽기 전용, cap_drop ALL, no-new-privileges, 로그 회전, 자원 한도(측정 안 함, 시작값).
x-monlog: &monlog {driver: json-file, options: {max-size: "10m", max-file: "5"}}
x-monhard: &monhard
  restart: unless-stopped
  image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/monitoring@${MONITORING_DIGEST:?locks/images.lock}
  user: "65534:65534"
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true
  logging: *monlog
services:
  prometheus:
    <<: *monhard
    command: ["prometheus"]
    environment: {PROMETHEUS_RETENTION: "${PROMETHEUS_RETENTION:-15d}"}   # Prometheus 기본값(측정 안 함)
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-512m}      # 측정 안 함(시작값)
    cpus: ${PROMETHEUS_CPUS:-0.5}
    pids_limit: ${PROMETHEUS_PIDS_LIMIT:-128}
    ports: ["127.0.0.1::9090"]
    volumes:
      - ${CONFIG_DIR:-./config}/monitoring-targets:/etc/openit/monitoring/targets:ro
      - pki-root:/etc/openit/pki:ro   # 서비스 인증서를 검증할 루트(공개 인증서). 지표 읽기가 https 다(ADR 0060)
      - prometheus-data:/prometheus
    networks: [monitoring, mon-survey-service, mon-question-authoring, mon-ops-feedback, mon-release-gate, mon-model-registry, mon-dataset-store, mon-kiosk-frontend, mon-admin-console]
    depends_on: [alertmanager, blackbox-exporter, json-exporter, node-exporter]
  alertmanager:
    <<: *monhard
    command: ["alertmanager"]
    mem_limit: ${ALERTMANAGER_MEM_LIMIT:-128m}
    cpus: ${ALERTMANAGER_CPUS:-0.25}
    pids_limit: ${ALERTMANAGER_PIDS_LIMIT:-64}
    ports: ["127.0.0.1::9093"]
    volumes: ["alertmanager-data:/alertmanager"]
    networks: [monitoring]
  monitoring-root:   # 감시가 믿을 루트 모음(MonitoringEnv.MONITORING_ROOT_CA 는 여러 PEM 을 이어 붙인 파일을 받는다): 서비스 인증서 루트(pki-root) + 공개 입구 루트(gateway-root)
    restart: "no"
    image: ${UTIL_IMAGE:?locks/images.lock}
    user: "65534:65534"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    network_mode: none
    entrypoint: ["sh", "-c", "cat /pki/root_ca.crt /gw/root_ca.crt > /out/root_ca.crt"]
    volumes: ["pki-root:/pki:ro", "gateway-root:/gw:ro", "monitoring-root:/out"]
    depends_on:
      gateway: {condition: service_healthy}   # 공개 입구가 루트를 출력 마운트(gateway-root)에 쓴 뒤(INGRESS_ROOT_EXPORT_DIR)
  blackbox-exporter:
    <<: *monhard
    command: ["blackbox"]
    mem_limit: ${BLACKBOX_MEM_LIMIT:-128m}
    cpus: ${BLACKBOX_CPUS:-0.25}
    pids_limit: ${BLACKBOX_PIDS_LIMIT:-64}
    volumes: ["monitoring-root:/etc/openit/pki:ro"]   # MONITORING_ROOT_CA 기본 경로(/etc/openit/pki/root_ca.crt)의 파일: 서비스 루트 + 공개 입구 루트
    depends_on:
      monitoring-root: {condition: service_completed_successfully}
    networks: [monitoring, serving, mon-survey-service, mon-question-authoring, mon-ops-feedback, mon-release-gate, mon-model-registry, mon-dataset-store, mon-kiosk-frontend, mon-admin-console]
  json-exporter:
    <<: *monhard
    command: ["json"]
    mem_limit: ${JSON_EXPORTER_MEM_LIMIT:-128m}
    cpus: ${JSON_EXPORTER_CPUS:-0.25}
    pids_limit: ${JSON_EXPORTER_PIDS_LIMIT:-64}
    volumes: ["pki-root:/etc/openit/pki:ro"]
    networks: [monitoring, serving, mon-survey-service, mon-question-authoring, mon-ops-feedback, mon-release-gate, mon-model-registry, mon-dataset-store, mon-kiosk-frontend, mon-admin-console]
  node-exporter:
    <<: *monhard
    command: ["node"]
    mem_limit: ${NODE_EXPORTER_MEM_LIMIT:-128m}
    cpus: ${NODE_EXPORTER_CPUS:-0.25}
    pids_limit: ${NODE_EXPORTER_PIDS_LIMIT:-64}
    volumes:
      - ${NODE_EXPORTER_ROOT_MOUNT:-/:/host:ro}   # 호스트 루트 읽기 전용(디스크 사용률). 하위 마운트(별도 디스크)까지 보려면 / 가 shared 인 리눅스 서버에서 NODE_EXPORTER_ROOT_MOUNT=/:/host:ro,rslave
      - ${METRICS_DIR:-./state/metrics}:/textfile:ro   # 주기 잡 결과(scripts/job-metrics.sh)
    networks: [monitoring]
networks:
  monitoring:
volumes:
  gateway-root:   # compose.yaml 이 정의한다(같은 프로젝트). 공개 입구가 쓴 루트 인증서(공개)만 있고 여기서는 읽기 전용으로만 쓴다
  monitoring-root:   # 감시가 믿을 루트 모음(공개 인증서만)
  gateway-data:   # compose.yaml 이 정의한다(같은 프로젝트). 읽기 전용으로만 쓴다
  pki-root:   # compose.yaml 가 정의한다(같은 프로젝트라 같은 볼륨). 루트 인증서만 있다
  prometheus-data:
  alertmanager-data:
