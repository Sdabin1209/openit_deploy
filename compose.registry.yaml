# 서버 안의 로컬 레지스트리(D24). 상시 구성(운영). 운영 도메인·TLS·push 인증은 미정이다(registry:2는 인증·TLS가 없다): 그 전에는 127.0.0.1에만 바인드한다. 접근 방식은 docs/ci.md 3절. 본 compose(compose.yaml)보다 먼저 떠 있어야 한다. 별도 프로젝트로 둔다.
# 이미지는 digest로 참조한다. 이름에 deploy를 접두어로 둔다(compose -p 가 프로젝트 이름을 정한다: 기본 deploy-registry).
# 호스트 바인드는 REGISTRY_HOST_BIND(기본 127.0.0.1)와 REGISTRY_HOST_PORT(기본 5000), 운영 서버(리눅스)용. Docker Desktop(WSL)은 데몬이 VM 안에 있어
# 127.0.0.1 게시 포트에 닿지 못하므로 시험에서만 REGISTRY_HOST_BIND=0.0.0.0, REGISTRY_HOST_PORT=(빈 값, Docker 배정)으로 띄우고 끝나면 내린다.
services:
  registry:
    image: ${REGISTRY_IMAGE:?locks/images.lock 의 REGISTRY_IMAGE}
    container_name: ${REGISTRY_PROJECT:-deploy-registry}
    restart: unless-stopped
    # 강화(점검 F6·F1): 읽기 전용 루트, 모든 capability 제거, 권한 상승 금지, 자원 한도·로그 회전. registry:2 는 root 로 뜨고(볼륨 소유가 root 라 비루트 전환은 별도 작업) 인증·TLS 가 없어 127.0.0.1 에만 바인드한다.
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    mem_limit: ${LIMIT_REGISTRY_MEM:-512m}
    cpus: "${LIMIT_REGISTRY_CPUS:-1.0}"
    pids_limit: ${LIMIT_REGISTRY_PIDS:-200}
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
    healthcheck: {test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/v2/"], interval: 15s, timeout: 3s, retries: 5}
    ports:
      - "${REGISTRY_HOST_BIND-127.0.0.1}:${REGISTRY_HOST_PORT-5000}:5000"
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry-data:/var/lib/registry
volumes:
  registry-data:
