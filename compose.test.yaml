# 시험 전용 덮어쓰기(운영에 쓰지 않는다). 이 파일의 내용은 모두 시험 대역·시험 접근이다.
#  - 서비스마다 자기 test-* 네트워크(survey는 edge)와 Docker가 배정하는 호스트 포트를 더한다(스모크·E2E가 밖에서 호출하려고).
#  - survey-service의 이웃(I4, I6)은 survey 리포지토리의 시험용 대역 팩토리(tests/smoke_fakes.py)로 꽂는다. 이 대역은 이미지에 없고
#    build/ctx 사본을 읽기 전용으로 붙인다. 대역이 만드는 릴리스 rel-smoke 는 실제 게이트의 릴리스가 아니다.
networks:   # 서비스마다 따로 둔다(공유하면 시험 접근이 격리 검사를 무너뜨린다)
  test-qa:
  test-ops:
  test-gate:
services:
  survey-service:
    environment:
      PYTHONPATH: /mnt
      SURVEY_RELEASE_READER: tests.smoke_fakes:reader
      SURVEY_TRACE_INGEST: tests.smoke_fakes:ingest
      SURVEY_STAFF_CONSOLE: tests.smoke_fakes:console
      SURVEY_RESULT_DISPATCHER: tests.smoke_fakes:dispatcher
      SURVEY_RELEASE_POLL_SECONDS: "1"
    volumes:
      - ${TEST_SURVEY_TESTS_DIR:?build/ctx/survey-service/tests 경로}:/mnt/tests:ro
    networks: [edge, serving]
    ports: ["127.0.0.1::8080"]
  question-authoring:
    networks: [authoring, release, test-qa]
    ports: ["127.0.0.1::8080"]
  ops-feedback-ingest:
    networks: [serving, logs, test-ops]
    ports: ["127.0.0.1::8080"]
  release-gate:
    networks: [serving, release, test-gate]
    ports: ["127.0.0.1::8080"]
