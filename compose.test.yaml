# 시험 전용 덮어쓰기(운영에 쓰지 않는다). 이 파일의 내용은 모두 시험 접근·시험 자료다.
#  - 서비스마다 자기 test-* 네트워크와 Docker가 배정하는 호스트 포트를 더한다(E2E가 호스트에서 호출하려고).
#  - ops-feedback 잡 설정은 test/ops-job 의 시험 값이다.
# survey-service는 더 이상 시험 대역을 쓰지 않는다(실제 게이트·수집 서비스를 HTTP로 부른다).
networks:   # 서비스마다 따로 둔다(공유하면 시험 접근이 격리 검사를 무너뜨린다)
  test-qa:
  test-ops:
  test-gate:
  test-mr:
  test-ms:
services:
  survey-service:
    ports: ["127.0.0.1::8080"]
  question-authoring:
    networks: [authoring, release, test-qa]
    ports: ["127.0.0.1::8080"]
  ops-feedback-ingest:
    networks: [serving, logs, authoring, test-ops]
    ports: ["127.0.0.1::8080"]
  release-gate:
    networks: [serving, release, test-gate]
    ports: ["127.0.0.1::8080"]
    environment:
      GATE_POLL_SECONDS: "2"
  model-serving:
    networks: [serving, test-ms]
    ports: ["127.0.0.1::8080"]
    environment:
      MODEL_RUNTIME_BACKEND: fake   # 시험: 출력이 고정된 가짜 백엔드
      MODEL_RUNTIME_FAKE_RISK_PHRASE: 'TEST-RISK'   # 시험 전용: 발화에 이 문구가 있으면 fake 파서가 위험 신호를 낸다(운영 compose.yaml에는 넣지 않는다)
  model-registry:
    networks: [release, test-mr]
    ports: ["127.0.0.1::8080"]
