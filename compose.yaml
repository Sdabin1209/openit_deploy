  dataset-store-write-tokens:
    file: ${SECRETS_DIR:-./secrets}/tokens/dataset-store-write-tokens

services:
  step-ca:   # 독립 인증기관(사설 PKI + ACME, ADR 0060). 공식 이미지(digest 고정). 루트·중간 키는 처음 기동에 1회 만들어 pki-ca 볼륨에 둔다(비밀번호는 비밀 파일)
    restart: unless-stopped
    image: ${STEP_CA_IMAGE:?locks/images.lock}
    user: "1000:1000"   # 이미지의 step 사용자(비루트)
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:exec"]   # step-ca 사본을 실행한다(파일 권한이 있는 원본은 cap_drop ALL 에서 exec 가 막힌다, 측정함)
    mem_limit: 128m   # 측정 안 함(시작값)
    cpus: 0.5
    pids_limit: 128
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
    group_add: *secretgid
    entrypoint: ["sh", "-c", "test -f /home/step/config/ca.json || step ca init --name OpenIt --dns step-ca --address :9000 --provisioner admin --acme --password-file /run/secrets/step-ca-password --provisioner-password-file /run/secrets/step-ca-password >/dev/null 2>&1; cp /usr/local/bin/step-ca /tmp/step-ca && exec /tmp/step-ca /home/step/config/ca.json --password-file /run/secrets/step-ca-password"]   # 왜 공식 entrypoint 의 DOCKER_STEPCA_INIT_* 를 쓰지 않나: 그 경로는 CA 관리 비밀번호를 컨테이너 로그에 찍는다(비밀은 로그 금지, D84). 같은 step ca init 을 출력 없이 1회 실행한다
    secrets: [step-ca-password]
    volumes: [pki-ca:/home/step]
    networks: [pki]
  pki-root:   # 루트 인증서(공개)를 읽기 전용 볼륨 pki-root 로 복사하는 일회성 잡. 키가 든 pki-ca 는 호출자에게 마운트하지 않는다
    restart: "no"
    image: ${STEP_CA_IMAGE:?locks/images.lock}
    user: "1000:1000"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp"]
    entrypoint: ["sh", "-c", "cp /ca/certs/root_ca.crt /home/step/root_ca.crt && chmod 644 /home/step/root_ca.crt"]
    volumes: ["pki-ca:/ca:ro", "pki-root:/home/step"]
    networks: [pki]
    depends_on:
      step-ca: {condition: service_healthy}
  postgres-cert:   # postgres 서버 인증서(step-ca 발급, 수명 24시간 = step-ca 기본)를 받고 8시간(수명의 1/3)마다 다시 받는다. postgres 가 시작하기 전에 파일이 있어야 하므로 healthy(파일 있음)가 postgres 의 선행 조건이다. 볼륨 소유자는 up.sh 가 999 로 맞춘다(gateway-data 와 같은 방식)
    restart: unless-stopped
    image: ${STEP_CA_IMAGE:?locks/images.lock}
    user: "999:999"   # postgres 와 같은 uid: 키 파일(0600)을 postgres 만 읽는다
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp"]
    group_add: *secretgid
    mem_limit: 64m   # 측정 안 함(시작값)
    cpus: 0.25
    pids_limit: 64
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
    environment: {STEPPATH: /tmp}
    entrypoint: ["sh", "-c", "while true; do step ca certificate postgres /pg-tls/server.crt /pg-tls/server.key --ca-url https://step-ca:9000 --root /etc/openit/pki/root_ca.crt --provisioner admin --provisioner-password-file /run/secrets/step-ca-password --san postgres --not-after 24h --force >/dev/null 2>&1 && chmod 600 /pg-tls/server.key; sleep 28800; done"]
    secrets: [step-ca-password]
    volumes: ["pg-tls:/pg-tls", "pki-root:/etc/openit/pki:ro"]
    networks: [pki]
    healthcheck: {test: ["CMD", "test", "-s", "/pg-tls/server.key"], interval: 5s, timeout: 3s, retries: 30, start_period: 5s, start_interval: 1s}
    depends_on:
      step-ca: {condition: service_healthy}
      pki-root: {condition: service_completed_successfully}
  postgres-reload:   # 새 서버 인증서를 postgres 가 읽게 8시간 1분마다 pg_reload_conf() 를 부른다(SQL 표준 방법; 신호나 pid 공유를 쓰지 않는다). 접속은 verify-full TLS
    restart: unless-stopped
    image: ${POSTGRES_IMAGE:?locks/images.lock}
    user: "999:999"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp"]
    group_add: *secretgid
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
    entrypoint: ["sh", "-c", "while true; do sleep 28860; PGPASSWORD=$$(cat /run/secrets/postgres-password) psql -qAt 'host=postgres user=postgres dbname=postgres sslmode=verify-full sslrootcert=/etc/openit/pki/root_ca.crt' -c 'select pg_reload_conf()' >/dev/null; done"]
    secrets: [postgres-password]
    volumes: ["pki-root:/etc/openit/pki:ro"]
    networks: [db-reload]
    depends_on:
      postgres: {condition: service_healthy}
  survey-service-tls:   # survey-service 의 TLS 사이드카(ADR 0060): https://survey-service 으로 받는다
    <<: *tlssidecar
    network_mode: "service:survey-service"
    environment: {TLS_NAME: survey-service, TLS_UPSTREAM: "127.0.0.1:8080"}
  question-authoring-tls:   # question-authoring 의 TLS 사이드카(ADR 0060): https://question-authoring 으로 받는다
    <<: *tlssidecar
    network_mode: "service:question-authoring"
    environment: {TLS_NAME: question-authoring, TLS_UPSTREAM: "127.0.0.1:8080"}
  ops-feedback-ingest-tls:   # ops-feedback-ingest 의 TLS 사이드카(ADR 0060): https://ops-feedback-ingest 으로 받는다
    <<: *tlssidecar
    network_mode: "service:ops-feedback-ingest"
    environment: {TLS_NAME: ops-feedback-ingest, TLS_UPSTREAM: "127.0.0.1:8080"}
  release-gate-tls:   # release-gate 의 TLS 사이드카(ADR 0060): https://release-gate 으로 받는다
    <<: *tlssidecar
    network_mode: "service:release-gate"
    environment: {TLS_NAME: release-gate, TLS_UPSTREAM: "127.0.0.1:8080"}
  model-serving-tls:   # model-serving 의 TLS 사이드카(ADR 0060): https://model-serving 으로 받는다
    <<: *tlssidecar
    network_mode: "service:model-serving"
    environment: {TLS_NAME: model-serving, TLS_UPSTREAM: "127.0.0.1:8080"}
  model-registry-tls:   # model-registry 의 TLS 사이드카(ADR 0060): https://model-registry 으로 받는다
    <<: *tlssidecar
    network_mode: "service:model-registry"
    environment: {TLS_NAME: model-registry, TLS_UPSTREAM: "127.0.0.1:8080"}
  dataset-store-tls:   # dataset-store 의 TLS 사이드카(ADR 0060): https://dataset-store 으로 받는다
    <<: *tlssidecar
    network_mode: "service:dataset-store"
    environment: {TLS_NAME: dataset-store, TLS_UPSTREAM: "127.0.0.1:8080"}
  admin-console-tls:   # admin-console 의 TLS 사이드카(ADR 0060): https://admin-console 으로 받는다
    <<: *tlssidecar
    network_mode: "service:admin-console"
    environment: {TLS_NAME: admin-console, TLS_UPSTREAM: "127.0.0.1:8080"}
  kiosk-frontend-tls:   # kiosk-frontend 의 TLS 사이드카(ADR 0060): https://kiosk-frontend 으로 받는다
    <<: *tlssidecar
    network_mode: "service:kiosk-frontend"
    environment: {TLS_NAME: kiosk-frontend, TLS_UPSTREAM: "127.0.0.1:8080"}
  keycloak-tls:   # keycloak 의 TLS 사이드카(ADR 0060): https://keycloak 으로 받는다
    <<: *tlssidecar
    network_mode: "service:keycloak"
    environment: {TLS_NAME: keycloak, TLS_UPSTREAM: "127.0.0.1:8080"}
  oauth2-proxy-tls:   # oauth2-proxy 의 TLS 사이드카(ADR 0060): https://oauth2-proxy 으로 받는다
    <<: *tlssidecar
    network_mode: "service:oauth2-proxy"
    environment: {TLS_NAME: oauth2-proxy, TLS_UPSTREAM: "127.0.0.1:4180"}
  postgres:             # 공식 postgres:16 하나. 서비스마다 데이터베이스와 최소 권한 계정을 나눈다(config/postgres/initdb/10-roles.sh). 호스트 포트 없음, db 네트워크만
    <<: *hardening
    mem_limit: ${POSTGRES_MEM_LIMIT:-2g}      # 한도 값: 측정 안 함(시작값). docs/adr/0023-compose-resource-limits.md
    cpus: ${POSTGRES_CPUS:-2.0}
    pids_limit: ${POSTGRES_PIDS_LIMIT:-300}
    image: ${POSTGRES_IMAGE:?locks/images.lock}
    user: "999:999"     # 공식 이미지의 postgres 사용자. 처음부터 비루트로 뜬다(볼륨은 이미지가 이 사용자 소유로 만든다)
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password   # 공식 이미지가 지원하는 *_FILE (D84). 평문 환경 변수 없음
      POSTGRES_INITDB_ARGS: "--data-checksums"
    secrets: [postgres-password, db-survey-password, db-qa-password, db-ops-log-password, db-ops-failure-password, db-ops-log-app-password, db-ops-failure-app-password, db-gate-password, db-keycloak-password]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ${CONFIG_DIR:-./config}/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ${CONFIG_DIR:-./config}/postgres/pg_hba.conf:/etc/openit/pg_hba.conf:ro   # 네트워크 접속은 TLS 만(ADR 0060)
      - pg-tls:/etc/openit/pg-tls:ro   # step-ca 발급 서버 인증서·키(postgres-cert-init)
    tmpfs: ["/tmp", "/var/run/postgresql:uid=999,gid=999"]
    networks: [db-survey, db-qa, db-ops, db-gate, db-keycloak, db-reload]
    shm_size: ${POSTGRES_SHM_SIZE:-256m}    # 측정 안 함(시작값). 기본 64m 은 병렬 쿼리·큰 덤프에서 부족할 수 있다(adr/0023-compose-resource-limits.md)
    # 서버 설정(docs/adr/0024-postgres-logging-and-limits.md). 로그에 SQL 문장·값이 남지 않게 하는 것이 핵심이다(감사 C4):
    #  log_min_error_statement=panic  오류가 난 SQL 문장을 로그에 쓰지 않는다(기본 error 는 리터럴 값이 든 문장을 그대로 남긴다)
    #  log_error_verbosity=terse      DETAIL(예: 'Key (id)=(값) already exists')·QUERY·CONTEXT 줄을 빼 값이 로그에 새지 않게 한다
    #  log_statement=none, log_min_duration_statement=-1  문장 로깅·느린 쿼리 로깅 끔(기본값이지만 바뀌지 않게 못 박는다)
    #  max_connections, idle_in_transaction_session_timeout  연결 상한과 열린 채 방치된 트랜잭션 정리(값은 측정 안 함, 시작값)
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/openit/pg-tls/server.crt
      - -c
      - ssl_key_file=/etc/openit/pg-tls/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - hba_file=/etc/openit/pg_hba.conf
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=panic
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_error_verbosity=terse
      - -c
      - log_parameter_max_length=0          # 바인드 값은 로그에 남기지 않는다(PG13+, 오류 때도: 아래 _on_error)
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
      - -c
      - idle_in_transaction_session_timeout=${POSTGRES_IDLE_TX_TIMEOUT_MS:-300000}
    stop_grace_period: 30s
    depends_on:
      postgres-cert: {condition: service_healthy}
    healthcheck:   # TCP(-h 127.0.0.1)로 묻는다: 초기화 중의 임시 서버는 소켓만 열어 두므로 초기화가 끝나야 healthy가 된다
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
      start_interval: 1s   # 왜: x-pyhealth 와 같다(start_period 동안만 1초 간격)

  gateway:
    <<: *hardening
    mem_limit: ${GATEWAY_MEM_LIMIT:-256m}      # 한도 값: 측정 안 함(시작값). docs/adr/0023-compose-resource-limits.md
    cpus: ${GATEWAY_CPUS:-1.0}
    pids_limit: ${GATEWAY_PIDS_LIMIT:-256}
    image: ${GATEWAY_IMAGE:?locks/images.lock}
    user: "10001:10001"
    cap_add: ["NET_BIND_SERVICE"]   # caddy 바이너리에 파일 권한이 있어 cap_drop ALL이면 실행이 거부된다. 실제로는 8080을 연다
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile"]
    configs:
      - {source: gateway-caddyfile, target: /etc/caddy/Caddyfile}
      - {source: gateway-auth, target: /etc/caddy/auth.caddy}
      - {source: gateway-devices, target: /etc/caddy/devices.caddy}
      - {source: gateway-device-tls, target: /etc/caddy/device-tls.caddy}
      - {source: gateway-device-ca, target: /etc/caddy/device-ca.pem}
      - {source: gateway-tls-internal, target: /etc/caddy/gateway-tls/internal.caddy}
      - {source: gateway-tls-files, target: /etc/caddy/gateway-tls/files.caddy}
      - {source: gateway-tls-acme, target: /etc/caddy/gateway-tls/acme.caddy}
      - {source: gateway-tls-cert, target: /etc/openit/gateway-tls/server.crt}   # mode=files 일 때만 의미 있다(아니면 빈 파일)
    secrets: [gateway-tls-key, gateway-registry-publish-token, model-registry-write-model-lab, survey-result-reader, qa-gateway-token, survey-api-staff, gate-write-release-approver, gate-read-release-approver, gate-read-operator, gate-write-operator, ops-read-reviewer, ops-review-reviewer, gate-read-model-serving, gateway-inference-token]
    # Caddyfile 이 {file./run/secrets/<이름>} 으로 읽는다(환경 변수 아님, docs/RUN.md 비밀 절)
    depends_on:
      kiosk-frontend: {condition: service_healthy}
      survey-service: {condition: service_healthy}
      admin-console: {condition: service_healthy}
      release-gate: {condition: service_healthy}
      ops-feedback-ingest: {condition: service_healthy}
      oauth2-proxy: {condition: service_started}   # 사람 인증(forward_auth). 준비 전에 오는 요청은 503(UPSTREAM_UNAVAILABLE)
    environment:   # 비밀 아님. 사이트 이름 목록과 밖에서 보이는 HTTPS 포트(평문 포트의 리다이렉트 대상). 운영에서 병원 내부 도메인으로 바꾼다(docs/runbook.md TLS 절)
      GATEWAY_HOSTS: ${GATEWAY_HOSTS:-localhost:8443, 127.0.0.1:8443}
      GATEWAY_PUBLIC_TLS_PORT: ${GATEWAY_PUBLIC_TLS_PORT:-8443}
      GATEWAY_TLS_MODE: ${GATEWAY_TLS_MODE:-internal}   # 공개 입구 인증서 출처: internal(기본)|files|acme (ADR 0060)
      GATEWAY_ACME_EMAIL: ${GATEWAY_ACME_EMAIL:-internal@invalid.example}
      GATEWAY_ACME_DIRECTORY: ${GATEWAY_ACME_DIRECTORY:-https://acme-v02.api.letsencrypt.org/directory}
      GATEWAY_HOST_NAMES: ${GATEWAY_HOST_NAMES:?scripts/lib.sh 가 GATEWAY_HOSTS 에서 만든다(L20, ADR 0056)}   # CSRF 허용 호스트 이름 목록. 직접 정하지 않는다
    volumes:
      - gateway-data:/data   # Caddy 내부 CA 와 발급 인증서를 재시작해도 유지한다(루트 인증서가 바뀌면 모든 키오스크·직원 PC가 다시 신뢰해야 한다). 소유자 정리는 scripts/up.sh
      - pki-root:/etc/openit/pki:ro   # 루트 인증서(공개). ADR 0060
    tmpfs: ["/tmp", "/config:uid=10001,gid=10001"]
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT-8080}:8080"      # 평문: /healthz 만 평문, 나머지는 HTTPS 로 308
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_TLS_PORT-8443}:8443"  # HTTPS (D88/U5)
    networks: [edge, ui, serving, authoring, release, auth]   # release: 학습 서버의 패키지 게시 입구(U69, model-registry). ui: 정적 화면, serving: 게이트웨이가 release-gate의 승인 경로 네 개만 프록시한다(Caddyfile)
    healthcheck: {test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"], interval: 15s, timeout: 3s, retries: 5, start_period: 20s, start_interval: 1s}   # 왜: start_period 가 없으면 첫 확인이 interval(15초) 뒤라 healthy 가 15초 늦다(측정: 격리 시험 15.7초 -> 1.4초). 실패는 start_period 동안 retries 에 세지 않을 뿐이다

  kiosk-frontend:       # 키오스크 앱 + 직원 콘솔 정적 이미지(포트 8080, /healthz·/readyz). /v1 은 처리하지 않는다
    sysctls: {net.ipv4.ip_unprivileged_port_start: 0}   # 사이드카(같은 네임스페이스)가 추가 capability 없이 80/443 을 열게 한다(ADR 0060)
    <<: *hardening
    mem_limit: ${KIOSK_FRONTEND_MEM_LIMIT:-128m}      # 한도 값: 측정 안 함(시작값). docs/adr/0023-compose-resource-limits.md
    cpus: ${KIOSK_FRONTEND_CPUS:-0.5}
    pids_limit: ${KIOSK_FRONTEND_PIDS_LIMIT:-128}
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/kiosk-frontend@${KIOSK_FRONTEND_DIGEST:?locks/images.lock}
    volumes: [pki-root:/etc/openit/pki:ro]   # 루트 인증서(공개). ADR 0060
    networks: [ui, pki]
    cap_add: ["NET_BIND_SERVICE"]   # 공식 caddy 이미지의 바이너리에 파일 권한(cap_net_bind_service)이 있어 cap_drop ALL + no-new-privileges 에서는 exec 가 거부된다(측정함: "exec /usr/bin/caddy: operation not permitted"). 실제로는 8080 을 연다. gateway 와 같은 처리
    healthcheck: {test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"], interval: 15s, timeout: 3s, retries: 5, start_period: 20s, start_interval: 1s}

  admin-console:        # 출고 승인 화면 정적 이미지(포트 8080, /healthz·/readyz). /v1 은 처리하지 않는다. ADMIN_DEV_APPROVER_ID 는 설정하지 않는다
    sysctls: {net.ipv4.ip_unprivileged_port_start: 0}   # 사이드카(같은 네임스페이스)가 추가 capability 없이 80/443 을 열게 한다(ADR 0060)
    <<: *hardening
    mem_limit: ${ADMIN_CONSOLE_MEM_LIMIT:-128m}      # 한도 값: 측정 안 함(시작값). docs/adr/0023-compose-resource-limits.md
    cpus: ${ADMIN_CONSOLE_CPUS:-0.5}
    pids_limit: ${ADMIN_CONSOLE_PIDS_LIMIT:-128}
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/admin-console@${ADMIN_CONSOLE_DIGEST:?locks/images.lock}
    volumes: [pki-root:/etc/openit/pki:ro]   # 루트 인증서(공개). ADR 0060
    networks: [ui, pki]
    cap_add: ["NET_BIND_SERVICE"]   # 공식 caddy 이미지의 바이너리에 파일 권한(cap_net_bind_service)이 있어 cap_drop ALL + no-new-privileges 에서는 exec 가 거부된다(측정함: "exec /usr/bin/caddy: operation not permitted"). 실제로는 8080 을 연다. gateway 와 같은 처리
    healthcheck: {test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"], interval: 15s, timeout: 3s, retries: 5, start_period: 20s, start_interval: 1s}

  survey-service:
    sysctls: {net.ipv4.ip_unprivileged_port_start: 0}   # 사이드카(같은 네임스페이스)가 추가 capability 없이 80/443 을 열게 한다(ADR 0060)
    <<: *hardening
    mem_limit: ${SURVEY_SERVICE_MEM_LIMIT:-512m}      # 한도 값: 측정 안 함(시작값). docs/adr/0023-compose-resource-limits.md
    cpus: ${SURVEY_SERVICE_CPUS:-1.0}
    pids_limit: ${SURVEY_SERVICE_PIDS_LIMIT:-256}
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/survey-service@${SURVEY_SERVICE_DIGEST:?locks/images.lock}
    env_file:
      - ${CONFIG_DIR:-./config}/survey.env                      # I4/I6 HTTP 클라이언트의 URL(서비스 이름)과 토큰 환경 변수 이름. 비밀 아님
    environment: &survey_env   # 비밀은 파일 경로만(D84)
      SURVEY_KIOSK_DEVICE_TOKENS_FILE: /run/secrets/survey-kiosk-device-tokens   # 2.x 호환(선택, 3.0.0에서 없어진다): 기기 토큰(Bearer)을 쓰는 기기만. 2.3.0 의 기기 인증은 게이트웨이가 붙이는 X-Openit-Device 이고 survey 는 헤더가 있으면 헤더를 쓴다(ADR 0040). 토큰 기기가 없으면 빈 파일이다
      SURVEY_STAFF_API_TOKEN_FILE: /run/secrets/survey-api-staff
      SURVEY_RELEASE_READER_TOKEN_FILE: /run/secrets/gate-read-survey-service
      SURVEY_TRACE_INGEST_TOKEN_FILE: /run/secrets/ops-ingest-survey-service
      SURVEY_INFERENCE_TOKEN_FILE: /run/secrets/inference-survey-service
      SURVEY_RESULT_READER_TOKEN_FILE: /run/secrets/survey-result-reader   # 결과 조회 API(result-reader 역할, 병원/의사 시스템용: 게이트웨이에 열지 않는다)
      SURVEY_RISK_SOURCE_TOKEN_FILE: /run/secrets/survey-risk-source       # 위험 신호 입력 API(risk-source 역할, 감지기용: 게이트웨이에 열지 않는다)
      SURVEY_DATABASE_URL_FILE: /run/secrets/db-survey-dsn                 # 세션·outbox·알림은 PostgreSQL(D85). SQLite 경로(SURVEY_SESSION_DB 등)는 개발·시험 기본일 뿐 운영 구성에 주지 않는다
      SURVEY_HOST: 127.0.0.1   # 앱은 사이드카(같은 네임스페이스)에게만 닿는다: 다른 컨테이너가 앱 포트로 직접 오지 못하게 loopback 에 바인드(계약 v3.4.2, ADR 0060)
      SSL_CERT_FILE: /etc/openit/pki/root_ca.crt   # 서비스 사이드카(ADR 0060) 인증서 검증용 루트(OpenSSL 표준, 파이썬 urllib·ssl)
      REQUESTS_CA_BUNDLE: /etc/openit/pki/root_ca.crt   # requests 계열
    secrets: &survey_secrets [survey-kiosk-device-tokens, survey-api-staff, gate-read-survey-service, ops-ingest-survey-service, inference-survey-service, survey-result-reader, survey-risk-source, db-survey-dsn]
    volumes: [survey-data:/data, pki-root:/etc/openit/pki:ro]   # 릴리스 작업 폴더(releases/)만. 게이트 묶음에서 다시 적재되는 사본이라 백업 대상 아님
    networks: [edge, serving, db-survey, monitoring, pki]
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2)"]
    depends_on:
      postgres: {condition: service_healthy}
      ops-feedback-ingest: {condition: service_healthy}
      release-gate: {condition: service_healthy}
      model-serving: {condition: service_healthy}

  question-authoring:
    sysctls: {net.ipv4.ip_unprivileged_port_start: 0}   # 사이드카(같은 네임스페이스)가 추가 capability 없이 80/443 을 열게 한다(ADR 0060)
    <<: *hardening
    mem_limit: ${QUESTION_AUTHORING_MEM_LIMIT:-512m}      # 한도 값: 측정 안 함(시작값). docs/adr/0023-compose-resource-limits.md
    cpus: ${QUESTION_AUTHORING_CPUS:-1.0}
    pids_limit: ${QUESTION_AUTHORING_PIDS_LIMIT:-256}
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/question-authoring@${QUESTION_AUTHORING_DIGEST:?locks/images.lock}
    volumes: [pki-root:/etc/openit/pki:ro]   # 루트 인증서(공개). ADR 0060
    env_file:
      - ${CONFIG_DIR:-./config}/question-authoring.env          # QA_FAILURES_URL (개선 신호 수신함이 읽는 I7). 비밀 아님
    environment: &qa_env
      QA_AUTHOR_TOKENS_FILE: /run/secrets/qa-author-tokens
      QA_GATEWAY_TOKENS_FILE: /run/secrets/qa-gateway-tokens   # gateway 경유 저자 경로의 서비스 토큰(X-Openit-User 를 신뢰하는 유일한 토큰)
      QA_READ_TOKENS_FILE: /run/secrets/qa-read-tokens
      QA_FAILURES_TOKEN_FILE: /run/secrets/ops-read-question-authoring
      QA_DATABASE_URL_FILE: /run/secrets/db-qa-dsn   # 문항 저장소는 PostgreSQL(D85)
      QA_HOST: 127.0.0.1   # 앱은 사이드카(같은 네임스페이스)에게만 닿는다: 다른 컨테이너가 앱 포트로 직접 오지 못하게 loopback 에 바인드(계약 v3.4.2, ADR 0060)
      SSL_CERT_FILE: /etc/openit/pki/root_ca.crt   # 서비스 사이드카(ADR 0060) 인증서 검증용 루트(OpenSSL 표준, 파이썬 urllib·ssl)
      REQUESTS_CA_BUNDLE: /etc/openit/pki/root_ca.crt   # requests 계열
    secrets: &qa_secrets [qa-author-tokens, qa-gateway-tokens, qa-read-tokens, ops-read-question-authoring, db-qa-dsn]
    tmpfs: ["/tmp", "/data"]   # 상태는 PostgreSQL에 있다. 영역의 SQLite 기본 경로가 /data 라 읽기 전용 루트에서도 쓸 수 있는 임시 공간만 둔다
    networks: [authoring, release, db-qa, pki]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2)"]

  keycloak:   # 사람 계정 IdP(U82, head ADR 0014, deploy ADR 0057). 읽기 전용 루트를 쓰지 않는다: 시작 때 Quarkus 가 /opt/keycloak/lib/quarkus 에 다시 빌드한 결과를 쓴다(그 밖의 강화는 같다)
    sysctls: {net.ipv4.ip_unprivileged_port_start: 0}   # 사이드카(같은 네임스페이스)가 추가 capability 없이 80/443 을 열게 한다(ADR 0060)
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp"]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
    group_add: *secretgid
    mem_limit: ${KEYCLOAK_MEM_LIMIT:-1g}      # 한도 값: 측정 안 함(시작값). docs/adr/0023-compose-resource-limits.md
    cpus: ${KEYCLOAK_CPUS:-1.0}
    pids_limit: ${KEYCLOAK_PIDS_LIMIT:-512}
    image: ${KEYCLOAK_IMAGE:?locks/images.lock}
    volumes: [pki-root:/etc/openit/pki:ro]   # 루트 인증서(공개). ADR 0060
    command: ["--config-file=/run/secrets/keycloak-secrets.conf", "start", "--import-realm"]   # 비밀(db-password, bootstrap-admin-password)은 환경 변수가 아니라 설정 파일로 받는다: 프로세스 환경(/proc/1/environ)에도 값이 없다(D84, 3차 E2E check-secrets-hidden). --config-file 은 kc.sh 의 전역 옵션이라 start 앞에 온다(시험으로 확인)
    environment:   # 비밀 아님
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak?sslmode=verify-full&sslrootcert=/etc/openit/pki/root_ca.crt
      KC_DB_USERNAME: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: kcadmin
      KC_HTTP_HOST: 127.0.0.1          # 사이드카에게만 닿는다(ADR 0060). 공식 옵션 http-host
      KC_HTTP_ENABLED: "true"          # TLS 는 gateway 가 끝낸다(내부망 auth 안에서만 평문)
      KC_HTTP_RELATIVE_PATH: /auth     # 계약 밖 deploy 규약: gateway 가 /auth/* 를 Keycloak 으로 보낸다
      KC_HOSTNAME: ${GATEWAY_PUBLIC_URL:?scripts/lib.sh 가 GATEWAY_HOSTS 에서 만든다}/auth   # 밖에 보이는 주소(토큰의 iss). 뒷길(oauth2-proxy -> keycloak)은 요청 주소를 쓴다
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_CACHE: local                  # 단일 서버: 클러스터 캐시(Infinispan 포트)를 켜지 않는다
      KC_LOG: console
    secrets:
      - keycloak-secrets.conf          # db-password, bootstrap-admin-password (scripts/gen-secrets.sh)
      - {source: keycloak-realm.json, target: /opt/keycloak/data/import/openit-realm.json}   # realm 가져오기: 클라이언트 비밀·초기 admin 임시 비밀번호가 값으로 들어 있어 비밀 파일이다(scripts/gen-keycloak-realm.sh)
    networks: [auth, db-keycloak, pki]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:   # 관리 포트(9000)의 /auth/health/ready. 이미지에 curl 이 없어 bash 의 /dev/tcp 로 요청한다
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s   # 첫 기동은 시작 때 다시 빌드·realm 가져오기를 한다(측정 전, 시작값)

  oauth2-proxy:   # OIDC 클라이언트(U82). 인증 결과를 쿠키 세션으로 갖고 gateway 의 forward_auth(/oauth2/auth)에 답한다. 이미지에 셸이 없어 healthcheck 를 두지 않는다
    sysctls: {net.ipv4.ip_unprivileged_port_start: 0}   # 사이드카(같은 네임스페이스)가 추가 capability 없이 80/443 을 열게 한다(ADR 0060)
    <<: *hardening
    mem_limit: ${OAUTH2_PROXY_MEM_LIMIT:-128m}      # 한도 값: 측정 안 함(시작값). docs/adr/0023-compose-resource-limits.md
    cpus: ${OAUTH2_PROXY_CPUS:-0.5}
    pids_limit: ${OAUTH2_PROXY_PIDS_LIMIT:-128}
    image: ${OAUTH2_PROXY_IMAGE:?locks/images.lock}
    volumes: [pki-root:/etc/openit/pki:ro]   # 루트 인증서(공개). ADR 0060
    environment:   # 비밀 아님(비밀은 *_FILE). 밖에서 보이는 주소는 GATEWAY_PUBLIC_URL(첫 GATEWAY_HOSTS 이름 + 밖에 보이는 포트)이고 사람 화면은 이 이름으로 쓴다(ADR 0057)
      OAUTH2_PROXY_PROVIDER: oidc   # keycloak-oidc 가 아니다: 그 공급자는 realm 역할을 `role:<이름>` 그룹으로 섞어 넣어(default-roles-openit 등) 그룹이 비지 않고 X-Openit-Roles 에 잡음이 들어간다(스모크 시험이 잡았다)
      OAUTH2_PROXY_CLIENT_ID: openit-gateway
      OAUTH2_PROXY_CLIENT_SECRET_FILE: /run/secrets/oauth2-proxy-client-secret
      OAUTH2_PROXY_COOKIE_SECRET_FILE: /run/secrets/oauth2-proxy-cookie-secret
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"   # 발급자(iss)는 밖에 보이는 주소이고 서버끼리는 내부 주소로 부른다: 주소를 직접 준다
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${GATEWAY_PUBLIC_URL:?scripts/lib.sh}/auth/realms/openit
      OAUTH2_PROXY_LOGIN_URL: ${GATEWAY_PUBLIC_URL:?scripts/lib.sh}/auth/realms/openit/protocol/openid-connect/auth
      OAUTH2_PROXY_PROVIDER_CA_FILES: /etc/openit/pki/root_ca.crt   # keycloak 사이드카 인증서를 step-ca 루트로 검증(ADR 0060)
      OAUTH2_PROXY_REDEEM_URL: https://keycloak/auth/realms/openit/protocol/openid-connect/token
      OAUTH2_PROXY_OIDC_JWKS_URL: https://keycloak/auth/realms/openit/protocol/openid-connect/certs
      OAUTH2_PROXY_REDIRECT_URL: ${GATEWAY_PUBLIC_URL:?scripts/lib.sh}/oauth2/callback
      OAUTH2_PROXY_HTTP_ADDRESS: 127.0.0.1:4180   # 사이드카에게만 닿는다(ADR 0060)
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_OIDC_GROUPS_CLAIM: groups
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: "true"   # 이메일 발송 설정이 없어 가입 이메일을 검증하지 않는다(가입 승인은 admin 이 한다)
      OAUTH2_PROXY_SCOPE: openid profile email
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_COOKIE_NAME: _openit_session
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_EXPIRE: 12h     # 시작값(측정·결정 전): 하루 근무 안에서 다시 로그인
      OAUTH2_PROXY_COOKIE_REFRESH: 5m     # 그룹(역할) 변경·계정 정지가 이 간격 안에 반영되게 Keycloak 에 다시 묻는다. 시작값(측정 전)
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_AUTH_LOGGING: "true"
      SSL_CERT_FILE: /etc/openit/pki/root_ca.crt   # 서비스 사이드카(ADR 0060) 인증서 검증용 루트(OpenSSL 표준, 파이썬 urllib·ssl)
      REQUESTS_CA_BUNDLE: /etc/openit/pki/root_ca.crt   # requests 계열
    secrets: [oauth2-proxy-client-secret, oauth2-proxy-cookie-secret]
    networks: [auth, pki]
    depends_on:
      keycloak: {condition: service_healthy}

  ops-feedback-migrate:   # L08(ADR 0055): 스키마를 만드는 일회성 서비스. 소유자 계정 접속 문자열 파일만 받는다. 서버·잡은 이것이 성공한 뒤에 뜬다. 상시 서비스도 주기 잡도 아니다(restart 없음, 기본 기동에 포함)
    restart: "no"
    mem_limit: ${OPS_FEEDBACK_MIGRATE_MEM_LIMIT:-256m}      # 한도 값: 측정 안 함(시작값). docs/adr/0023-compose-resource-limits.md
    cpus: ${OPS_FEEDBACK_MIGRATE_CPUS:-0.5}
    pids_limit: ${OPS_FEEDBACK_MIGRATE_PIDS_LIMIT:-128}
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/ops-feedback@${OPS_FEEDBACK_DIGEST:?locks/images.lock}
    volumes: [pki-root:/etc/openit/pki:ro]   # 루트 인증서(공개). ADR 0060
    command: ["python", "-m", "ops_feedback.admin", "migrate"]
    environment:
      OPS_LOG_DATABASE_URL_FILE: /run/secrets/db-ops-log-dsn           # 소유자 계정(DDL)
      OPS_FAILURE_DATABASE_URL_FILE: /run/secrets/db-ops-failure-dsn
    secrets: [db-ops-log-dsn, db-ops-failure-dsn]
    networks: [db-ops]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp"]
    logging: *joblog
    group_add: *secretgid
    depends_on:
      postgres: {condition: service_healthy}

  ops-feedback-ingest:
    sysctls: {net.ipv4.ip_unprivileged_port_start: 0}   # 사이드카(같은 네임스페이스)가 추가 capability 없이 80/443 을 열게 한다(ADR 0060)
    <<: *hardening
    mem_limit: ${OPS_FEEDBACK_INGEST_MEM_LIMIT:-512m}      # 한도 값: 측정 안 함(시작값). docs/adr/0023-compose-resource-limits.md
    cpus: ${OPS_FEEDBACK_INGEST_CPUS:-1.0}
    pids_limit: ${OPS_FEEDBACK_INGEST_PIDS_LIMIT:-256}
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/ops-feedback@${OPS_FEEDBACK_DIGEST:?locks/images.lock}
    volumes: [pki-root:/etc/openit/pki:ro]   # 루트 인증서(공개). ADR 0060
    env_file:
      - ${CONFIG_DIR:-./config}/ops-feedback-ingest.env         # OPS_FAILURE_DB (I7 읽기 면 켜기). 비밀 아님
    environment:
      OPS_INGEST_TOKEN_FILE: /run/secrets/ops-ingest-survey-service
      OPS_READ_TOKENS_FILE: /run/secrets/ops-read-tokens
      OPS_REVIEW_TOKENS_FILE: /run/secrets/ops-review-tokens
      OPS_LOG_DATABASE_URL_FILE: /run/secrets/db-ops-log-app-dsn           # 원본 Trace 로그(PostgreSQL, D85). 앱 계정(DML만, L08)
      OPS_FAILURE_DATABASE_URL_FILE: /run/secrets/db-ops-failure-app-dsn   # 실패 사례(PostgreSQL). 앱 계정
      OPS_HOST: 127.0.0.1   # 앱은 사이드카(같은 네임스페이스)에게만 닿는다: 다른 컨테이너가 앱 포트로 직접 오지 못하게 loopback 에 바인드(계약 v3.4.2, ADR 0060)
      SSL_CERT_FILE: /etc/openit/pki/root_ca.crt   # 서비스 사이드카(ADR 0060) 인증서 검증용 루트(OpenSSL 표준, 파이썬 urllib·ssl)
      REQUESTS_CA_BUNDLE: /etc/openit/pki/root_ca.crt   # requests 계열
    secrets: [ops-ingest-survey-service, ops-read-tokens, ops-review-tokens, db-ops-log-app-dsn, db-ops-failure-app-dsn]
    tmpfs: ["/tmp", "/data"]
    networks: [serving, logs, authoring, db-ops, pki]
    depends_on:
      postgres: {condition: service_healthy}   # authoring: question-authoring의 개선 신호가 I7 읽기 면을 부른다(토큰으로 보호)
      ops-feedback-migrate: {condition: service_completed_successfully}   # L08: 스키마는 소유자 계정의 migrate 가 먼저 만든다. 서버는 verify 만 한다
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2)"]

  release-gate:
    sysctls: {net.ipv4.ip_unprivileged_port_start: 0}   # 사이드카(같은 네임스페이스)가 추가 capability 없이 80/443 을 열게 한다(ADR 0060)
    <<: *hardening
    mem_limit: ${RELEASE_GATE_MEM_LIMIT:-1g}      # 한도 값: 측정 안 함(시작값). docs/adr/0023-compose-resource-limits.md
    cpus: ${RELEASE_GATE_CPUS:-1.0}
    pids_limit: ${RELEASE_GATE_PIDS_LIMIT:-256}
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/release-gate@${RELEASE_GATE_DIGEST:?locks/images.lock}
    env_file:
      - ${CONFIG_DIR:-./config}/release-gate.env                # GATE_I1/I3 팩토리와 URL(서비스 이름). 비밀 아님
    environment: &gate_env
      GATE_READ_TOKENS_FILE: /run/secrets/gate-read-tokens
      GATE_WRITE_TOKENS_FILE: /run/secrets/gate-write-tokens
      GATE_I1_TOKEN_FILE: /run/secrets/qa-read-release-gate
      GATE_I3_TOKEN_FILE: /run/secrets/model-registry-read-release-gate
      GATE_DATABASE_URL_FILE: /run/secrets/db-gate-dsn   # 릴리스 레지스트리는 PostgreSQL(D85). 번들 파일(releases/)은 gate-data 볼륨 그대로
      GATE_HOST: 127.0.0.1   # 앱은 사이드카(같은 네임스페이스)에게만 닿는다: 다른 컨테이너가 앱 포트로 직접 오지 못하게 loopback 에 바인드(계약 v3.4.2, ADR 0060)
      SSL_CERT_FILE: /etc/openit/pki/root_ca.crt   # 서비스 사이드카(ADR 0060) 인증서 검증용 루트(OpenSSL 표준, 파이썬 urllib·ssl)
      REQUESTS_CA_BUNDLE: /etc/openit/pki/root_ca.crt   # requests 계열
    secrets: &gate_secrets [gate-read-tokens, gate-write-tokens, qa-read-release-gate, model-registry-read-release-gate, db-gate-dsn]
    volumes: [gate-data:/data, pki-root:/etc/openit/pki:ro]
    networks: [serving, release, db-gate, pki]
    stop_grace_period: 40s   # release-gate 최악 종료 시간 하드 상한 35초(요청 소켓 30s 등, 근거 release-gate docs/adr/0008-timeouts.md, 측정 안 함) + 여유 5초 -> SIGKILL 전에 끝나게 한다. 값은 scripts/test_e2e_constants.py 가 35초와 대조한다
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2)"]

  model-serving:        # 추론 서버(model-runtime, CPU/fake 변형, 문진 스키마는 이미지에 내장 D72). survey-service가 I9(HTTP)로 부른다
    sysctls: {net.ipv4.ip_unprivileged_port_start: 0}   # 사이드카(같은 네임스페이스)가 추가 capability 없이 80/443 을 열게 한다(ADR 0060)
    <<: *hardening
    mem_limit: ${MODEL_SERVING_MEM_LIMIT:-1g}      # 한도 값: 측정 안 함(시작값). docs/adr/0023-compose-resource-limits.md
    cpus: ${MODEL_SERVING_CPUS:-2.0}
    pids_limit: ${MODEL_SERVING_PIDS_LIMIT:-512}
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/model-serving@${MODEL_SERVING_DIGEST:?locks/images.lock}
    env_file:
      - ${CONFIG_DIR:-./config}/model-serving.env
    environment:
      MODEL_RUNTIME_TOKENS_FILE: /run/secrets/model-runtime-tokens
      MODEL_RUNTIME_RELEASE_TOKEN_FILE: /run/secrets/gate-read-model-serving
      MODEL_RUNTIME_HOST: 127.0.0.1   # 앱은 사이드카(같은 네임스페이스)에게만 닿는다: 다른 컨테이너가 앱 포트로 직접 오지 못하게 loopback 에 바인드(계약 v3.4.2, ADR 0060)
      SSL_CERT_FILE: /etc/openit/pki/root_ca.crt   # 서비스 사이드카(ADR 0060) 인증서 검증용 루트(OpenSSL 표준, 파이썬 urllib·ssl)
      REQUESTS_CA_BUNDLE: /etc/openit/pki/root_ca.crt   # requests 계열
    secrets: [model-runtime-tokens, gate-read-model-serving]
    volumes:
      - serving-data:/var/lib/model-runtime   # 번들 캐시 기본 경로(이미지가 uid 10001 소유로 만든다)
      - pki-root:/etc/openit/pki:ro   # 루트 인증서(공개). ADR 0060
    networks: [serving, monitoring, pki]   # monitoring: /metrics 수집 전용(ADR 0053)
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2)"]

  model-registry:       # model-lab의 I3 서버(소스 리포지토리는 model-lab, 이미지 이름은 model-registry)
    sysctls: {net.ipv4.ip_unprivileged_port_start: 0}   # 사이드카(같은 네임스페이스)가 추가 capability 없이 80/443 을 열게 한다(ADR 0060)
    <<: *hardening
    mem_limit: ${MODEL_REGISTRY_MEM_LIMIT:-512m}      # 한도 값: 측정 안 함(시작값). docs/adr/0023-compose-resource-limits.md
    cpus: ${MODEL_REGISTRY_CPUS:-1.0}
    pids_limit: ${MODEL_REGISTRY_PIDS_LIMIT:-256}
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/model-registry@${MODEL_REGISTRY_DIGEST:?locks/images.lock}
    environment:
      MODEL_REGISTRY_READ_TOKENS_FILE: /run/secrets/model-registry-read-tokens
      MODEL_REGISTRY_WRITE_TOKENS_FILE: /run/secrets/model-registry-write-tokens
      MODEL_REGISTRY_HOST: 127.0.0.1   # 앱은 사이드카(같은 네임스페이스)에게만 닿는다: 다른 컨테이너가 앱 포트로 직접 오지 못하게 loopback 에 바인드(계약 v3.4.2, ADR 0060)
      SSL_CERT_FILE: /etc/openit/pki/root_ca.crt   # 서비스 사이드카(ADR 0060) 인증서 검증용 루트(OpenSSL 표준, 파이썬 urllib·ssl)
      REQUESTS_CA_BUNDLE: /etc/openit/pki/root_ca.crt   # requests 계열
    secrets: [model-registry-read-tokens, model-registry-write-tokens]
    volumes: [models-data:/data, pki-root:/etc/openit/pki:ro]
    networks: [release, pki]
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2)"]

  dataset-store:        # synthetic-data의 I2 서버(소스 리포지토리는 synthetic-data, 이미지 이름은 dataset-store, 계약 v2.1.0 D100). 읽기=model-lab, 쓰기=synthetic-data
    sysctls: {net.ipv4.ip_unprivileged_port_start: 0}   # 사이드카(같은 네임스페이스)가 추가 capability 없이 80/443 을 열게 한다(ADR 0060)
    <<: *hardening
    mem_limit: ${DATASET_STORE_MEM_LIMIT:-512m}      # 한도 값: 측정 안 함(시작값). docs/adr/0023-compose-resource-limits.md
    cpus: ${DATASET_STORE_CPUS:-1.0}
    pids_limit: ${DATASET_STORE_PIDS_LIMIT:-256}
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/dataset-store@${DATASET_STORE_DIGEST:?locks/images.lock}
    environment:
      DATASET_STORE_READ_TOKENS_FILE: /run/secrets/dataset-store-read-tokens
      DATASET_STORE_WRITE_TOKENS_FILE: /run/secrets/dataset-store-write-tokens
      DATASET_STORE_HOST: 127.0.0.1   # 앱은 사이드카(같은 네임스페이스)에게만 닿는다: 다른 컨테이너가 앱 포트로 직접 오지 못하게 loopback 에 바인드(계약 v3.4.2, ADR 0060)
      SSL_CERT_FILE: /etc/openit/pki/root_ca.crt   # 서비스 사이드카(ADR 0060) 인증서 검증용 루트(OpenSSL 표준, 파이썬 urllib·ssl)
      REQUESTS_CA_BUNDLE: /etc/openit/pki/root_ca.crt   # requests 계열
    secrets: [dataset-store-read-tokens, dataset-store-write-tokens]
    volumes: [datasets-data:/data, pki-root:/etc/openit/pki:ro]   # 이미지의 DATASET_STORE_ROOT=/data (uid 10001 소유). 서버의 임시 폴더(/data/.tmp)도 같은 볼륨이라 게시 rename 이 원자적이다. 루트는 read_only
    networks: [datasets, pki]
    stop_grace_period: 40s   # 서버는 SIGTERM 에서 진행 중 요청을 끝까지 기다린다(daemon_threads=False). 요청 소켓 timeout 30초(DATASET_STORE_SOCKET_TIMEOUT 기본) + 여유 10초. 하드 상한은 그 영역이 확정하지 않았다(큰 게시·느린 읽기는 더 걸릴 수 있다, 측정 안 함). SIGKILL 이어도 게시는 임시 폴더 후 rename 이라 반쯤 쓴 버전이 보이지 않는다(synthetic-data ADR 0008·0012). 근거 docs/adr/0032-dataset-store-boundary.md
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2)"]

  # 주기 잡: 상시 서비스가 아니다. systemd timer(config/systemd/openit-<잡>.timer, ADR 0036)가 scripts/run-job.sh 로 `docker compose run --rm <잡>` 을 한 번 실행한다(D39).
  # 이웃 서비스와 같은 이미지·볼륨·네트워크를 쓰되 쓰기 주체는 같은 영역이다.
  job-ops-feedback:
    profiles: ["jobs"]
    mem_limit: ${JOB_OPS_FEEDBACK_MEM_LIMIT:-1g}      # 한도 값: 측정 안 함(시작값). docs/adr/0023-compose-resource-limits.md
    cpus: ${JOB_OPS_FEEDBACK_CPUS:-1.0}
    pids_limit: ${JOB_OPS_FEEDBACK_PIDS_LIMIT:-256}
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/ops-feedback@${OPS_FEEDBACK_DIGEST:?locks/images.lock}
    command: ["python", "-m", "ops_feedback.job", "--config", "/config/job.yaml"]
    environment:
      OPS_DEID_SALT_FILE: /run/secrets/deid-salt
      OPS_GATE_READ_TOKEN_FILE: /run/secrets/gate-read-ops-feedback
      OPS_GATE_WRITE_TOKEN_FILE: /run/secrets/gate-write-ops-feedback
      OPS_LOG_DATABASE_URL_FILE: /run/secrets/db-ops-log-app-dsn           # 앱 계정(DML만, L08)
      OPS_FAILURE_DATABASE_URL_FILE: /run/secrets/db-ops-failure-app-dsn
      OPS_DB_SCHEMA: verify   # L08: 잡도 스키마를 만들지 않는다(apply 는 시작 거부). 계약 OpsFeedbackServerEnv 기본값과 같다
      SSL_CERT_FILE: /etc/openit/pki/root_ca.crt   # 서비스 사이드카(ADR 0060) 인증서 검증용 루트(OpenSSL 표준, 파이썬 urllib·ssl)
      REQUESTS_CA_BUNDLE: /etc/openit/pki/root_ca.crt   # requests 계열
    secrets: [deid-salt, gate-read-ops-feedback, gate-write-ops-feedback, db-ops-log-app-dsn, db-ops-failure-app-dsn]
    depends_on:
      ops-feedback-migrate: {condition: service_completed_successfully}
    volumes:
      - ${OPS_JOB_CONFIG:-./config/ops-feedback-job.yaml}:/config/job.yaml:ro
      - pki-root:/etc/openit/pki:ro   # 루트 인증서(공개). ADR 0060
    networks: [logs, release, db-ops]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    logging: *joblog
    group_add: *secretgid
    tmpfs: ["/tmp", "/data"]

  job-survey-purge:             # 보존 정리(D88/U4): 끝난 지 SURVEY_SESSION_RETENTION_DAYS(survey.env, 90일) 지난 세션을 지운다. 지운 개수만 한 줄로 출력한다
    profiles: ["jobs"]
    mem_limit: ${JOB_SURVEY_PURGE_MEM_LIMIT:-256m}      # 한도 값: 측정 안 함(시작값). docs/adr/0023-compose-resource-limits.md
    cpus: ${JOB_SURVEY_PURGE_CPUS:-0.5}
    pids_limit: ${JOB_SURVEY_PURGE_PIDS_LIMIT:-128}
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/survey-service@${SURVEY_SERVICE_DIGEST:?locks/images.lock}
    volumes: [pki-root:/etc/openit/pki:ro]   # 루트 인증서(공개). ADR 0060
    command: ["python", "-m", "survey_service", "purge"]
    env_file:
      - ${CONFIG_DIR:-./config}/survey.env
    environment: *survey_env   # 12-Factor XII(관리 프로세스): 일회성 관리 작업은 상시 프로세스와 같은 환경·비밀로 실행한다. 서버와 갈라지면 계약 Env 선언(토큰 anyOf 등)이 잡을 거부했다(3차 E2E 보존 정리 잡)
    secrets: *survey_secrets
    networks: [db-survey]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    logging: *joblog
    group_add: *secretgid
    tmpfs: ["/tmp", "/data"]

  job-question-authoring-purge: # 보존 정리 run-once(question-authoring, D88/U4, 멱등): 처리되지 않은 초안과 고아 원본 자료를 보존 일수 뒤 지운다. 버전·검수는 지우지 않는다
    mem_limit: ${JOB_QUESTION_AUTHORING_PURGE_MEM_LIMIT:-256m}
    cpus: ${JOB_QUESTION_AUTHORING_PURGE_CPUS:-0.5}
    pids_limit: ${JOB_QUESTION_AUTHORING_PURGE_PIDS_LIMIT:-100}
    profiles: ["jobs"]
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/question-authoring@${QUESTION_AUTHORING_DIGEST:?locks/images.lock}
    volumes: [pki-root:/etc/openit/pki:ro]   # 루트 인증서(공개). ADR 0060
    command: ["python", "-m", "question_authoring", "purge"]
    env_file:
      - ${CONFIG_DIR:-./config}/question-authoring.env
    environment: *qa_env   # 12-Factor XII(관리 프로세스): 일회성 관리 작업은 상시 프로세스와 같은 환경·비밀로 실행한다. 서버와 갈라지면 계약 Env 선언(토큰 anyOf 등)이 잡을 거부했다(3차 E2E 보존 정리 잡)
    secrets: *qa_secrets
    networks: [db-qa]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp", "/data"]
    logging: *joblog
    group_add: *secretgid

  job-release-gate-prune:       # 보존 정리 run-once(release-gate CR-0008, 멱등). 번들 파일은 gate-data 에서 정리하므로 서버와 같은 볼륨을 쓴다. 미리 보려면 인자 --dry-run
    mem_limit: ${JOB_RELEASE_GATE_PRUNE_MEM_LIMIT:-256m}
    cpus: ${JOB_RELEASE_GATE_PRUNE_CPUS:-0.5}
    pids_limit: ${JOB_RELEASE_GATE_PRUNE_PIDS_LIMIT:-100}
    profiles: ["jobs"]
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/release-gate@${RELEASE_GATE_DIGEST:?locks/images.lock}
    command: ["python", "-m", "release_gate", "prune"]
    env_file:
      - ${CONFIG_DIR:-./config}/release-gate.env
    environment: *gate_env   # 12-Factor XII(관리 프로세스): 일회성 관리 작업은 상시 프로세스와 같은 환경·비밀로 실행한다. 서버와 갈라지면 계약 Env 선언(토큰 anyOf 등)이 잡을 거부했다(3차 E2E 보존 정리 잡)
    secrets: *gate_secrets
    volumes: [gate-data:/data, pki-root:/etc/openit/pki:ro]
    networks: [db-gate]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp"]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
    group_add: *secretgid

  job-release-gate-collect:     # 후보 수집기 run-once(D39). I1·I3를 HTTP로 읽어 새 조합을 접수한다
    profiles: ["jobs"]
    mem_limit: ${JOB_RELEASE_GATE_COLLECT_MEM_LIMIT:-512m}      # 한도 값: 측정 안 함(시작값). docs/adr/0023-compose-resource-limits.md
    cpus: ${JOB_RELEASE_GATE_COLLECT_CPUS:-1.0}
    pids_limit: ${JOB_RELEASE_GATE_COLLECT_PIDS_LIMIT:-256}
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/release-gate@${RELEASE_GATE_DIGEST:?locks/images.lock}
    command: ["python", "-m", "release_gate", "collect"]
    env_file:
      - ${CONFIG_DIR:-./config}/release-gate.env
    environment: *gate_env   # 12-Factor XII(관리 프로세스): 일회성 관리 작업은 상시 프로세스와 같은 환경·비밀로 실행한다. 서버와 갈라지면 계약 Env 선언(토큰 anyOf 등)이 잡을 거부했다(3차 E2E 보존 정리 잡)
    secrets: *gate_secrets
    volumes: [gate-data:/data, pki-root:/etc/openit/pki:ro]
    networks: [release, db-gate]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    logging: *joblog
    group_add: *secretgid
    tmpfs: ["/tmp"]
