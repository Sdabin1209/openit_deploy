    cap_drop: ["ALL"]
    tmpfs: ["/tmp", "/opt/keycloak/data/tmp", "/opt/keycloak/data/import"]   # 이미지가 쓰는 곳(platform docs/boundary.md 마운트 규칙)
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
    group_add: *secretgid
    mem_limit: ${KEYCLOAK_MEM_LIMIT:-1g}      # 한도 값: 측정 안 함(시작값). docs/adr/0023-compose-resource-limits.md
    cpus: ${KEYCLOAK_CPUS:-1.0}
    pids_limit: ${KEYCLOAK_PIDS_LIMIT:-512}
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/identity@${IDENTITY_DIGEST:?locks/images.lock}
    read_only: true
    volumes: [pki-root:/etc/openit/pki:ro]   # 루트 인증서(공개): IDENTITY_ROOT_CA
    environment:
      IDENTITY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:?scripts/lib.sh 가 GATEWAY_HOSTS 에서 만든다}   # 공개 입구의 공개 주소(GATEWAY_HOSTS 첫 항목 + 포트). 발급자·되돌아올 주소는 이미지가 만든다
      IDENTITY_CLIENT_SECRET_FILE: /run/secrets/identity-client-secret
      IDENTITY_ROOT_CA: /etc/openit/pki/root_ca.crt
      IDENTITY_DB_URL_FILE: /run/secrets/identity-db-url
      IDENTITY_ADMIN_PASSWORD_FILE: /run/secrets/identity-admin-password
      IDENTITY_INITIAL_ADMIN_PASSWORD_FILE: /run/secrets/identity-initial-admin-password
    secrets: [identity-client-secret, identity-db-url, identity-admin-password, identity-initial-admin-password]
    network_mode: "service:identity-net"   # 망·별칭·sysctls 는 identity-net(pause) 이 갖는다: 앱이 멈춰도 네트워크 공간이 남는다(RUNTIME.md R3.2, ADR 0060)
    depends_on:
      identity-db: {condition: service_healthy}
    healthcheck:   # 영역 게이트웨이가 상류로 쓰는 루프백 포트(8080)가 열렸는지만 본다(이미지 내부 점검 경로를 deploy 가 알지 않는다)
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s   # 첫 기동은 realm 가져오기를 한다(측정 전, 시작값)

  identity-proxy-net:   # oauth2-proxy 의 네트워크 공간만 갖는 작은 컨테이너(Kubernetes Pod 의 pause 와 같은 방식, RUNTIME.md R3.2/DC-NET.1): 망·별칭·게시 포트·extra_hosts·sysctls 는 여기에만 둔다. 앱·사이드카가 network_mode: service:identity-proxy-net 으로 붙는다. 앱이 멈춰도 공간이 남아 사이드카가 살아 있다(ADR 0060)
    image: ${PAUSE_IMAGE:?locks/images.lock}
    restart: unless-stopped
    user: "65535:65535"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 32m   # 16m 에서는 망이 여러 개인 영역 pod 의 init 이 OOM-kill 됐다(2026-11-04 분리 배치 시험에서 관찰, 감시·백업 전용 망이 붙은 뒤). 32m 는 시작값이고 측정하지 않았다
    cpus: 0.1
    pids_limit: 16
    sysctls: {net.ipv4.ip_unprivileged_port_start: 0}   # 사이드카(같은 네임스페이스)가 추가 capability 없이 80/443 을 열게 한다(ADR 0060)
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
    networks:
      auth: {aliases: [identity-proxy]}
  identity-proxy:   # 사람 인증 확인 프록시(platform identity-proxy 이미지, oauth2-proxy 위; 계약 3.4.12 IdentityProxyEnv). OAUTH2_PROXY_* 는 이미지가 만든다(deploy 는 모른다)
    <<: *hardening
    mem_limit: ${OAUTH2_PROXY_MEM_LIMIT:-128m}      # 한도 값: 측정 안 함(시작값). docs/adr/0023-compose-resource-limits.md
    cpus: ${OAUTH2_PROXY_CPUS:-0.5}
    pids_limit: ${OAUTH2_PROXY_PIDS_LIMIT:-128}
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/identity-proxy@${IDENTITY_PROXY_DIGEST:?locks/images.lock}
    volumes: [pki-root:/etc/openit/pki:ro]   # 루트 인증서(공개): IDENTITY_ROOT_CA
    environment:
      <<: *commonenv   # OPENIT_EGRESS_PROXY: identity 호출(공개 입구가 아니라 자기 영역 게이트웨이 identity-proxy-gw 의 loopback CONNECT 출구, R1.8). 이미지의 Exposure.egress 가 identity 를 허용한다
      IDENTITY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:?scripts/lib.sh}
      IDENTITY_CLIENT_SECRET_FILE: /run/secrets/identity-client-secret
      IDENTITY_COOKIE_SECRET_FILE: /run/secrets/identity-cookie-secret
      IDENTITY_ROOT_CA: /etc/openit/pki/root_ca.crt
    secrets: [identity-client-secret, identity-cookie-secret]
    network_mode: "service:identity-proxy-net"   # 망·별칭·sysctls 는 identity-proxy-net(pause) 이 갖는다: 앱이 멈춰도 네트워크 공간이 남는다(RUNTIME.md R3.2, ADR 0060)
    depends_on:
      identity: {condition: service_healthy}

  ops-feedback-migrate:   # L08(ADR 0055): 스키마를 만드는 일회성 서비스. 소유자 계정 접속 문자열 파일만 받는다. 서버·잡은 이것이 성공한 뒤에 뜬다. 상시 서비스도 주기 잡도 아니다(restart 없음, 기본 기동에 포함)
    restart: "no"
    mem_limit: ${OPS_FEEDBACK_MIGRATE_MEM_LIMIT:-256m}      # 한도 값: 측정 안 함(시작값). docs/adr/0023-compose-resource-limits.md
    cpus: ${OPS_FEEDBACK_MIGRATE_CPUS:-0.5}
    pids_limit: ${OPS_FEEDBACK_MIGRATE_PIDS_LIMIT:-128}
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/ops-feedback@${OPS_FEEDBACK_DIGEST:?locks/images.lock}
    volumes: [pki-root:/etc/openit/pki:ro]   # 루트 인증서(공개). ADR 0060
    command: ["python", "-m", "ops_feedback.admin", "migrate"]
    environment:
      OPS_LOG_DATABASE_URL_FILE: /run/secrets/db-ops-log-dsn           # 소유자 계정(DDL)
      OPS_FAILURE_DATABASE_URL_FILE: /run/secrets/db-ops-failure-dsn
    secrets: [db-ops-log-dsn, db-ops-failure-dsn]
    networks: [db-ops]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp"]
    logging: *joblog
    group_add: *secretgid
    depends_on:
      ops-feedback-db: {condition: service_healthy}

  ops-feedback-net:   # ops-feedback 의 네트워크 공간만 갖는 작은 컨테이너(Kubernetes Pod 의 pause 와 같은 방식, RUNTIME.md R3.2/DC-NET.1): 망·별칭·게시 포트·extra_hosts·sysctls 는 여기에만 둔다. 앱·사이드카가 network_mode: service:ops-feedback-net 으로 붙는다. 앱이 멈춰도 공간이 남아 사이드카가 살아 있다(ADR 0060)
    image: ${PAUSE_IMAGE:?locks/images.lock}
    restart: unless-stopped
    user: "65535:65535"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 32m   # 16m 에서는 망이 여러 개인 영역 pod 의 init 이 OOM-kill 됐다(2026-11-04 분리 배치 시험에서 관찰, 감시·백업 전용 망이 붙은 뒤). 32m 는 시작값이고 측정하지 않았다
    cpus: 0.1
    pids_limit: 16
    sysctls: {net.ipv4.ip_unprivileged_port_start: 0}   # 사이드카(같은 네임스페이스)가 추가 capability 없이 80/443 을 열게 한다(ADR 0060)
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
    networks:
      mon-ops-feedback: {aliases: [ops-feedback]}
      backup-ops: {aliases: [ops-feedback]}
      serving-ops: {aliases: [ops-feedback]}
      logs: {aliases: [ops-feedback]}
      authoring: {aliases: [ops-feedback]}
      db-ops: {aliases: [ops-feedback]}
      gate-ops: {aliases: [ops-feedback]}   # 잡(job-ops-feedback)이 영역 pod 안에서 release-gate 를 부른다
  ops-feedback:
    <<: *hardening
    mem_limit: ${OPS_FEEDBACK_INGEST_MEM_LIMIT:-512m}      # 한도 값: 측정 안 함(시작값). docs/adr/0023-compose-resource-limits.md
    cpus: ${OPS_FEEDBACK_INGEST_CPUS:-1.0}
    pids_limit: ${OPS_FEEDBACK_INGEST_PIDS_LIMIT:-256}
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/ops-feedback@${OPS_FEEDBACK_DIGEST:?locks/images.lock}
    volumes: [pki-root:/etc/openit/pki:ro]   # 루트 인증서(공개). ADR 0060
    env_file:
      - ${CONFIG_DIR:-./config}/ops-feedback.env         # OPS_FAILURE_DB (I7 읽기 면 켜기). 비밀 아님
    environment:
      <<: *commonenv
      OPS_INGEST_TOKEN_FILE: /run/secrets/ops-ingest-survey-service
      OPS_READ_TOKENS_FILE: /run/secrets/ops-read-tokens
      OPS_REVIEW_TOKENS_FILE: /run/secrets/ops-review-tokens
      OPS_LOG_DATABASE_URL_FILE: /run/secrets/db-ops-log-app-dsn           # 원본 Trace 로그(PostgreSQL, D85). 앱 계정(DML만, L08)
      OPS_FAILURE_DATABASE_URL_FILE: /run/secrets/db-ops-failure-app-dsn   # 실패 사례(PostgreSQL). 앱 계정
      OPS_HOST: 127.0.0.1   # 앱은 사이드카(같은 네임스페이스)에게만 닿는다: 다른 컨테이너가 앱 포트로 직접 오지 못하게 loopback 에 바인드(계약 v3.4.2, ADR 0060)
      SSL_CERT_FILE: /etc/openit/pki/root_ca.crt   # 서비스 사이드카(ADR 0060) 인증서 검증용 루트(OpenSSL 표준, 파이썬 urllib·ssl)
    secrets: [ops-ingest-survey-service, ops-read-tokens, ops-review-tokens, db-ops-log-app-dsn, db-ops-failure-app-dsn]
    tmpfs: ["/tmp", "/data"]
    network_mode: "service:ops-feedback-net"   # 망·별칭·sysctls 는 ops-feedback-net(pause) 이 갖는다: 앱이 멈춰도 네트워크 공간이 남는다(RUNTIME.md R3.2, ADR 0060)
    depends_on:
      ops-feedback-db: {condition: service_healthy}   # authoring: question-authoring의 개선 신호가 I7 읽기 면을 부른다(토큰으로 보호)
      ops-feedback-migrate: {condition: service_completed_successfully}   # L08: 스키마는 소유자 계정의 migrate 가 먼저 만든다. 서버는 verify 만 한다
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2)"]

  release-gate-net:   # release-gate 의 네트워크 공간만 갖는 작은 컨테이너(Kubernetes Pod 의 pause 와 같은 방식, RUNTIME.md R3.2/DC-NET.1): 망·별칭·게시 포트·extra_hosts·sysctls 는 여기에만 둔다. 앱·사이드카가 network_mode: service:release-gate-net 으로 붙는다. 앱이 멈춰도 공간이 남아 사이드카가 살아 있다(ADR 0060)
