  model-runtime-tokens:
    file: ${SECRETS_DIR:-./secrets}/tokens/model-runtime-tokens
  model-registry-read-tokens:
    file: ${SECRETS_DIR:-./secrets}/tokens/model-registry-read-tokens
  model-registry-write-tokens:
