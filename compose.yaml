  survey-db-cert:   # postgres 서버 인증서(step-ca 발급, 수명 24시간 = step-ca 기본)를 받고 8시간(수명의 1/3)마다 다시 받는다. postgres 가 시작하기 전에 파일이 있어야 하므로 healthy(파일 있음)가 postgres 의 선행 조건이다. 볼륨 소유자는 up.sh 가 999 로 맞춘다(gateway-data 와 같은 방식)
    restart: unless-stopped
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/step-ca@${STEP_CA_DIGEST:?locks/images.lock}
    user: "999:999"   # postgres 와 같은 uid: 키 파일(0600)을 postgres 만 읽는다
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp"]
    mem_limit: 64m   # 측정 안 함(시작값)
    cpus: 0.25
    pids_limit: 64
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
    environment: {STEP_CA_URL: "https://step-ca:${STEP_CA_PORT:-9000}", STEP_RENEW_EXPIRES_IN: 12h}
    command: ["cert", "survey-db"]   # platform step-ca 이미지의 cert 부명령(발급 + 갱신 데몬, 이미지 HEALTHCHECK 가 만료 포함 검증)
    volumes: ["survey-db-pgtls:/certs", "pki-root:/etc/openit/pki:ro", "pki-tokens:/tokens:ro"]
    networks: [pki]
    depends_on:
      step-ca: {condition: service_healthy}
      pki-root: {condition: service_completed_successfully}
      pki-tokens: {condition: service_completed_successfully}
  survey-db:             # 영역 DB 이미지(survey-db): 초기화·계정·접속 규칙·TLS 설정은 이미지 안에서 DatabaseDeclaration 대로 한다(계약 3.4.12 AreaDatabaseEnv, D126). 인증서 갱신 반영도 이미지가 한다(reload 컨테이너 없음)
    <<: *hardening
    mem_limit: ${POSTGRES_MEM_LIMIT:-2g}      # 한도 값: 측정 안 함(시작값). docs/adr/0023-compose-resource-limits.md
    cpus: ${POSTGRES_CPUS:-2.0}
    pids_limit: ${POSTGRES_PIDS_LIMIT:-300}
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/survey-db@${SURVEY_DB_DIGEST:?locks/images.lock}
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg-superuser-survey   # 슈퍼유저 암호(공식 postgres 표준 변수, D84)
      DB_ACCOUNT_SECRETS_DIR: /run/secrets/db   # 계정마다 파일 하나(scripts/gen-db-secrets-all.sh 가 이미지 라벨 io.openit.database 로 만든다)
    secrets: [pg-superuser-survey, {source: db-account-survey-survey, target: /run/secrets/db/survey}]
    volumes:
      - survey-db-data:/var/lib/postgresql/data
      - survey-db-pgtls:/certs:ro
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETUID", "SETGID"]   # 영역 DB 이미지는 root 로 시작해 인증서 사본을 postgres 소유로 만들고 postgres 로 내린다(공식 postgres 진입점의 표준 동작: chown·gosu). 이미지가 읽는 인증서는 cert 컨테이너(999) 소유 0600 이라 DAC_OVERRIDE 도 필요하다. 나머지 능력은 cap_drop ALL 그대로
    tmpfs: ["/tmp", "/run"]   # 이미지가 /run 아래에 인증서 사본·소켓을 만든다(읽기 전용 루트)
    networks: [db-survey]
    shm_size: ${POSTGRES_SHM_SIZE:-256m}    # 측정 안 함(시작값). 기본 64m 은 병렬 쿼리·큰 덤프에서 부족할 수 있다(adr/0023-compose-resource-limits.md)
    stop_grace_period: 30s
    depends_on:
      survey-db-cert: {condition: service_healthy}
    # healthcheck 는 영역 DB 이미지의 HEALTHCHECK 를 그대로 쓴다(Docker 표준, 이미지가 준비 상태를 안다: 구조 규칙 1)
  question-authoring-db-cert:   # postgres 서버 인증서(step-ca 발급, 수명 24시간 = step-ca 기본)를 받고 8시간(수명의 1/3)마다 다시 받는다. postgres 가 시작하기 전에 파일이 있어야 하므로 healthy(파일 있음)가 postgres 의 선행 조건이다. 볼륨 소유자는 up.sh 가 999 로 맞춘다(gateway-data 와 같은 방식)
