  certs-perms:   # 일회용: 영역 게이트웨이 이미지 사용자(101)가 읽고, step-ca 이미지(uid 1000)가 토큰·루트를, 백업 저장소 이미지(65534)가 자기 인증서를 쓰게 <서비스>-cert 가 그 사용자로 쓰게 인증서 볼륨의 소유자를 맞춘다(새 이름 있는 볼륨은 root 소유)
    image: ${UTIL_IMAGE:?locks/images.lock}
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R 101:101 /c/survey-service /c/question-authoring /c/ops-feedback /c/release-gate /c/model-serving /c/model-registry /c/dataset-store /c/admin-console /c/kiosk-frontend; chown -R 1000:1000 /c/pki-tokens /c/pki-root /c/identity /c/identity-proxy; chown -R 65534:65534 /c/backup-store"]
    restart: "no"
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    network_mode: none
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
    volumes: ["certs-identity:/c/identity", "certs-identity-proxy:/c/identity-proxy", "pki-tokens:/c/pki-tokens", "pki-root:/c/pki-root", "certs-backup-store:/c/backup-store", "certs-survey-service:/c/survey-service", "certs-question-authoring:/c/question-authoring", "certs-ops-feedback:/c/ops-feedback", "certs-release-gate:/c/release-gate", "certs-model-serving:/c/model-serving", "certs-model-registry:/c/model-registry", "certs-dataset-store:/c/dataset-store", "certs-admin-console:/c/admin-console", "certs-kiosk-frontend:/c/kiosk-frontend"]
  backup-store-cert:   # 백업 저장소의 인증서: 서비스 이름 backup-store(영역 게이트웨이의 나가는 쪽 허용 상대 external:backup 은 backup-store:443)
    <<: *certinit
    user: "65534:65534"   # 저장소 이미지 사용자가 키 파일(0600)을 읽는다
    command: ["cert", "backup-store"]   # platform step-ca 이미지의 cert 부명령(발급 + 갱신 데몬, 이미지 HEALTHCHECK 가 만료 포함 검증)
    volumes: ["certs-backup-store:/certs", "pki-root:/etc/openit/pki:ro", "pki-tokens:/tokens:ro"]
    depends_on:
      step-ca: {condition: service_healthy}
      pki-root: {condition: service_completed_successfully}
      pki-tokens: {condition: service_completed_successfully}
      certs-perms: {condition: service_completed_successfully}
  backup-store-perms:   # 일회용: 새 이름 있는 볼륨은 root 소유라 저장소(uid 1000)가 못 쓴다
    image: ${UTIL_IMAGE:?locks/images.lock}
    user: "0:0"
    entrypoint: ["chown", "-R", "65534:65534", "/data"]
    restart: "no"
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    network_mode: none
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
    volumes: ["backup-store-data:/data"]
  backup-store:   # 영역 백업 저장소(platform backup-store 이미지, restic REST, --private-repos: 자격의 사용자 이름이 곧 자기 저장소 경로, TLS 443, HTTP 기본 인증; append-only 가 아니다: 영역 백업 잡이 백업 직후 forget --prune 으로 보존 상한을 지킨다, 헤드 결정·ops-feedback ADR 0032): 영역마다 다른 자격·경로·저장소 암호(RUNTIME R10.1)
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/backup-store@${BACKUP_STORE_DIGEST:?locks/images.lock}
    restart: unless-stopped
    user: "65534:65534"   # platform 이미지 입력: /data 는 uid 65534. 인증서 키는 backup-store-cert 가 이 사용자로 쓴다
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp"]
    sysctls: {net.ipv4.ip_unprivileged_port_start: 0}   # 443 을 추가 capability 없이 연다
    mem_limit: ${BACKUP_STORE_MEM_LIMIT:-256m}   # 측정 안 함(시작값)
    cpus: 0.5
    pids_limit: 128
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
    group_add: *secretgid
    environment: {OPENIT_BACKUP_PORT: "443"}   # 영역 게이트웨이 출구가 backup-store:443 을 허용한다(platform backup-store 입력). 서버는 이미지 기본 인자(--private-repos, append-only 아님)
    secrets:
      - {source: backup-survey-credentials, target: areas/survey}
      - {source: backup-qa-credentials, target: areas/qa}
      - {source: backup-ops-credentials, target: areas/ops}
      - {source: backup-gate-credentials, target: areas/gate}
      - {source: backup-models-credentials, target: areas/models}
      - {source: backup-datasets-credentials, target: areas/datasets}
    volumes: ["backup-store-data:/data", "certs-backup-store:/run/tls:ro"]   # /run/secrets/areas/<영역>: 내용 '<영역>:<암호>', 파일 이름 = 사용자 이름(platform 입력)
    networks:
      backup-survey: {aliases: [backup-store]}
      backup-qa: {aliases: [backup-store]}
      backup-ops: {aliases: [backup-store]}
      backup-gate: {aliases: [backup-store]}
      backup-models: {aliases: [backup-store]}
      backup-datasets: {aliases: [backup-store]}
    depends_on:
      backup-store-cert: {condition: service_healthy}
      backup-store-perms: {condition: service_completed_successfully}

  gateway:
    <<: *hardening
    mem_limit: ${GATEWAY_MEM_LIMIT:-256m}      # 한도 값: 측정 안 함(시작값). docs/adr/0023-compose-resource-limits.md
    cpus: ${GATEWAY_CPUS:-1.0}
    pids_limit: ${GATEWAY_PIDS_LIMIT:-256}
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/public-ingress@${PUBLIC_INGRESS_DIGEST:?locks/images.lock}   # platform 공개 입구(S9): 경로 표는 시작할 때 마운트한 영역 Exposure 선언에서 만든다. 설정은 이미지 안에 있다
    cap_add: ["NET_BIND_SERVICE"]   # caddy 바이너리에 파일 권한이 있어 cap_drop ALL이면 실행이 거부된다. 실제로는 8080을 연다
    configs:
      - {source: gateway-device-ca, target: /etc/openit/device-ca.pem}
      - {source: gateway-tls-cert, target: /etc/openit/ingress-tls/tls.crt}   # mode=files 일 때만 의미 있다(아니면 빈 파일)
    secrets: [{source: gateway-tls-key, target: /etc/openit/ingress-tls/tls.key}, gateway-registry-publish-token, model-registry-write-model-lab, survey-result-reader, qa-gateway-token, survey-api-staff, gate-write-release-approver, gate-read-release-approver, gate-read-operator, gate-write-operator, ops-read-reviewer, ops-review-reviewer, gate-read-model-serving, gateway-inference-token]
    # Caddyfile 이 {file./run/secrets/<이름>} 으로 읽는다(환경 변수 아님, docs/RUN.md 비밀 절)
    depends_on:   # 게이트웨이가 상류로 부르는 서비스는 모두 준비된 뒤에 뜬다: 앱과 그 TLS 사이드카가 둘 다 healthy (준비 전 요청은 503 이 된다, 정적 점검이 지킨다)
      kiosk-frontend: {condition: service_healthy}
      kiosk-frontend-gw: {condition: service_healthy}
      survey-service: {condition: service_healthy}
      survey-service-gw: {condition: service_healthy}
      admin-console: {condition: service_healthy}
      admin-console-gw: {condition: service_healthy}
      release-gate: {condition: service_healthy}
      release-gate-gw: {condition: service_healthy}
      ops-feedback: {condition: service_healthy}
      ops-feedback-gw: {condition: service_healthy}
      question-authoring: {condition: service_healthy}
      question-authoring-gw: {condition: service_healthy}
      model-registry: {condition: service_healthy}
      model-registry-gw: {condition: service_healthy}
      identity: {condition: service_healthy}
      identity-gw: {condition: service_healthy}
      identity-proxy-gw: {condition: service_healthy}   # 사람 인증(forward_auth): 사이드카의 healthcheck 가 oauth2-proxy 의 /ping 을 본다
      identity-proxy: {condition: service_started}
    environment:   # 비밀 아님. 사이트 이름 목록과 밖에서 보이는 HTTPS 포트(평문 포트의 리다이렉트 대상). 운영에서 병원 내부 도메인으로 바꾼다(docs/runbook.md TLS 절)
      GATEWAY_HOSTS: ${GATEWAY_HOSTS:-localhost:8443}
      INGRESS_DEVICE_CA_FILE: /etc/openit/device-ca.pem   # 기본 기기 인증(mTLS)의 기기 CA 경로(계약 3.4.13). 파일은 위 configs gateway-device-ca
      GATEWAY_PUBLIC_TLS_PORT: ${GATEWAY_PUBLIC_TLS_PORT:-8443}
      GATEWAY_PROBE_SITE: ${GATEWAY_PROBE_SITE:-gateway:8443}   # 감시(blackbox)가 게이트웨이를 https 로 부르는 사이트 이름. internal 모드에서는 내부 CA 가 이 이름 인증서도 발급한다. files/acme 모드에서는 그 인증서가 이 이름을 포함하거나 감시 대상을 GATEWAY_HOSTS 의 이름으로 바꾼다
      GATEWAY_TLS_MODE: ${GATEWAY_TLS_MODE:-internal}   # 공개 입구 인증서 출처: internal(기본)|files|acme (ADR 0060)
      GATEWAY_ACME_EMAIL: ${GATEWAY_ACME_EMAIL:-internal@invalid.example}
      GATEWAY_ACME_DIRECTORY: ${GATEWAY_ACME_DIRECTORY:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      - gateway-data:/data   # Caddy 내부 CA 와 발급 인증서를 재시작해도 유지한다(루트 인증서가 바뀌면 모든 키오스크·직원 PC가 다시 신뢰해야 한다). 소유자 정리는 scripts/up.sh
      - pki-root:/etc/openit/pki:ro   # 루트 인증서(공개). ADR 0060
      - {type: bind, source: "${SECRETS_DIR:-./secrets}/devices", target: /run/secrets/devices, read_only: true, bind: {create_host_path: false}}   # 기기 토큰 폴더(계약 PublicIngressEnv.INGRESS_DEVICE_TOKENS_DIR 기본값): 기기마다 파일 하나, 지우면 폐기
      - {type: bind, source: "${GATEWAYS_DIR:-./state/gateways}/exposures", target: /etc/openit/exposures, read_only: true, bind: {create_host_path: false}}   # 영역마다 낸 Exposure 선언(이미지 라벨 io.openit.exposure)
    tmpfs: ["/tmp", "/config:uid=10001,gid=10001"]
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT-8080}:8080"      # 평문: /healthz 만 평문, 나머지는 HTTPS 로 308
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_TLS_PORT-8443}:8443"  # HTTPS (D88/U5)
    networks: [edge, authoring, auth, ui-kiosk, ui-admin, release-mr, release-qa]   # release: 학습 서버의 패키지 게시 입구(U69, model-registry). ui: 정적 화면, serving: 게이트웨이가 release-gate의 승인 경로 네 개만 프록시한다(Caddyfile)
    healthcheck: {test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"], interval: 15s, timeout: 3s, retries: 5, start_period: 20s, start_interval: 1s}   # 왜: start_period 가 없으면 첫 확인이 interval(15초) 뒤라 healthy 가 15초 늦다(측정: 격리 시험 15.7초 -> 1.4초). 실패는 start_period 동안 retries 에 세지 않을 뿐이다

  kiosk-frontend-net:   # kiosk-frontend 의 네트워크 공간만 갖는 작은 컨테이너(Kubernetes Pod 의 pause 와 같은 방식, RUNTIME.md R3.2/DC-NET.1): 망·별칭·게시 포트·extra_hosts·sysctls 는 여기에만 둔다. 앱·사이드카가 network_mode: service:kiosk-frontend-net 으로 붙는다. 앱이 멈춰도 공간이 남아 사이드카가 살아 있다(ADR 0060)
    image: ${PAUSE_IMAGE:?locks/images.lock}
    restart: unless-stopped
    user: "65535:65535"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 32m   # 16m 에서는 망이 여러 개인 영역 pod 의 init 이 OOM-kill 됐다(2026-11-04 분리 배치 시험에서 관찰, 감시·백업 전용 망이 붙은 뒤). 32m 는 시작값이고 측정하지 않았다
    cpus: 0.1
    pids_limit: 16
    sysctls: {net.ipv4.ip_unprivileged_port_start: 0}   # 사이드카(같은 네임스페이스)가 추가 capability 없이 80/443 을 열게 한다(ADR 0060)
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
    networks:
      mon-kiosk-frontend: {aliases: [kiosk-frontend]}
      ui-kiosk: {aliases: [kiosk-frontend]}
  kiosk-frontend:       # 키오스크 앱 + 직원 콘솔 정적 이미지(포트 8080, /healthz·/readyz). /v1 은 처리하지 않는다
    environment: {<<: *commonenv, KIOSK_HOST: 127.0.0.1}   # 앱은 사이드카(같은 네임스페이스)에게만 닿는다(계약 v3.4.3, ADR 0060)
    <<: *hardening
    mem_limit: ${KIOSK_FRONTEND_MEM_LIMIT:-128m}      # 한도 값: 측정 안 함(시작값). docs/adr/0023-compose-resource-limits.md
    cpus: ${KIOSK_FRONTEND_CPUS:-0.5}
    pids_limit: ${KIOSK_FRONTEND_PIDS_LIMIT:-128}
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/kiosk-frontend@${KIOSK_FRONTEND_DIGEST:?locks/images.lock}
    volumes: [pki-root:/etc/openit/pki:ro]   # 루트 인증서(공개). ADR 0060
    network_mode: "service:kiosk-frontend-net"   # 망·별칭·sysctls 는 kiosk-frontend-net(pause) 이 갖는다: 앱이 멈춰도 네트워크 공간이 남는다(RUNTIME.md R3.2, ADR 0060)
    cap_add: ["NET_BIND_SERVICE"]   # 공식 caddy 이미지의 바이너리에 파일 권한(cap_net_bind_service)이 있어 cap_drop ALL + no-new-privileges 에서는 exec 가 거부된다(측정함: "exec /usr/bin/caddy: operation not permitted"). 실제로는 8080 을 연다. gateway 와 같은 처리
    healthcheck: {test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"], interval: 15s, timeout: 3s, retries: 5, start_period: 20s, start_interval: 1s}

  admin-console-net:   # admin-console 의 네트워크 공간만 갖는 작은 컨테이너(Kubernetes Pod 의 pause 와 같은 방식, RUNTIME.md R3.2/DC-NET.1): 망·별칭·게시 포트·extra_hosts·sysctls 는 여기에만 둔다. 앱·사이드카가 network_mode: service:admin-console-net 으로 붙는다. 앱이 멈춰도 공간이 남아 사이드카가 살아 있다(ADR 0060)
