    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETUID", "SETGID"]   # 영역 DB 이미지는 root 로 시작해 인증서 사본을 postgres 소유로 만들고 postgres 로 내린다(공식 postgres 진입점의 표준 동작: chown·gosu). 이미지가 읽는 인증서는 cert 컨테이너(999) 소유 0600 이라 DAC_OVERRIDE 도 필요하다. 나머지 능력은 cap_drop ALL 그대로
