# 단일 서버 Compose. 이미지는 digest로만 참조한다(이름:태그 금지, D07). digest는 locks/images.lock, 레지스트리 주소는 state/registry.env(또는 운영 .env).
# 사용: scripts/up.sh  (compose를 직접 부를 때는 --env-file locks/images.lock --env-file <레지스트리 env> 를 붙인다)
# 이름: 프로젝트 이름(-p)이 컨테이너·네트워크·볼륨 접두어다(운영 기본 deploy, 시험 deploy-e2e-*).
name: deploy

# 자원 한도(FAULT 점검 A9·F3·G3): 서비스마다 mem_limit·cpus·pids_limit. 값은 **시작값이며 측정 근거가 없다**(사용자 결정 아님). 환경 변수 <서비스>_MEM_LIMIT/_CPUS/_PIDS_LIMIT 로 바꾼다(config/resource-limits.env.example, ADR 0023).
# 한도가 너무 낮으면 OOM kill(컨테이너 재시작)으로 드러난다: docs/runbook.md 자원 한도 절.
x-secretgid: &secretgid ["${SECRETS_GID:?SECRETS_GID(비밀 파일의 그룹 gid). scripts/lib.sh 가 기본값 id -g 를 내보낸다}"]   # L02(ADR 0054): 비밀 파일은 640 이고 이 그룹이 읽는다. uid 는 이미지가 정한 그대로. 비밀을 읽는 모든 서비스·잡이 쓴다

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true
  tmpfs: ["/tmp"]
  logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}   # 로그는 표준 출력. 회전만 여기서
  group_add: *secretgid   # L02(ADR 0054)

x-joblog: &joblog {driver: json-file, options: {max-size: "10m", max-file: "5"}}   # job-* 는 hardening 앵커를 쓰지 않아 로그 회전을 따로 둔다(감사 A6). 값 근거: 상시 서비스와 같은 값(adr/0023-compose-resource-limits.md)

x-tls-sidecar: &tlssidecar   # 서비스 TLS 사이드카(ADR 0060): Caddy 공식 이미지(GATEWAY_IMAGE 와 같은 digest). 앱의 네트워크 네임스페이스에 붙어(network_mode: service:<앱>) step-ca 에서 ACME 로 서비스 이름 인증서를 받고 TLS 를 끝내 127.0.0.1 의 앱으로 넘긴다
  image: ${GATEWAY_IMAGE:?locks/images.lock}
  user: "65532:65532"   # 왜: 비루트. ACME 검증이 80/443 으로 오므로 사이드카가 그 포트를 열어야 하고, 추가 capability 대신 앱(네임스페이스 소유자)의 sysctl net.ipv4.ip_unprivileged_port_start=0 을 쓴다
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  entrypoint: ["sh", "-c", "cp /usr/bin/caddy /tmp/caddy && exec /tmp/caddy run --config /etc/caddy/Caddyfile"]   # 왜 복사: caddy 바이너리의 파일 권한(cap_net_bind_service)이 cap_drop ALL 에서 exec 를 막는다(Operation not permitted, 측정함). 사본은 파일 권한이 없다. 443 은 앱 네임스페이스의 sysctl 이 연다
  read_only: true
  tmpfs: ["/tmp:exec", "/data:uid=65532,gid=65532"]   # 인증서는 24시간짜리라 재기동 때 다시 받는다(저장 불필요)
  mem_limit: 64m   # 측정 안 함(시작값)
  cpus: 0.25
  pids_limit: 64
  logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
  configs: [{source: tls-sidecar, target: /etc/caddy/Caddyfile}]
  volumes: [pki-root:/etc/openit/pki:ro]
  healthcheck: {test: ["CMD", "nc", "-z", "127.0.0.1", "443"], interval: 15s, timeout: 3s, retries: 5, start_period: 20s, start_interval: 1s}
  depends_on:
    step-ca: {condition: service_healthy}
    pki-root: {condition: service_completed_successfully}

x-pyhealth: &pyhealth   # 컨테이너 안 python으로 /healthz (이미지에 curl 없음)
  interval: 15s
  timeout: 3s
  retries: 5
  start_period: 20s
  start_interval: 1s   # 왜: start_period 동안만 1초 간격으로 확인한다(기본 5초). 뜬 직후 healthy가 되어 depends_on 사슬과 `up --wait`가 빨라진다. 평시 간격(interval)은 그대로. Docker 엔진 25 이상 필요(doctor.sh가 확인)

networks:
  pki:        # step-ca(ACME)와 서비스 사이드카 사이. internal: 호스트로 열지 않는다(ADR 0060)
    internal: true
  edge:       # 외부 입구. gateway만 호스트 포트를 연다(D11)
  serving:    # 문진 서비스 런타임 경로: survey-service <-> 수집 API, 릴리스 읽기
  monitoring: # 지표 수집(U71, ADR 0053): survey-service·model-serving 의 /metrics 를 Prometheus 가 읽는 길 하나. 두 서비스와 감시 스택(compose.monitoring.yaml)만 붙는다. gateway 는 붙지 않는다(공개 노출 없음)
  ui:         # gateway <-> 정적 화면(kiosk-frontend, admin-console). internal: 정적 화면 컨테이너는 외부로 나가지 못한다
    internal: true
  authoring:  # 문항 저작
  release:    # 게이트와 그 입력·요청자(I1 읽기, 롤백 요청)
    internal: true
  logs:       # 로그 저장소(원본 Trace) 접근
    internal: true
  # PostgreSQL 접근: 서비스마다 postgres 와만 닿는 별도 네트워크(internal, 호스트로 열지 않는다). 하나로 합치면 postgres 클라이언트끼리 서로 닿는다(E2E 차단 단언이 잡았다).
  # postgres 는 아래 넷에 모두 붙는다(여러 네트워크 가입은 compose 에서 정상). 서비스끼리의 길은 serving/authoring/release 만 열어 준다.
  datasets:   # dataset-store(I2) 전용. internal: 호스트로 열지 않고 게이트웨이도 붙지 않는다(키오스크·직원 경로에서 닿지 않는다). docs/adr/0032-dataset-store-boundary.md
    internal: true
  auth:       # 사람 인증(U82): gateway <-> oauth2-proxy <-> keycloak. 호스트로 열지 않는다
    internal: true
  db-keycloak:   # keycloak <-> postgres 만
    internal: true
  db-reload:   # postgres-reload <-> postgres 만
    internal: true
  db-survey:
    internal: true
  db-qa:
    internal: true
  db-ops:     # ops-feedback 서버와 잡
    internal: true
  db-gate:    # release-gate 서버와 수집 잡
    internal: true

volumes:          # 파일 저장소는 볼륨 하나씩, 쓰기는 소유 서비스만(이웃은 HTTP와 토큰). 데이터베이스는 PostgreSQL(pg-data), 백업은 pg_dump
  survey-data:    # 릴리스 작업 폴더(releases/)만. 세션·outbox·알림은 PostgreSQL(survey)
  gate-data:      # 번들 파일 releases/ (릴리스 레지스트리 DB는 PostgreSQL(gate))
  serving-data:   # model-serving: 게이트에서 받은 번들 캐시(다시 받을 수 있어 백업 대상 아님)
  models-data:    # model-registry: 모델 패키지(어댑터 tar에서 푼 파일 레지스트리)
  datasets-data:  # dataset-store: 학습 데이터셋(DatasetManifest + files/). 쓰기는 dataset-store 서버만(D49: 이웃은 볼륨이 아니라 HTTP). 백업 대상(ADR 0032)
  gateway-data:   # gateway(Caddy)의 내부 CA 루트와 발급 인증서(/data/caddy/pki). 비밀키가 들어 있어 백업·유출에 주의
  pki-ca:         # step-ca: 루트·중간 키(암호화됨)와 DB. **비밀 키가 있다. 백업 대상(루트 키 분실 = 모든 인증서 재발급, 사람 보관: docs/runbook.md PKI 절)**
  pki-root:       # 루트 인증서(공개)만. 모든 호출자가 읽기 전용으로 마운트한다
  pg-tls:         # postgres 서버 인증서·키(step-ca 발급, 24시간 갱신)
  pg-data:        # postgres: 모든 데이터베이스(survey, qa, ops_log, ops_failure, gate). 백업은 볼륨 복사가 아니라 scripts/pg-backup.sh(pg_dump)

configs:
  gateway-tls-internal:
    file: ${CONFIG_DIR:-./config}/gateway-tls/internal.caddy
  gateway-tls-files:
    file: ${CONFIG_DIR:-./config}/gateway-tls/files.caddy
  gateway-tls-acme:
    file: ${CONFIG_DIR:-./config}/gateway-tls/acme.caddy
  gateway-tls-cert:   # 공개 인증서(비밀 아님)
    file: ${GATEWAY_TLS_CERT_FILE:-./config/gateway-tls/unused.pem}
  tls-sidecar:
    file: ${CONFIG_DIR:-./config}/tls-sidecar.caddy
  gateway-caddyfile:
    file: ${CONFIG_DIR:-./config}/Caddyfile
  gateway-auth:
    file: ${CONFIG_DIR:-./config}/gateway-auth.caddy   # 개별 계정 인증 블록(해시)과 계정 -> 역할(staff, operator, release-approver, reviewer) 매핑(비밀, D85 E절)
  gateway-device-tls:
    file: ${DEVICE_TLS_CONF:-./config/device-tls.caddy}   # 클라이언트 인증서 검증 조각(기본은 꺼짐, ADR 0040)
  gateway-device-ca:
    file: ${DEVICE_CA_FILE:-./config/device-ca.pem}   # 키오스크 기기 인증서의 신뢰 CA(비밀 아님)
  gateway-devices:
    file: ${SECRETS_DIR:-./secrets}/gateway-devices.caddy    # 키오스크 기기 토큰 목록(비밀, D85 F절)

# 비밀(D84): 토큰·salt는 환경 변수가 아니라 파일로 마운트한다(/run/secrets/<이름>, 읽기 전용). 서비스에는 NAME_FILE=/run/secrets/<이름> 경로만 환경 변수로 준다(경로는 비밀이 아니다).
# 파일은 scripts/gen-secrets.sh 가 ${SECRETS_DIR}/tokens/<이름> 에 만든다(값 하나, 목록 값은 서비스가 받는 형식 그대로 한 줄).
# env_file 로 토큰을 넣지 않는다: docker inspect / docker exec env 로 평문이 읽히기 때문이다. scripts/check-secrets-hidden.sh 가 이를 검사한다.
# PostgreSQL: postgres-password(슈퍼유저)와 db-<이름>-password(계정 암호)는 postgres 서비스만 마운트한다(초기화 스크립트가 읽는다).
#   db-<이름>-dsn(접속 문자열)은 소유 서비스가 영역이 PostgreSQL로 바뀔 때 마운트한다(이름 규칙은 docs/RUN.md 4-1-1).
secrets:
  gateway-tls-key:     # mode=files 일 때 인증서 키(비밀 파일, D84). 아니면 빈 파일
    file: ${GATEWAY_TLS_KEY_FILE:-./config/gateway-tls/unused.pem}
  step-ca-password:     # step-ca 가 루트·중간 키를 암호화하는 비밀번호(gen-secrets.sh 가 1회 만든다)
    file: ${SECRETS_DIR:-./secrets}/tokens/step-ca-password
  postgres-password:
    file: ${SECRETS_DIR:-./secrets}/tokens/postgres-password
  db-survey-password:
    file: ${SECRETS_DIR:-./secrets}/tokens/db-survey-password
  db-qa-password:
    file: ${SECRETS_DIR:-./secrets}/tokens/db-qa-password
  db-ops-log-password:
    file: ${SECRETS_DIR:-./secrets}/tokens/db-ops-log-password
  db-ops-failure-password:
    file: ${SECRETS_DIR:-./secrets}/tokens/db-ops-failure-password
  db-ops-log-app-password:      # L08: 앱 계정(DML만) 암호는 postgres 초기화만 읽는다
    file: ${SECRETS_DIR:-./secrets}/tokens/db-ops-log-app-password
  db-ops-failure-app-password:
    file: ${SECRETS_DIR:-./secrets}/tokens/db-ops-failure-app-password
  db-gate-password:
    file: ${SECRETS_DIR:-./secrets}/tokens/db-gate-password
  db-keycloak-password:          # Keycloak 의 데이터베이스 계정 암호(U82). keycloak 서비스가 쓴다(postgres 초기화도 읽는다)
    file: ${SECRETS_DIR:-./secrets}/tokens/db-keycloak-password
  keycloak-secrets.conf:              # Keycloak --config-file: db-password, bootstrap-admin-password (원본 값은 tokens/db-keycloak-password, tokens/keycloak-bootstrap-admin-password)
    file: ${SECRETS_DIR:-./secrets}/keycloak-secrets.conf
  keycloak-realm.json:                # realm 가져오기 파일(비밀 값 포함: 클라이언트 비밀, 초기 admin 임시 비밀번호). 원본 값은 tokens/oauth2-proxy-client-secret, tokens/openit-initial-admin-password
    file: ${SECRETS_DIR:-./secrets}/keycloak-realm.json
  oauth2-proxy-client-secret:         # Keycloak 클라이언트 openit-gateway 의 비밀(Keycloak 이 realm 가져올 때, oauth2-proxy 가 토큰 교환 때 읽는다)
    file: ${SECRETS_DIR:-./secrets}/tokens/oauth2-proxy-client-secret
  oauth2-proxy-cookie-secret:         # oauth2-proxy 세션 쿠키 암호화 키(32자)
    file: ${SECRETS_DIR:-./secrets}/tokens/oauth2-proxy-cookie-secret
  db-survey-dsn:
    file: ${SECRETS_DIR:-./secrets}/tokens/db-survey-dsn
  db-qa-dsn:
    file: ${SECRETS_DIR:-./secrets}/tokens/db-qa-dsn
  db-ops-log-dsn:
    file: ${SECRETS_DIR:-./secrets}/tokens/db-ops-log-dsn
  db-ops-failure-dsn:           # 소유자 계정(스키마를 만든다). ops-feedback-migrate 만 쓴다(L08)
    file: ${SECRETS_DIR:-./secrets}/tokens/db-ops-failure-dsn
  db-ops-log-app-dsn:           # 앱 계정(DML만). 서버·잡이 쓴다(L08)
    file: ${SECRETS_DIR:-./secrets}/tokens/db-ops-log-app-dsn
  db-ops-failure-app-dsn:
    file: ${SECRETS_DIR:-./secrets}/tokens/db-ops-failure-app-dsn
  db-gate-dsn:
    file: ${SECRETS_DIR:-./secrets}/tokens/db-gate-dsn
  qa-gateway-token:
    file: ${SECRETS_DIR:-./secrets}/tokens/qa-gateway-token
  qa-gateway-tokens:
    file: ${SECRETS_DIR:-./secrets}/tokens/qa-gateway-tokens
  survey-kiosk-device-tokens:
    file: ${SECRETS_DIR:-./secrets}/tokens/survey-kiosk-device-tokens
  survey-api-staff:
    file: ${SECRETS_DIR:-./secrets}/tokens/survey-api-staff
  gate-write-release-approver:
    file: ${SECRETS_DIR:-./secrets}/tokens/gate-write-release-approver
  gate-read-release-approver:
    file: ${SECRETS_DIR:-./secrets}/tokens/gate-read-release-approver
  survey-result-reader:
    file: ${SECRETS_DIR:-./secrets}/tokens/survey-result-reader
  survey-risk-source:
    file: ${SECRETS_DIR:-./secrets}/tokens/survey-risk-source
  gate-read-operator:
    file: ${SECRETS_DIR:-./secrets}/tokens/gate-read-operator
  gate-write-operator:
    file: ${SECRETS_DIR:-./secrets}/tokens/gate-write-operator
  ops-read-reviewer:
    file: ${SECRETS_DIR:-./secrets}/tokens/ops-read-reviewer
  ops-review-reviewer:
    file: ${SECRETS_DIR:-./secrets}/tokens/ops-review-reviewer
  gate-read-survey-service:
    file: ${SECRETS_DIR:-./secrets}/tokens/gate-read-survey-service
  ops-ingest-survey-service:
    file: ${SECRETS_DIR:-./secrets}/tokens/ops-ingest-survey-service
  inference-survey-service:
    file: ${SECRETS_DIR:-./secrets}/tokens/inference-survey-service
  qa-read-release-gate:
    file: ${SECRETS_DIR:-./secrets}/tokens/qa-read-release-gate
  model-registry-read-release-gate:
    file: ${SECRETS_DIR:-./secrets}/tokens/model-registry-read-release-gate
  deid-salt:
    file: ${SECRETS_DIR:-./secrets}/tokens/deid-salt
  gate-read-ops-feedback:
    file: ${SECRETS_DIR:-./secrets}/tokens/gate-read-ops-feedback
  gate-write-ops-feedback:
    file: ${SECRETS_DIR:-./secrets}/tokens/gate-write-ops-feedback
  ops-read-question-authoring:
    file: ${SECRETS_DIR:-./secrets}/tokens/ops-read-question-authoring
  gate-read-model-serving:
    file: ${SECRETS_DIR:-./secrets}/tokens/gate-read-model-serving
  gateway-inference-token:
    file: ${SECRETS_DIR:-./secrets}/tokens/gateway-inference-token
  gateway-registry-publish-token:   # 학습 서버가 게이트웨이에 내는 게시 기계 토큰(U69, Caddyfile @registrymachine)
    file: ${SECRETS_DIR:-./secrets}/tokens/gateway-registry-publish-token
  model-registry-write-model-lab:   # 게이트웨이가 model-registry 에 붙이는 쓰기 토큰(model-registry-write-tokens 목록의 model-lab 항목과 같은 값)
    file: ${SECRETS_DIR:-./secrets}/tokens/model-registry-write-model-lab
  gate-read-tokens:
