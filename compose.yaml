# 단일 서버 Compose. 이미지는 digest로만 참조한다(이름:태그 금지, D07). digest는 locks/images.lock, 레지스트리 주소는 state/registry.env(또는 운영 .env).
# 사용: scripts/up.sh  (compose를 직접 부를 때는 --env-file locks/images.lock --env-file <레지스트리 env> 를 붙인다)
# 이름: 프로젝트 이름(-p)이 컨테이너·네트워크·볼륨 접두어다(운영 기본 deploy, 시험 deploy-e2e-*).
name: deploy

# 자원 한도(FAULT 점검 A9·F3·G3): 서비스마다 mem_limit·cpus·pids_limit. 값은 **시작값이며 측정 근거가 없다**(사용자 결정 아님). 환경 변수 <서비스>_MEM_LIMIT/_CPUS/_PIDS_LIMIT 로 바꾼다(config/resource-limits.env.example, ADR 0023).
# 한도가 너무 낮으면 OOM kill(컨테이너 재시작)으로 드러난다: docs/runbook.md 자원 한도 절.
x-secretgid: &secretgid ["${SECRETS_GID:?SECRETS_GID(비밀 파일의 그룹 gid). scripts/lib.sh 가 기본값 id -g 를 내보낸다}"]   # L02(ADR 0054): 비밀 파일은 640 이고 이 그룹이 읽는다. uid 는 이미지가 정한 그대로. 비밀을 읽는 모든 서비스·잡이 쓴다

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true
  tmpfs: ["/tmp"]
  logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}   # 로그는 표준 출력. 회전만 여기서
  group_add: *secretgid   # L02(ADR 0054)

x-joblog: &joblog {driver: json-file, options: {max-size: "10m", max-file: "5"}}   # job-* 는 hardening 앵커를 쓰지 않아 로그 회전을 따로 둔다(감사 A6). 값 근거: 상시 서비스와 같은 값(adr/0023-compose-resource-limits.md)

x-common-env: &commonenv   # CommonEnv(계약): 모든 영역 컨테이너가 받는 공통 환경. OPENIT_EGRESS_PROXY 는 자기 영역 게이트웨이의 loopback CONNECT 출구다(서비스 이름 주소 금지, R1.8)
  OPENIT_EGRESS_PROXY: "http://127.0.0.1:3128"

x-area-gateway: &areagw   # 영역 게이트웨이(platform 이미지, ADR 0063): 영역마다 하나를 그 영역의 네트워크 공간(<서비스>-net)에 둔다. 들어오는 쪽 443(서비스 이름 인증서)과 나가는 쪽 loopback 3128(CONNECT, 허용 목록은 영역 Exposure.egress). 설정은 이미지가 시작할 때 마운트된 Exposure 선언에서 만든다(deploy 는 라벨을 파일로 건넬 뿐이다)
  image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/area-gateway@${AREA_GATEWAY_DIGEST:?locks/images.lock}
  # 사용자는 이미지가 선언한 것(USER 101)을 그대로 쓴다. 인증서 키 파일의 소유자는 <서비스>-cert 가 이 사용자(101)로 쓰게 맞춘다(certs-perms)
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true
  tmpfs: ["/tmp"]
  mem_limit: ${AREA_GATEWAY_MEM_LIMIT:-128m}   # 측정 안 함(시작값)
  cpus: 0.5
  pids_limit: 128
  logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
  group_add: *secretgid
  healthcheck: {test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/443"], interval: 15s, timeout: 3s, retries: 5, start_period: 30s, start_interval: 1s}

x-certinit: &certinit   # <서비스>-cert: step 사용자(uid 1000)가 인증서 볼륨(/home/step 에 마운트해 소유자 상속)에 쓴다
  restart: unless-stopped
  image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/step-ca@${STEP_CA_DIGEST:?locks/images.lock}
  user: "1000:1000"
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true
  tmpfs: ["/tmp"]
  environment: {STEP_CA_URL: "https://step-ca:${STEP_CA_PORT:-9000}", STEP_RENEW_EXPIRES_IN: 12h}
  mem_limit: 128m   # 64m 에서 platform step-ca 이미지의 cert 부명령이 컨테이너 시작 때 OOM-kill 됐다(2026-11-04 분리 배치 시험에서 관찰). 128m 는 그 뒤의 시작값이고 이 이상은 측정하지 않았다
  cpus: 0.25
  pids_limit: 64
  logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
  group_add: *secretgid
  networks: [pki]
  depends_on:
    pki-tokens: {condition: service_completed_successfully}

x-pyhealth: &pyhealth   # 컨테이너 안 python으로 /healthz (이미지에 curl 없음)
  interval: 15s
  timeout: 3s
  retries: 5
  start_period: 20s
  start_interval: 1s   # 왜: start_period 동안만 1초 간격으로 확인한다(기본 5초). 뜬 직후 healthy가 되어 depends_on 사슬과 `up --wait`가 빨라진다. 평시 간격(interval)은 그대로. Docker 엔진 25 이상 필요(doctor.sh가 확인)

networks:
  inference-in:   # 같은 호스트의 추론 서버(compose.inference.samehost.yaml, 다른 프로젝트)가 external 로 붙는 망. release-gate 영역 게이트웨이만 별칭 release-gate 로 이 망에 있다(RUNTIME R1.5: compose 밖 호출자는 받는 영역의 게이트웨이로 바로 간다). 다른 영역은 이 망에 없다
    internal: true
  pki:        # step-ca(ACME)와 서비스 사이드카 사이. internal: 호스트로 열지 않는다(ADR 0060)
    internal: true
  edge:       # 외부 입구. gateway만 호스트 포트를 연다(D11)
  serving:    # 문진 서비스 런타임 경로: survey-service·model-serving 이 release-gate 를 읽고 survey-service 가 model-serving 을 부른다(I4·I9). gateway·ops-feedback 는 붙지 않는다(R6.2)
  monitoring: # 지표 수집(U71, ADR 0053): survey-service·model-serving 의 /metrics 를 Prometheus 가 읽는 길 하나. 두 서비스와 감시 스택(compose.monitoring.yaml)만 붙는다. gateway 는 붙지 않는다(공개 노출 없음)
  ui-kiosk:   # gateway <-> kiosk-frontend 만. internal: 정적 화면 컨테이너는 외부로 나가지 못한다. 화면별로 망을 나눈다(R6.2: 두 화면은 서로 부를 일이 없다)
    internal: true
  ui-admin:   # gateway <-> admin-console 만
    internal: true
  authoring:  # 문항 저작
  release-mr: # release-gate -> model-registry(I3 읽기), gateway -> model-registry 와 release-gate. question-authoring 은 붙지 않는다(R6.2)
    internal: true
  release-qa: # release-gate -> question-authoring(I1 읽기), gateway -> question-authoring 과 release-gate. model-registry 는 붙지 않는다(R6.2)
    internal: true
  gate-ops:   # job-ops-feedback -> release-gate 만(판정 읽기·쓰기). ops 잡은 모델 레지스트리·문항 저작을 부르지 않는다(R6.2)
    internal: true
  serving-ops: # survey-service -> ops-feedback(I6 Trace 전송) 만. release-gate·model-serving 은 붙지 않는다(R6.2)
  logs:       # 로그 저장소(원본 Trace) 접근
    internal: true
  # PostgreSQL 접근: 서비스마다 postgres 와만 닿는 별도 네트워크(internal, 호스트로 열지 않는다). 하나로 합치면 postgres 클라이언트끼리 서로 닿는다(E2E 차단 단언이 잡았다).
  # postgres 는 아래 넷에 모두 붙는다(여러 네트워크 가입은 compose 에서 정상). 서비스끼리의 길은 serving/authoring/release 만 열어 준다.
  datasets:   # dataset-store(I2) 전용. internal: 호스트로 열지 않고 게이트웨이도 붙지 않는다(키오스크·직원 경로에서 닿지 않는다). docs/adr/0032-dataset-store-boundary.md
    internal: true
  auth:       # 사람 인증(U82): gateway <-> identity-proxy <-> identity. 호스트로 열지 않는다
    internal: true
  db-identity:   # identity <-> identity-db 만
    internal: true
  backup-survey:   # 백업 저장소 <-> survey-service 영역 pod 만(영역끼리 닿지 않는다)
    internal: true
  backup-qa:   # 백업 저장소 <-> question-authoring 영역 pod 만(영역끼리 닿지 않는다)
    internal: true
  backup-ops:   # 백업 저장소 <-> ops-feedback 영역 pod 만(영역끼리 닿지 않는다)
    internal: true
  backup-gate:   # 백업 저장소 <-> release-gate 영역 pod 만(영역끼리 닿지 않는다)
    internal: true
  backup-models:   # 백업 저장소 <-> model-registry 영역 pod 만(영역끼리 닿지 않는다)
    internal: true
  backup-datasets:   # 백업 저장소 <-> dataset-store 영역 pod 만(영역끼리 닿지 않는다)
    internal: true
  mon-survey-service:   # 감시(prometheus·blackbox·json)가 survey-service 영역 pod 에 닿는 전용 망(감시 말고는 이 망에 아무도 없다: 영역끼리 닿지 않는다)
    internal: true
  mon-question-authoring:   # 감시(prometheus·blackbox·json)가 question-authoring 영역 pod 에 닿는 전용 망(감시 말고는 이 망에 아무도 없다: 영역끼리 닿지 않는다)
    internal: true
  mon-ops-feedback:   # 감시(prometheus·blackbox·json)가 ops-feedback 영역 pod 에 닿는 전용 망(감시 말고는 이 망에 아무도 없다: 영역끼리 닿지 않는다)
    internal: true
  mon-release-gate:   # 감시(prometheus·blackbox·json)가 release-gate 영역 pod 에 닿는 전용 망(감시 말고는 이 망에 아무도 없다: 영역끼리 닿지 않는다)
    internal: true
  mon-model-registry:   # 감시(prometheus·blackbox·json)가 model-registry 영역 pod 에 닿는 전용 망(감시 말고는 이 망에 아무도 없다: 영역끼리 닿지 않는다)
    internal: true
  mon-dataset-store:   # 감시(prometheus·blackbox·json)가 dataset-store 영역 pod 에 닿는 전용 망(감시 말고는 이 망에 아무도 없다: 영역끼리 닿지 않는다)
    internal: true
  mon-kiosk-frontend:   # 감시(prometheus·blackbox·json)가 kiosk-frontend 영역 pod 에 닿는 전용 망(감시 말고는 이 망에 아무도 없다: 영역끼리 닿지 않는다)
    internal: true
  mon-admin-console:   # 감시(prometheus·blackbox·json)가 admin-console 영역 pod 에 닿는 전용 망(감시 말고는 이 망에 아무도 없다: 영역끼리 닿지 않는다)
    internal: true
  db-survey:
    internal: true
  db-qa:
    internal: true
  db-ops:     # ops-feedback 서버와 잡
    internal: true
  db-gate:    # release-gate 서버와 수집 잡
    internal: true

volumes:          # 파일 저장소는 볼륨 하나씩, 쓰기는 소유 서비스만(이웃은 HTTP와 토큰). 데이터베이스는 PostgreSQL(pg-data), 백업은 pg_dump
  survey-data:    # 릴리스 작업 폴더(releases/)만. 세션·outbox·알림은 PostgreSQL(survey)
  gate-data:      # 번들 파일 releases/ (릴리스 레지스트리 DB는 PostgreSQL(gate))
  serving-data:   # model-serving: 게이트에서 받은 번들 캐시(다시 받을 수 있어 백업 대상 아님)
  models-data:    # model-registry: 모델 패키지(어댑터 tar에서 푼 파일 레지스트리)
  datasets-data:  # dataset-store: 학습 데이터셋(DatasetManifest + files/). 쓰기는 dataset-store 서버만(D49: 이웃은 볼륨이 아니라 HTTP). 백업 대상(ADR 0032)
  gateway-data:   # gateway(Caddy)의 내부 CA 루트와 발급 인증서(/data/caddy/pki). 비밀키가 들어 있어 백업·유출에 주의
  pki-ca:         # step-ca: 루트·중간 키(암호화됨)와 DB. **비밀 키가 있다. 백업 대상(루트 키 분실 = 모든 인증서 재발급, 사람 보관: docs/runbook.md PKI 절)**
  pki-tokens:     # 일회용 토큰(OTT). 5분 안에 쓰이지 않으면 무효
  certs-backup-store:
  backup-store-data:   # 영역 백업 저장소(platform backup-store, --private-repos). 서버 밖 저장소로 바꿀 수 있다
  certs-survey-service:
  certs-question-authoring:
  certs-ops-feedback:
  certs-release-gate:
  certs-model-serving:
  certs-model-registry:
  certs-dataset-store:
  certs-admin-console:
  certs-kiosk-frontend:
  certs-identity:
  certs-identity-proxy:
  pki-root:       # 루트 인증서(공개)만. 모든 호출자가 읽기 전용으로 마운트한다
  survey-db-data:   # survey-db: 이 영역의 데이터베이스. 백업은 볼륨 복사가 아니라 영역의 백업 잡(pg_dump)
  survey-db-pgtls:   # survey-db 서버 인증서·키(step-ca 발급)
  question-authoring-db-data:   # question-authoring-db: 이 영역의 데이터베이스. 백업은 볼륨 복사가 아니라 영역의 백업 잡(pg_dump)
  question-authoring-db-pgtls:   # question-authoring-db 서버 인증서·키(step-ca 발급)
  ops-feedback-db-data:   # ops-feedback-db: 이 영역의 데이터베이스. 백업은 볼륨 복사가 아니라 영역의 백업 잡(pg_dump)
  ops-feedback-db-pgtls:   # ops-feedback-db 서버 인증서·키(step-ca 발급)
  release-gate-db-data:   # release-gate-db: 이 영역의 데이터베이스. 백업은 볼륨 복사가 아니라 영역의 백업 잡(pg_dump)
  release-gate-db-pgtls:   # release-gate-db 서버 인증서·키(step-ca 발급)
  identity-db-data:   # identity-db: 이 영역의 데이터베이스. 백업은 볼륨 복사가 아니라 영역의 백업 잡(pg_dump)
  identity-db-pgtls:   # identity-db 서버 인증서·키(step-ca 발급)

configs:
  gateway-device-ca:   # 키오스크 기기 인증서(mTLS, PUBLIC_API F절)를 검증할 기기 CA(PEM, 공개 인증서). 운영(설치처)이 준다(계약 3.4.13 PublicIngressEnv.INGRESS_DEVICE_CA_FILE, 필수). 시험 폴더(--test-fixtures)에는 gen-secrets.sh 가 시험 CA 를 만든다
    file: ${DEVICE_CA_FILE:?기기 CA 파일(PEM) 경로가 필요하다. 운영이 준다}
  gateway-tls-cert:   # 공개 인증서(비밀 아님). files 모드(GATEWAY_TLS_MODE=files)에서만 쓰인다(계약 PublicIngressEnv.INGRESS_TLS_DIR 의 tls.crt)
    file: ${GATEWAY_TLS_CERT_FILE:-./config/unused.pem}

# 비밀(D84): 토큰·salt는 환경 변수가 아니라 파일로 마운트한다(/run/secrets/<이름>, 읽기 전용). 서비스에는 NAME_FILE=/run/secrets/<이름> 경로만 환경 변수로 준다(경로는 비밀이 아니다).
# 파일은 scripts/gen-secrets.sh 가 ${SECRETS_DIR}/tokens/<이름> 에 만든다(값 하나, 목록 값은 서비스가 받는 형식 그대로 한 줄).
# env_file 로 토큰을 넣지 않는다: docker inspect / docker exec env 로 평문이 읽히기 때문이다. scripts/check-secrets-hidden.sh 가 이를 검사한다.
# PostgreSQL: pg-superuser-<영역>(슈퍼유저)와 db-<이름>-password(계정 암호)는 그 영역의 DB 서비스(<서비스>-db)만 마운트한다(초기화 스크립트가 읽는다).
#   db-<이름>-dsn(접속 문자열)은 소유 서비스가 영역이 PostgreSQL로 바뀔 때 마운트한다(이름 규칙은 docs/RUN.md 4-1-1).
secrets:
  gateway-tls-key:     # mode=files 일 때 인증서 키(비밀 파일, D84). 아니면 빈 파일
    file: ${GATEWAY_TLS_KEY_FILE:-./config/unused.pem}
  step-ca-password:     # step-ca 가 루트·중간 키를 암호화하는 비밀번호(gen-secrets.sh 가 1회 만든다)
    file: ${SECRETS_DIR:-./secrets}/tokens/step-ca-password
  backup-survey-credentials:
    file: ${SECRETS_DIR:-./secrets}/tokens/backup-survey-credentials
  backup-survey-repo-password:
    file: ${SECRETS_DIR:-./secrets}/tokens/backup-survey-repo-password
  backup-qa-credentials:
    file: ${SECRETS_DIR:-./secrets}/tokens/backup-qa-credentials
  backup-qa-repo-password:
    file: ${SECRETS_DIR:-./secrets}/tokens/backup-qa-repo-password
  backup-ops-credentials:
    file: ${SECRETS_DIR:-./secrets}/tokens/backup-ops-credentials
  backup-ops-repo-password:
    file: ${SECRETS_DIR:-./secrets}/tokens/backup-ops-repo-password
  backup-gate-credentials:
    file: ${SECRETS_DIR:-./secrets}/tokens/backup-gate-credentials
  backup-gate-repo-password:
    file: ${SECRETS_DIR:-./secrets}/tokens/backup-gate-repo-password
  backup-models-credentials:
    file: ${SECRETS_DIR:-./secrets}/tokens/backup-models-credentials
  backup-models-repo-password:
    file: ${SECRETS_DIR:-./secrets}/tokens/backup-models-repo-password
  backup-datasets-credentials:
    file: ${SECRETS_DIR:-./secrets}/tokens/backup-datasets-credentials
  backup-datasets-repo-password:
    file: ${SECRETS_DIR:-./secrets}/tokens/backup-datasets-repo-password
  pg-superuser-survey:
    file: ${SECRETS_DIR:-./secrets}/tokens/pg-superuser-survey
  pg-superuser-qa:
    file: ${SECRETS_DIR:-./secrets}/tokens/pg-superuser-qa
  pg-superuser-ops:
    file: ${SECRETS_DIR:-./secrets}/tokens/pg-superuser-ops
  pg-superuser-gate:
    file: ${SECRETS_DIR:-./secrets}/tokens/pg-superuser-gate
