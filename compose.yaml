    cpus: 0.1
    pids_limit: 16
    sysctls: {net.ipv4.ip_unprivileged_port_start: 0}   # 사이드카(같은 네임스페이스)가 추가 capability 없이 80/443 을 열게 한다(ADR 0060)
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
    networks:
      mon-model-registry: {aliases: [model-registry]}
      release-mr: {aliases: [model-registry]}
      backup-models: {aliases: [model-registry]}
  model-registry:       # model-lab의 I3 서버(소스 리포지토리는 model-lab, 이미지 이름은 model-registry)
    <<: *hardening
    mem_limit: ${MODEL_REGISTRY_MEM_LIMIT:-512m}      # 한도 값: 측정 안 함(시작값). docs/adr/0023-compose-resource-limits.md
    cpus: ${MODEL_REGISTRY_CPUS:-1.0}
    pids_limit: ${MODEL_REGISTRY_PIDS_LIMIT:-256}
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/model-registry@${MODEL_REGISTRY_DIGEST:?locks/images.lock}
    environment:
      <<: *commonenv
      MODEL_REGISTRY_READ_TOKENS_FILE: /run/secrets/model-registry-read-tokens
      MODEL_REGISTRY_WRITE_TOKENS_FILE: /run/secrets/model-registry-write-tokens
      MODEL_REGISTRY_HOST: 127.0.0.1   # 앱은 사이드카(같은 네임스페이스)에게만 닿는다: 다른 컨테이너가 앱 포트로 직접 오지 못하게 loopback 에 바인드(계약 v3.4.2, ADR 0060)
      SSL_CERT_FILE: /etc/openit/pki/root_ca.crt   # 서비스 사이드카(ADR 0060) 인증서 검증용 루트(OpenSSL 표준, 파이썬 urllib·ssl)
    secrets: [model-registry-read-tokens, model-registry-write-tokens]
    volumes: [models-data:/data, pki-root:/etc/openit/pki:ro]
    network_mode: "service:model-registry-net"   # 망·별칭·sysctls 는 model-registry-net(pause) 이 갖는다: 앱이 멈춰도 네트워크 공간이 남는다(RUNTIME.md R3.2, ADR 0060)
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2)"]

  dataset-store-net:   # dataset-store 의 네트워크 공간만 갖는 작은 컨테이너(Kubernetes Pod 의 pause 와 같은 방식, RUNTIME.md R3.2/DC-NET.1): 망·별칭·게시 포트·extra_hosts·sysctls 는 여기에만 둔다. 앱·사이드카가 network_mode: service:dataset-store-net 으로 붙는다. 앱이 멈춰도 공간이 남아 사이드카가 살아 있다(ADR 0060)
    image: ${PAUSE_IMAGE:?locks/images.lock}
    restart: unless-stopped
    user: "65535:65535"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 32m   # 16m 에서는 망이 여러 개인 영역 pod 의 init 이 OOM-kill 됐다(2026-11-04 분리 배치 시험에서 관찰, 감시·백업 전용 망이 붙은 뒤). 32m 는 시작값이고 측정하지 않았다
    cpus: 0.1
    pids_limit: 16
    sysctls: {net.ipv4.ip_unprivileged_port_start: 0}   # 사이드카(같은 네임스페이스)가 추가 capability 없이 80/443 을 열게 한다(ADR 0060)
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
    networks:
      mon-dataset-store: {aliases: [dataset-store]}
      datasets: {aliases: [dataset-store]}
      backup-datasets: {aliases: [dataset-store]}
  dataset-store:        # synthetic-data의 I2 서버(소스 리포지토리는 synthetic-data, 이미지 이름은 dataset-store, 계약 v2.1.0 D100). 읽기=model-lab, 쓰기=synthetic-data
    <<: *hardening
    mem_limit: ${DATASET_STORE_MEM_LIMIT:-512m}      # 한도 값: 측정 안 함(시작값). docs/adr/0023-compose-resource-limits.md
    cpus: ${DATASET_STORE_CPUS:-1.0}
    pids_limit: ${DATASET_STORE_PIDS_LIMIT:-256}
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/dataset-store@${DATASET_STORE_DIGEST:?locks/images.lock}
    environment:
      <<: *commonenv
      DATASET_STORE_READ_TOKENS_FILE: /run/secrets/dataset-store-read-tokens
      DATASET_STORE_WRITE_TOKENS_FILE: /run/secrets/dataset-store-write-tokens
      DATASET_STORE_HOST: 127.0.0.1   # 앱은 사이드카(같은 네임스페이스)에게만 닿는다: 다른 컨테이너가 앱 포트로 직접 오지 못하게 loopback 에 바인드(계약 v3.4.2, ADR 0060)
      SSL_CERT_FILE: /etc/openit/pki/root_ca.crt   # 서비스 사이드카(ADR 0060) 인증서 검증용 루트(OpenSSL 표준, 파이썬 urllib·ssl)
    secrets: [dataset-store-read-tokens, dataset-store-write-tokens]
    volumes: [datasets-data:/data, pki-root:/etc/openit/pki:ro]   # 이미지의 DATASET_STORE_ROOT=/data (uid 10001 소유). 서버의 임시 폴더(/data/.tmp)도 같은 볼륨이라 게시 rename 이 원자적이다. 루트는 read_only
    network_mode: "service:dataset-store-net"   # 망·별칭·sysctls 는 dataset-store-net(pause) 이 갖는다: 앱이 멈춰도 네트워크 공간이 남는다(RUNTIME.md R3.2, ADR 0060)
    stop_grace_period: 40s   # 서버는 SIGTERM 에서 진행 중 요청을 끝까지 기다린다(daemon_threads=False). 요청 소켓 timeout 30초(DATASET_STORE_SOCKET_TIMEOUT 기본) + 여유 10초. 하드 상한은 그 영역이 확정하지 않았다(큰 게시·느린 읽기는 더 걸릴 수 있다, 측정 안 함). SIGKILL 이어도 게시는 임시 폴더 후 rename 이라 반쯤 쓴 버전이 보이지 않는다(synthetic-data ADR 0008·0012). 근거 docs/adr/0032-dataset-store-boundary.md
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2)"]

  # 주기 잡: 상시 서비스가 아니다. systemd timer(config/systemd/openit-<잡>.timer, ADR 0036)가 scripts/run-job.sh 로 `docker compose run --rm <잡>` 을 한 번 실행한다(D39).
  # 이웃 서비스와 같은 이미지·볼륨·네트워크를 쓰되 쓰기 주체는 같은 영역이다.
  job-ops-feedback:
    profiles: ["jobs"]
    mem_limit: ${JOB_OPS_FEEDBACK_MEM_LIMIT:-1g}      # 한도 값: 측정 안 함(시작값). docs/adr/0023-compose-resource-limits.md
    cpus: ${JOB_OPS_FEEDBACK_CPUS:-1.0}
    pids_limit: ${JOB_OPS_FEEDBACK_PIDS_LIMIT:-256}
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/ops-feedback@${OPS_FEEDBACK_DIGEST:?locks/images.lock}
    command: ["sh", "-c", "echo 잡 정의 덧씌우기 파일(compose.jobs.yaml, scripts/gen-jobs.py)이 없어 실행하지 않는다 >&2; exit 78"]   # 잡 명령은 이미지 라벨 io.openit.jobs 에서 온다(S10). 덧씌우기가 없으면 서버가 아니라 이 오류로 멈춘다
    environment:
      <<: *commonenv
      OPS_DEID_SALT_FILE: /run/secrets/deid-salt
      OPS_GATE_READ_TOKEN_FILE: /run/secrets/gate-read-ops-feedback
      OPS_GATE_WRITE_TOKEN_FILE: /run/secrets/gate-write-ops-feedback
      OPS_LOG_DATABASE_URL_FILE: /run/secrets/db-ops-log-app-dsn           # 앱 계정(DML만, L08)
      OPS_FAILURE_DATABASE_URL_FILE: /run/secrets/db-ops-failure-app-dsn
      OPS_DB_SCHEMA: verify   # L08: 잡도 스키마를 만들지 않는다(apply 는 시작 거부). 계약 OpsFeedbackServerEnv 기본값과 같다
      SSL_CERT_FILE: /etc/openit/pki/root_ca.crt   # 서비스 사이드카(ADR 0060) 인증서 검증용 루트(OpenSSL 표준, 파이썬 urllib·ssl)
    secrets: [deid-salt, gate-read-ops-feedback, gate-write-ops-feedback, db-ops-log-app-dsn, db-ops-failure-app-dsn]
    depends_on:
      ops-feedback-migrate: {condition: service_completed_successfully}
    volumes:
      - pki-root:/etc/openit/pki:ro   # 루트 인증서(공개). ADR 0060
    network_mode: "service:ops-feedback-net"   # 영역 게이트웨이 출구(loopback 3128)는 영역 pod 안에만 있다
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    logging: *joblog
    group_add: *secretgid
    tmpfs: ["/tmp", "/data"]

  job-survey-purge:             # 보존 정리(D88/U4): 끝난 지 SURVEY_SESSION_RETENTION_DAYS(survey.env, 90일) 지난 세션을 지운다. 지운 개수만 한 줄로 출력한다
    profiles: ["jobs"]
    mem_limit: ${JOB_SURVEY_PURGE_MEM_LIMIT:-256m}      # 한도 값: 측정 안 함(시작값). docs/adr/0023-compose-resource-limits.md
    cpus: ${JOB_SURVEY_PURGE_CPUS:-0.5}
    pids_limit: ${JOB_SURVEY_PURGE_PIDS_LIMIT:-128}
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/survey-service@${SURVEY_SERVICE_DIGEST:?locks/images.lock}
    volumes: [pki-root:/etc/openit/pki:ro]   # 루트 인증서(공개). ADR 0060
    command: ["sh", "-c", "echo 잡 정의 덧씌우기 파일(compose.jobs.yaml, scripts/gen-jobs.py)이 없어 실행하지 않는다 >&2; exit 78"]   # 잡 명령은 이미지 라벨 io.openit.jobs 에서 온다(S10). 덧씌우기가 없으면 서버가 아니라 이 오류로 멈춘다
    env_file:
      - ${CONFIG_DIR:-./config}/survey.env
    environment: *survey_env   # 12-Factor XII(관리 프로세스): 일회성 관리 작업은 상시 프로세스와 같은 환경·비밀로 실행한다. 서버와 갈라지면 계약 Env 선언(토큰 anyOf 등)이 잡을 거부했다(3차 E2E 보존 정리 잡)
    secrets: *survey_secrets
    networks: [db-survey]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    logging: *joblog
    group_add: *secretgid
    tmpfs: ["/tmp", "/data"]

