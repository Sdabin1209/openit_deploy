# 단일 서버 Compose. 이미지는 digest로만 참조한다(이름:태그 금지, D07). digest는 locks/images.lock, 레지스트리 주소는 state/registry.env(또는 운영 .env).
# 사용: scripts/up.sh  (compose를 직접 부를 때는 --env-file locks/images.lock --env-file <레지스트리 env> 를 붙인다)
# 이름: 프로젝트 이름(-p)이 컨테이너·네트워크·볼륨 접두어다(운영 기본 deploy, 시험 deploy-e2e-*).
name: deploy

# 자원 한도(FAULT 점검 A9·F3·G3): 서비스마다 mem_limit·cpus·pids_limit. 값은 **시작값이며 측정 근거가 없다**(사용자 결정 아님). 환경 변수 <서비스>_MEM_LIMIT/_CPUS/_PIDS_LIMIT 로 바꾼다(config/resource-limits.env.example, ADR 0023).
# 한도가 너무 낮으면 OOM kill(컨테이너 재시작)으로 드러난다: docs/runbook.md 자원 한도 절.
x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true
  tmpfs: ["/tmp"]
  logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}   # 로그는 표준 출력. 회전만 여기서

x-joblog: &joblog {driver: json-file, options: {max-size: "10m", max-file: "5"}}   # job-* 는 hardening 앵커를 쓰지 않아 로그 회전을 따로 둔다(감사 A6). 값 근거: 상시 서비스와 같은 값(adr/0023-compose-resource-limits.md)

x-pyhealth: &pyhealth   # 컨테이너 안 python으로 /healthz (이미지에 curl 없음)
  interval: 15s
  timeout: 3s
  retries: 5
  start_period: 20s
  start_interval: 1s   # 왜: start_period 동안만 1초 간격으로 확인한다(기본 5초). 뜬 직후 healthy가 되어 depends_on 사슬과 `up --wait`가 빨라진다. 평시 간격(interval)은 그대로. Docker 엔진 25 이상 필요(doctor.sh가 확인)

networks:
  edge:       # 외부 입구. gateway만 호스트 포트를 연다(D11)
  serving:    # 문진 서비스 런타임 경로: survey-service <-> 수집 API, 릴리스 읽기
  ui:         # gateway <-> 정적 화면(kiosk-frontend, admin-console). internal: 정적 화면 컨테이너는 외부로 나가지 못한다
    internal: true
  authoring:  # 문항 저작
  release:    # 게이트와 그 입력·요청자(I1 읽기, 롤백 요청)
    internal: true
  logs:       # 로그 저장소(원본 Trace) 접근
    internal: true
  # PostgreSQL 접근: 서비스마다 postgres 와만 닿는 별도 네트워크(internal, 호스트로 열지 않는다). 하나로 합치면 postgres 클라이언트끼리 서로 닿는다(E2E 차단 단언이 잡았다).
  # postgres 는 아래 넷에 모두 붙는다(여러 네트워크 가입은 compose 에서 정상). 서비스끼리의 길은 serving/authoring/release 만 열어 준다.
  datasets:   # dataset-store(I2) 전용. internal: 호스트로 열지 않고 게이트웨이도 붙지 않는다(키오스크·직원 경로에서 닿지 않는다). docs/adr/0032-dataset-store-boundary.md
    internal: true
  db-survey:
    internal: true
  db-qa:
    internal: true
  db-ops:     # ops-feedback 서버와 잡
    internal: true
  db-gate:    # release-gate 서버와 수집 잡
    internal: true

volumes:          # 파일 저장소는 볼륨 하나씩, 쓰기는 소유 서비스만(이웃은 HTTP와 토큰). 데이터베이스는 PostgreSQL(pg-data), 백업은 pg_dump
  survey-data:    # 릴리스 작업 폴더(releases/)만. 세션·outbox·알림은 PostgreSQL(survey)
  gate-data:      # 번들 파일 releases/ (릴리스 레지스트리 DB는 PostgreSQL(gate))
  serving-data:   # model-serving: 게이트에서 받은 번들 캐시(다시 받을 수 있어 백업 대상 아님)
  models-data:    # model-registry: 모델 패키지(어댑터 tar에서 푼 파일 레지스트리)
  datasets-data:  # dataset-store: 학습 데이터셋(DatasetManifest + files/). 쓰기는 dataset-store 서버만(D49: 이웃은 볼륨이 아니라 HTTP). 백업 대상(ADR 0032)
  gateway-data:   # gateway(Caddy)의 내부 CA 루트와 발급 인증서(/data/caddy/pki). 비밀키가 들어 있어 백업·유출에 주의
  pg-data:        # postgres: 모든 데이터베이스(survey, qa, ops_log, ops_failure, gate). 백업은 볼륨 복사가 아니라 scripts/pg-backup.sh(pg_dump)

configs:
  gateway-caddyfile:
    file: ${CONFIG_DIR:-./config}/Caddyfile
  gateway-accounts:
    file: ${SECRETS_DIR:-./secrets}/gateway-accounts.caddy   # 개별 계정 인증 블록(해시)과 계정 -> 역할(staff, operator, release-approver, reviewer) 매핑(비밀, D85 E절)
  gateway-device-tls:
    file: ${DEVICE_TLS_CONF:-./config/device-tls.caddy}   # 클라이언트 인증서 검증 조각(기본은 꺼짐, ADR 0040)
  gateway-device-ca:
    file: ${DEVICE_CA_FILE:-./config/device-ca.pem}   # 키오스크 기기 인증서의 신뢰 CA(비밀 아님)
  gateway-devices:
    file: ${SECRETS_DIR:-./secrets}/gateway-devices.caddy    # 키오스크 기기 토큰 목록(비밀, D85 F절)

# 비밀(D84): 토큰·salt는 환경 변수가 아니라 파일로 마운트한다(/run/secrets/<이름>, 읽기 전용). 서비스에는 NAME_FILE=/run/secrets/<이름> 경로만 환경 변수로 준다(경로는 비밀이 아니다).
# 파일은 scripts/gen-secrets.sh 가 ${SECRETS_DIR}/tokens/<이름> 에 만든다(값 하나, 목록 값은 서비스가 받는 형식 그대로 한 줄).
# env_file 로 토큰을 넣지 않는다: docker inspect / docker exec env 로 평문이 읽히기 때문이다. scripts/check-secrets-hidden.sh 가 이를 검사한다.
# PostgreSQL: postgres-password(슈퍼유저)와 db-<이름>-password(계정 암호)는 postgres 서비스만 마운트한다(초기화 스크립트가 읽는다).
#   db-<이름>-dsn(접속 문자열)은 소유 서비스가 영역이 PostgreSQL로 바뀔 때 마운트한다(이름 규칙은 docs/RUN.md 4-1-1).
secrets:
  postgres-password:
    file: ${SECRETS_DIR:-./secrets}/tokens/postgres-password
  db-survey-password:
    file: ${SECRETS_DIR:-./secrets}/tokens/db-survey-password
  db-qa-password:
    file: ${SECRETS_DIR:-./secrets}/tokens/db-qa-password
  db-ops-log-password:
    file: ${SECRETS_DIR:-./secrets}/tokens/db-ops-log-password
  db-ops-failure-password:
    file: ${SECRETS_DIR:-./secrets}/tokens/db-ops-failure-password
  db-gate-password:
    file: ${SECRETS_DIR:-./secrets}/tokens/db-gate-password
  db-survey-dsn:
    file: ${SECRETS_DIR:-./secrets}/tokens/db-survey-dsn
  db-qa-dsn:
    file: ${SECRETS_DIR:-./secrets}/tokens/db-qa-dsn
  db-ops-log-dsn:
    file: ${SECRETS_DIR:-./secrets}/tokens/db-ops-log-dsn
  db-ops-failure-dsn:
    file: ${SECRETS_DIR:-./secrets}/tokens/db-ops-failure-dsn
  db-gate-dsn:
    file: ${SECRETS_DIR:-./secrets}/tokens/db-gate-dsn
  qa-gateway-token:
    file: ${SECRETS_DIR:-./secrets}/tokens/qa-gateway-token
  qa-gateway-tokens:
    file: ${SECRETS_DIR:-./secrets}/tokens/qa-gateway-tokens
  survey-kiosk-device-tokens:
    file: ${SECRETS_DIR:-./secrets}/tokens/survey-kiosk-device-tokens
  survey-api-staff:
    file: ${SECRETS_DIR:-./secrets}/tokens/survey-api-staff
  gate-write-release-approver:
    file: ${SECRETS_DIR:-./secrets}/tokens/gate-write-release-approver
  gate-read-release-approver:
    file: ${SECRETS_DIR:-./secrets}/tokens/gate-read-release-approver
  survey-result-reader:
    file: ${SECRETS_DIR:-./secrets}/tokens/survey-result-reader
  survey-risk-source:
    file: ${SECRETS_DIR:-./secrets}/tokens/survey-risk-source
  gate-read-operator:
    file: ${SECRETS_DIR:-./secrets}/tokens/gate-read-operator
  gate-write-operator:
    file: ${SECRETS_DIR:-./secrets}/tokens/gate-write-operator
  ops-read-reviewer:
    file: ${SECRETS_DIR:-./secrets}/tokens/ops-read-reviewer
  ops-review-reviewer:
    file: ${SECRETS_DIR:-./secrets}/tokens/ops-review-reviewer
  gate-read-survey-service:
    file: ${SECRETS_DIR:-./secrets}/tokens/gate-read-survey-service
  ops-ingest-survey-service:
    file: ${SECRETS_DIR:-./secrets}/tokens/ops-ingest-survey-service
  inference-survey-service:
    file: ${SECRETS_DIR:-./secrets}/tokens/inference-survey-service
  qa-read-release-gate:
    file: ${SECRETS_DIR:-./secrets}/tokens/qa-read-release-gate
  model-registry-read-release-gate:
    file: ${SECRETS_DIR:-./secrets}/tokens/model-registry-read-release-gate
  deid-salt:
    file: ${SECRETS_DIR:-./secrets}/tokens/deid-salt
  gate-read-ops-feedback:
    file: ${SECRETS_DIR:-./secrets}/tokens/gate-read-ops-feedback
  gate-write-ops-feedback:
    file: ${SECRETS_DIR:-./secrets}/tokens/gate-write-ops-feedback
  ops-read-question-authoring:
    file: ${SECRETS_DIR:-./secrets}/tokens/ops-read-question-authoring
  gate-read-model-serving:
