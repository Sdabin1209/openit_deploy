# 단일 서버 Compose. 이미지는 digest로만 참조한다(이름:태그 금지, D07). digest는 locks/images.lock, 레지스트리 주소는 state/registry.env(또는 운영 .env).
# 사용: scripts/up.sh  (compose를 직접 부를 때는 --env-file locks/images.lock --env-file <레지스트리 env> 를 붙인다)
# 이름: 프로젝트 이름(-p)이 컨테이너·네트워크·볼륨 접두어다(운영 기본 deploy, 시험 deploy-e2e-*).
name: deploy

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true
  tmpfs: ["/tmp"]
  logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}   # 로그는 표준 출력. 회전만 여기서

x-pyhealth: &pyhealth   # 컨테이너 안 python으로 /healthz (이미지에 curl 없음)
  interval: 15s
  timeout: 3s
  retries: 5
  start_period: 20s

networks:
  edge:       # 외부 입구. gateway만 호스트 포트를 연다(D11)
  serving:    # 문진 서비스 런타임 경로: survey-service <-> 수집 API, 릴리스 읽기
  authoring:  # 문항 저작
  release:    # 게이트와 그 입력·요청자(I1 읽기, 롤백 요청)
    internal: true
  logs:       # 로그 저장소(원본 Trace) 접근
    internal: true

volumes:          # 저장소마다 볼륨 하나, 쓰기는 소유 서비스만(이웃은 HTTP와 토큰, 백업은 읽기 전용 마운트)
  survey-data:    # SURVEY_SESSION_DB, SURVEY_OUTBOX_DB, 릴리스 작업 폴더
  qa-data:        # 문항 저장소 questions.sqlite3
  ops-data:       # log.db(원본 Trace), failures.db(실패 사례)
  gate-data:      # 릴리스 레지스트리 registry.sqlite3 + releases/
  serving-data:   # model-serving: 게이트에서 받은 번들 캐시(다시 받을 수 있어 백업 대상 아님)
  models-data:    # model-registry: 모델 패키지(어댑터 tar에서 푼 파일 레지스트리)

configs:
  gateway-caddyfile:
    file: ${CONFIG_DIR:-./config}/Caddyfile

services:
  gateway:
    <<: *hardening
    image: ${GATEWAY_IMAGE:?locks/images.lock}
    user: "10001:10001"
    cap_add: ["NET_BIND_SERVICE"]   # caddy 바이너리에 파일 권한이 있어 cap_drop ALL이면 실행이 거부된다. 실제로는 8080을 연다
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile"]
    configs:
      - {source: gateway-caddyfile, target: /etc/caddy/Caddyfile}
    tmpfs: ["/tmp", "/data:uid=10001,gid=10001", "/config:uid=10001,gid=10001"]
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT-8080}:8080"
    networks: [edge]
    healthcheck: {test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"], interval: 15s, timeout: 3s, retries: 5}

  survey-service:
    <<: *hardening
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/survey-service@${SURVEY_SERVICE_DIGEST:?locks/images.lock}
    env_file:
      - ${CONFIG_DIR:-./config}/survey.env                      # I4/I6 HTTP 클라이언트의 URL(서비스 이름)과 토큰 환경 변수 이름. 비밀 아님
      - ${SECRETS_DIR:-./secrets}/survey-service.env            # SURVEY_RELEASE_READER_TOKEN, SURVEY_TRACE_INGEST_TOKEN (비밀)
    volumes: [survey-data:/data]
    networks: [edge, serving]
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2)"]
    depends_on:
      ops-feedback-ingest: {condition: service_healthy}
      release-gate: {condition: service_healthy}
      model-serving: {condition: service_healthy}

  question-authoring:
    <<: *hardening
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/question-authoring@${QUESTION_AUTHORING_DIGEST:?locks/images.lock}
    env_file:
      - ${CONFIG_DIR:-./config}/question-authoring.env          # QA_FAILURES_URL (개선 신호 수신함이 읽는 I7). 비밀 아님
      - ${SECRETS_DIR:-./secrets}/question-authoring.env        # QA_AUTHOR_TOKENS, QA_READ_TOKENS, QA_FAILURES_TOKEN (비밀)
    volumes: [qa-data:/data]
    networks: [authoring, release]
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2)"]

  ops-feedback-ingest:
    <<: *hardening
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/ops-feedback@${OPS_FEEDBACK_DIGEST:?locks/images.lock}
    env_file:
      - ${CONFIG_DIR:-./config}/ops-feedback-ingest.env         # OPS_FAILURE_DB (I7 읽기 면 켜기). 비밀 아님
      - ${SECRETS_DIR:-./secrets}/ops-feedback-ingest.env       # OPS_INGEST_TOKEN, OPS_READ_TOKENS, OPS_REVIEW_TOKENS (비밀)
    volumes: [ops-data:/data]
    networks: [serving, logs, authoring]   # authoring: question-authoring의 개선 신호가 I7 읽기 면을 부른다(토큰으로 보호)
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2)"]

  release-gate:
    <<: *hardening
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/release-gate@${RELEASE_GATE_DIGEST:?locks/images.lock}
    env_file:
      - ${SECRETS_DIR:-./secrets}/release-gate.env              # GATE_READ_TOKENS, GATE_WRITE_TOKENS, GATE_I1_TOKEN, GATE_I3_TOKEN (비밀)
      - ${CONFIG_DIR:-./config}/release-gate.env                # GATE_I1/I3 팩토리와 URL(서비스 이름). 비밀 아님
    volumes: [gate-data:/data]
    networks: [serving, release]
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2)"]

  model-serving:        # 추론 서버(model-runtime, CPU/fake 변형). survey-service가 I9(HTTP)로 부른다
    <<: *hardening
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/model-serving@${MODEL_SERVING_DIGEST:?locks/images.lock}
    env_file:
      - ${CONFIG_DIR:-./config}/model-serving.env
      - ${SECRETS_DIR:-./secrets}/model-serving.env             # MODEL_RUNTIME_TOKENS, MODEL_RUNTIME_RELEASE_TOKEN (비밀)
    volumes:
      - serving-data:/var/lib/model-runtime   # 번들 캐시 기본 경로(이미지가 uid 10001 소유로 만든다, v0.5.1)
      - ${SURVEY_SCHEMA_DIR:-./build/survey-schema}:/opt/survey-schema:ro   # 문진 스키마(이미지에 없음). build-images.sh가 survey-service 사본에서 만든다
    networks: [serving]
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2)"]

  model-registry:       # model-lab의 I3 서버(소스 리포지토리는 model-lab, 이미지 이름은 model-registry)
    <<: *hardening
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/model-registry@${MODEL_REGISTRY_DIGEST:?locks/images.lock}
    env_file: ${SECRETS_DIR:-./secrets}/model-registry.env      # MODEL_REGISTRY_READ_TOKENS, MODEL_REGISTRY_WRITE_TOKENS (비밀)
    volumes: [models-data:/data]
    networks: [release]
    healthcheck:
      <<: *pyhealth
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2)"]

  # 주기 잡: 상시 서비스가 아니다. scripts/scheduler.py 가 `docker compose run --rm <잡>` 으로 한 번 실행한다(D39).
  # 이웃 서비스와 같은 이미지·볼륨·네트워크를 쓰되 쓰기 주체는 같은 영역이다.
  job-ops-feedback:
    profiles: ["jobs"]
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/ops-feedback@${OPS_FEEDBACK_DIGEST:?locks/images.lock}
    command: ["python", "-m", "ops_feedback.job", "--config", "/config/job.yaml"]
    env_file: ${SECRETS_DIR:-./secrets}/ops-feedback-job.env     # OPS_DEID_SALT, OPS_GATE_READ_TOKEN, OPS_GATE_WRITE_TOKEN (비밀)
    volumes:
      - ops-data:/data
      - ${OPS_JOB_CONFIG:-./config/ops-feedback-job.yaml}:/config/job.yaml:ro
    networks: [logs, release]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp"]

  job-release-gate-collect:     # 후보 수집기 run-once(D39). I1·I3를 HTTP로 읽어 새 조합을 접수한다
    profiles: ["jobs"]
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/release-gate@${RELEASE_GATE_DIGEST:?locks/images.lock}
    command: ["python", "-m", "release_gate", "collect"]
    env_file:
      - ${CONFIG_DIR:-./config}/release-gate.env
      - ${SECRETS_DIR:-./secrets}/release-gate-job.env           # GATE_I1_TOKEN, GATE_I3_TOKEN (비밀)
    volumes: [gate-data:/data]
    networks: [release]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp"]
