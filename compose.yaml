services:
  step-ca:   # 독립 인증기관(사설 PKI + ACME, ADR 0060). 공식 이미지(digest 고정). 루트·중간 키는 처음 기동에 1회 만들어 pki-ca 볼륨에 둔다(비밀번호는 비밀 파일)
    restart: unless-stopped
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/step-ca@${STEP_CA_DIGEST:?locks/images.lock}
    user: "1000:1000"   # 이미지의 step 사용자(비루트)
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:exec"]   # step-ca 사본을 실행한다(파일 권한이 있는 원본은 cap_drop ALL 에서 exec 가 막힌다, 측정함)
    mem_limit: 128m   # 측정 안 함(시작값)
    cpus: 0.5
    pids_limit: 128
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
    group_add: *secretgid
    environment: {STEP_CA_PORT: "${STEP_CA_PORT:-9000}", STEP_CA_URL: "https://step-ca:${STEP_CA_PORT:-9000}", STEP_CA_DNS_NAMES: "${STEP_CA_DNS_NAMES:-}"}   # 다른 서버·시험 배치가 step-ca 를 부르는 추가 이름(공백 구분, 인증서 SAN 과 토큰 audience 에 들어간다)
    secrets: [step-ca-password]
    volumes: [pki-ca:/home/step]
    networks: [pki]
  pki-root:   # 루트 인증서(공개)를 읽기 전용 볼륨 pki-root 로 복사하는 일회성 잡. 키가 든 pki-ca 는 호출자에게 마운트하지 않는다
    restart: "no"
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/step-ca@${STEP_CA_DIGEST:?locks/images.lock}
    user: "1000:1000"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp"]
    command: ["root"]
    environment: {PKI_OUT: /out}
    volumes: ["pki-ca:/home/step:ro", "pki-root:/out"]
    networks: [pki]
    depends_on:
      certs-perms: {condition: service_completed_successfully}
      step-ca: {condition: service_healthy}
  pki-tokens:   # 서비스마다 일회용 토큰(OTT, 수명 5분 = step 기본)을 발급해 pki-tokens 볼륨에 둔다. 프로비저너 비밀번호는 이 잡만 읽는다(인증서 컨테이너는 읽지 않는다). 다른 서버의 서비스는 이 토큰 파일을 배치 도구가 그 서버에 전달한다
    restart: "no"
    image: ${DEPLOY_REGISTRY:?state/registry.env}/openit/step-ca@${STEP_CA_DIGEST:?locks/images.lock}
    user: "1000:1000"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp"]
    group_add: *secretgid
    environment: {STEP_CA_URL: "https://step-ca:${STEP_CA_PORT:-9000}"}
    command: ["token", "survey-service", "question-authoring", "ops-feedback", "release-gate", "model-serving", "model-registry", "dataset-store", "admin-console", "kiosk-frontend", "identity", "identity-proxy", "backup-store", "survey-db", "question-authoring-db", "ops-feedback-db", "release-gate-db", "identity-db"]
    secrets: [step-ca-password]
    volumes: ["pki-tokens:/tokens", "pki-root:/etc/openit/pki:ro"]
    networks: [pki]
    depends_on:
      certs-perms: {condition: service_completed_successfully}
      step-ca: {condition: service_healthy}
      pki-root: {condition: service_completed_successfully}
  survey-service-cert:   # survey-service 의 인증서: 일회용 토큰(OTT)으로 step-ca 에서 한 번 받고(step ca certificate --token), 갱신 데몬이 기존 인증서로 갱신한다(step ca renew --daemon, 도전 없음)
    <<: *certinit
    user: "101:101"   # 영역 게이트웨이 이미지의 사용자(USER 101)가 키 파일(0600)을 읽는다
    depends_on:
      step-ca: {condition: service_healthy}
      pki-root: {condition: service_completed_successfully}
      pki-tokens: {condition: service_completed_successfully}
      certs-perms: {condition: service_completed_successfully}
    command: ["cert", "survey-service"]   # platform step-ca 이미지의 cert 부명령(발급 + 갱신 데몬, 이미지 HEALTHCHECK 가 만료 포함 검증)
    volumes: ["certs-survey-service:/certs", "pki-root:/etc/openit/pki:ro", "pki-tokens:/tokens:ro"]
