# 게이트웨이 계정과 역할(D85 E절). 비밀이 아니다: 암호와 해시는 secrets/tokens/account-<계정>-password / -hash 에 있고 scripts/gen-secrets.sh 가 만든다.
# 형식: <계정 ID>  <역할[,역할...]>      역할: staff(직원 콘솔·직원 API·개입), operator(/v1/activate, /v1/rollback), release-approver(출고 승인), reviewer(실패 사례 검토),
#   author(문항 저작: 자료 등록·초안 편집·확인), clinical-reviewer(임상 근거 승인, 저자와 다른 주체여야 한다: question-authoring 4-eyes). 저작 서비스가 사용자 ID -> 역할을 QA_USER_ROLES(config/question-authoring.env)로도 정하므로 두 곳을 같게 둔다
# 계정 ID: 소문자로 시작, 소문자·숫자·.·_·- (2~32자). 게이트웨이가 인증된 계정 ID 를 X-Openit-User 로 서비스에 전한다(감사 기록의 행위자).
# 이 파일은 **운영 계정만** 둔다(기본은 비어 있다: 계정이 없으면 gateway 의 사람 인증 경로는 모두 401). 시험 계정(*-e2e)은 gateway-accounts.test.conf 에 있고 gen-secrets.sh --test-fixtures 에서만 쓰인다.
# 병원 IdP(OIDC)가 정해지면 이 파일이 아니라 secrets/gateway-accounts.caddy 의 인증 블록을 교체한다(docs/RUN.md 4-1-2).
