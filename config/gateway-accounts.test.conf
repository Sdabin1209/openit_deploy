# 시험 계정(E2E·데모 전용). scripts/gen-secrets.sh --test-fixtures 가 있을 때만 config/gateway-accounts.conf 에 더해 읽는다.
# 왜 따로인가: 시험 계정이 운영 계정 목록에 섞여 운영 gateway 에서 유효해지는 것을 막는다(시험 데이터와 운영 구성 분리: 12-factor 10항, 기본 자격 금지: OWASP).
# 운영 기동 때 scripts/check-test-fixtures.sh 가 이 파일의 계정 ID 가 gateway 계정 파일에 있는지 본다. 형식은 gateway-accounts.conf 와 같다.
staff-e2e     staff
operator-e2e  operator
trainer-e2e   release-approver
reviewer-e2e  reviewer
author-e2e    author
clinical-e2e  clinical-reviewer
