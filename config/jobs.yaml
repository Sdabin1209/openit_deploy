# 주기 잡 정의(D39). scripts/scheduler.py 가 읽는다.
# interval_seconds: 사용자 결정(D85, 표준 주기). 수집기 600초, ops-feedback 3600초, 백업 86400초. null 이면 이 스케줄러는 그 잡을 실행하지 않고 "주기 미정"으로 보고한다.
# where: serving 은 이 서버의 Compose에서 도는 잡. gpu-external 은 서빙 서버 밖의 GPU 서버에서 도는 잡(D40)이라 이 스케줄러·Compose가 실행하지 않는다.
jobs:
  - name: ops-feedback-job            # Trace 비식별, 실패 사례 게시, 롤백 평가(ops-feedback run-once)
    where: serving
    command: ["scripts/run-job.sh", "job-ops-feedback"]
    interval_seconds: 3600
  - name: survey-purge                # 세션 보존 정리(D88/U4: 종료 후 90일, 설정 config/survey.env). 멱등
    where: serving
    command: ["scripts/run-job.sh", "job-survey-purge"]
    interval_seconds: 86400
  - name: backup                      # 파일 저장소(gate-data 번들)와 PostgreSQL(pg_dump) 백업. 설정(config/backup.env)이 없으면 거부한다
    where: serving
    command: ["scripts/backup-all.sh"]
    interval_seconds: 86400
  - name: backup-restore-test         # 정기 복원 시험(D88/U6, 주 1회): 최신 백업을 임시 DB로 되살려 대조. 암호화 백업은 서버에 키가 없어 해시만 확인한다(전체 복원은 키 보유자가 서버 밖에서 분기마다)
    where: serving
    command: ["scripts/restore-test.sh"]
    interval_seconds: 604800
  - name: question-authoring-purge    # 초안·고아 원본 자료 보존 정리(D88/U4, 멱등). 하루 1회(보존 단위가 일 단위)
    where: serving
    command: ["scripts/run-job.sh", "job-question-authoring-purge"]
    interval_seconds: 86400
  - name: release-gate-prune          # 오래된 접수·파일 정리(release-gate CR-0008, 멱등). 하루 1회: 정리 대상이 하루 단위 보존 정책이라 더 자주 돌릴 이유가 없다(근거 ADR 없음: 판단, 측정 안 함)
    where: serving
    command: ["scripts/run-job.sh", "job-release-gate-prune"]
    interval_seconds: 86400
  - name: release-gate-collector      # 후보 수집기 run-once(D39). I1·I3를 HTTP로 읽어 새 조합을 접수한다(멱등)
    where: serving
    command: ["scripts/run-job.sh", "job-release-gate-collect"]
    interval_seconds: 600
  - name: release-gate-worker         # 승인 평가 워커(GPU 필요)
    where: gpu-external
    interval_seconds: null
  - name: synthetic-data              # 데이터 생성(LLM 생성은 GPU). 게시기(import) 모드는 CPU만 쓰지만 입력 jsonl의 출처·주기가 미정이라 이 Compose에 서비스를 두지 않는다(E2E 단계 2는 호스트에서 실행)
    where: gpu-external
    interval_seconds: null
  - name: model-lab-pipeline          # 학습·평가·패키징·게시
    where: gpu-external
    interval_seconds: null
