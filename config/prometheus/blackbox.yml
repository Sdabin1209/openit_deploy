modules:
  http_2xx_gateway:   # 게이트웨이 사이트 인증서 검증: 루트는 gateway-root 잡이 게이트웨이 내부 CA 에서 내보낸 공개 인증서(다른 모드면 GATEWAY_TLS_ROOT_FILE)
    prober: http
    timeout: 5s
    http:
      method: GET
      preferred_ip_protocol: ip4
      follow_redirects: false
      tls_config: {ca_file: /etc/openit/gateway-root/root.crt}
      fail_if_body_not_matches_regexp: ['"status": *"ok"']   # R5.1: 상태 코드만이 아니라 본문의 status 도 본다(빈 200 이 통과하지 않게)
  http_2xx:
    prober: http
    timeout: 5s          # 옛 check_health.py 의 요청 제한 시간(urlopen timeout=5)을 그대로 옮겼다. 측정 안 함
    http:
      method: GET
      valid_status_codes: []    # 비면 2xx 만 성공(옛: 기대 상태 코드 200)
      preferred_ip_protocol: ip4
      follow_redirects: false
      tls_config: {ca_file: /etc/openit/pki/root_ca.crt}   # 서비스 사이드카 인증서는 deploy step-ca 발급(ADR 0060)
