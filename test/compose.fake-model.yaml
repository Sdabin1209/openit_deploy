# 시험 전용(E2E·데모의 fake 모델): 다른 호스트 역할인 추론 서버(compose.inference.yaml 을 별도 프로젝트로 띄운 것)의 model-serving 에 겹친다. 제품 compose.yaml 에는 겹치지 않는다(docs/adr/0049).
# 문항 순서 파일(test/fake-model/question_flow.json)은 survey-service 의 question_flow 와 같은 순서의 시험용 사본이다. 달라지면 E2E 가 실패해 알려 준다.
# 운영 compose.yaml 에 넣지 않는다. 실제 LLM 모드(compose.llm.yaml)에는 붙이지 않는다(vllm 백엔드).
services:
  model-serving:
    environment:
      MODEL_RUNTIME_ALLOW_FAKE: "1"   # fake 백엔드는 이 값이 1이 아니면 시작을 거부한다(model-runtime ADR 0009). 시험 전용 표시
      MODEL_RUNTIME_FAKE_FLOW_FILE: /test-fake-model/question_flow.json
    volumes:
      - ./test/fake-model:/test-fake-model:ro
