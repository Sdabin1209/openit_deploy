# 시험 계정(게이트웨이 시험·E2E·데모 전용). 형식: `<계정> <역할[,역할]|->`(`-` 는 역할 없음 = 가입 승인 대기). 역할 이름은 Keycloak 그룹 이름과 같다.
# 쓰는 곳: scripts/test-gateway-auth.sh 의 가짜 oauth2-proxy 와, E2E·데모가 Keycloak 에 만드는 시험 사용자(scripts/idp-test-users.sh). 제품 구성(compose.yaml)과 운영 realm 에는 들어가지 않는다.
staff-e2e     staff
operator-e2e  operator
trainer-e2e   release-approver
reviewer-e2e  reviewer
author-e2e    author
clinical-e2e  clinical-reviewer
clinician-e2e clinician
admin-e2e     admin
multi-e2e     reviewer,clinician
both-e2e      staff,clinician
pending-e2e   -
