# 분리 배치 시험 전용 compose(대역 서비스, test/split/config/stub.py). 제품 compose.yaml 이 아니다: 이 시험은 배치(주소·게시 포트·네트워크 분리)만 본다.
# 서비스 이름은 제품과 같다(영역 이름 규칙 확인용). 이미지는 로컬의 python:3.12-slim 하나.
x-stub: &stub
  image: python:3.12-slim
  command: ["python", "/stub.py"]
  volumes: ["${CONFIG_DIR:-./config}/stub.py:/stub.py:ro"]
  healthcheck: {test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2)"], interval: 2s, timeout: 3s, retries: 15}
secrets:
  db-survey-dsn:
    file: ${SECRETS_DIR:-./secrets}/tokens/db-survey-dsn
services:
  postgres: {<<: *stub}
  keycloak: {<<: *stub, depends_on: {postgres: {condition: service_healthy}}}
  gateway: {<<: *stub}
  survey-service:
    <<: *stub
    env_file: ["${CONFIG_DIR:-./config}/survey.env"]
    secrets: [db-survey-dsn]
    depends_on: {postgres: {condition: service_healthy}, release-gate: {condition: service_healthy}}
  release-gate:
    <<: *stub
    env_file: ["${CONFIG_DIR:-./config}/release-gate.env"]
    depends_on: {question-authoring: {condition: service_healthy}}
  question-authoring:
    <<: *stub
    env_file: ["${CONFIG_DIR:-./config}/question-authoring.env"]
